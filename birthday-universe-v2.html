<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Birthday Universe</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Exo+2:ital,wght@0,300;0,400;0,600;0,700;0,800;1,300&family=Rajdhani:wght@400;500;600;700&display=swap');

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Exo 2',sans-serif;background:#050510;min-height:100vh;overflow-x:hidden;color:#fff}

/* STARFIELD CANVAS */
#starfield{position:fixed;inset:0;z-index:0;pointer-events:none}

/* NEBULA BLOBS */
.nebula{position:fixed;border-radius:50%;filter:blur(100px);opacity:.12;pointer-events:none;z-index:0}
.neb1{width:50vmax;height:50vmax;background:radial-gradient(circle,#0ff,transparent);top:-15%;left:-10%;animation:nebDrift 40s ease-in-out infinite alternate}
.neb2{width:45vmax;height:45vmax;background:radial-gradient(circle,#f0f,transparent);bottom:-15%;right:-10%;animation:nebDrift 35s ease-in-out infinite alternate-reverse}
.neb3{width:35vmax;height:35vmax;background:radial-gradient(circle,#80f,transparent);top:50%;left:40%;animation:nebDrift 45s ease-in-out infinite alternate}
@keyframes nebDrift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.15)}100%{transform:translate(-30px,40px) scale(.9)}}

/* MAIN WRAPPER */
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:20px 14px 100px}

/* ========== INPUT SCREEN ========== */
#inputScreen{text-align:center;padding-top:15vh}
.logo-title{font-family:'Orbitron',monospace;font-size:clamp(1.6rem,6vw,2.4rem);font-weight:900;letter-spacing:3px;
  background:linear-gradient(135deg,#0ff,#f0f,#ff0);background-size:200% 200%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:gradShift 4s ease infinite}
@keyframes gradShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.logo-sub{font-size:.78rem;color:rgba(255,255,255,.4);letter-spacing:5px;text-transform:uppercase;margin:6px 0 30px}
.input-card{background:rgba(10,10,30,.8);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);
  border-radius:20px;padding:28px 22px;max-width:380px;margin:0 auto;
  box-shadow:0 0 60px rgba(0,240,255,.05),0 30px 80px rgba(0,0,0,.5)}
.input-card label{display:block;font-size:.7rem;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:6px;text-align:left}
.input-card input{width:100%;padding:12px 14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);
  border-radius:10px;color:#fff;font-family:'Orbitron',monospace;font-size:.9rem;outline:none;margin-bottom:16px;
  transition:all .3s;color-scheme:dark}
.input-card input:focus{border-color:rgba(0,240,255,.5);box-shadow:0 0 15px rgba(0,240,255,.15)}
.input-hint{font-size:.68rem;color:rgba(255,255,255,.3);margin:-10px 0 16px;text-align:left}
.btn-go{width:100%;padding:14px;border:none;border-radius:12px;
  background:linear-gradient(135deg,#0ff,#80f);color:#000;font-family:'Orbitron',monospace;
  font-size:.85rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;
  transition:all .3s;position:relative;overflow:hidden}
.btn-go:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,240,255,.3)}
.btn-go::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);
  transform:translateX(-100%);transition:none}.btn-go:hover::after{animation:btnShine .6s ease forwards}
@keyframes btnShine{to{transform:translateX(100%)}}

/* ========== RESULTS ========== */
#results{display:none}

/* TOP BAR */
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.birth-date-display{font-family:'Orbitron',monospace;font-size:.7rem;color:rgba(255,255,255,.5);letter-spacing:1px;
  background:rgba(255,255,255,.04);padding:6px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.06)}
.top-actions{display:flex;gap:6px}
.top-btn{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.6);
  font-size:.7rem;padding:6px 12px;border-radius:8px;cursor:pointer;font-family:'Exo 2',sans-serif;
  transition:all .2s;letter-spacing:.5px}
.top-btn:hover{background:rgba(255,255,255,.08);color:#fff}

/* TITLE */
.section-title{font-family:'Orbitron',monospace;font-size:1.3rem;font-weight:900;text-align:center;margin-bottom:16px;
  background:linear-gradient(135deg,#0ff,#f0f,#ff0);background-size:200% 200%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:gradShift 4s ease infinite}

/* LIVE CLOCK STRIP */
.clock-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px}
.ck{background:rgba(10,10,30,.7);border:1px solid rgba(0,240,255,.12);border-radius:12px;padding:10px 2px;
  text-align:center;position:relative;overflow:hidden;backdrop-filter:blur(8px)}
.ck::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#0ff,transparent)}
.ck-v{font-family:'Orbitron',monospace;font-size:clamp(1.1rem,4vw,1.6rem);font-weight:900;color:#0ff;
  text-shadow:0 0 12px rgba(0,240,255,.5);line-height:1.1}
.ck-l{font-size:.5rem;color:rgba(255,255,255,.4);letter-spacing:2px;text-transform:uppercase;margin-top:3px}

/* CARD GRID */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{border-radius:14px;padding:14px 12px;position:relative;overflow:hidden;
  backdrop-filter:blur(8px);transition:transform .25s,box-shadow .25s;min-height:90px}
.card:active{transform:scale(.97)}
.card.span2{grid-column:1/-1}

/* NEON CARD VARIANTS */
.n-cyan{background:rgba(0,240,255,.04);border:1px solid rgba(0,240,255,.18)}
.n-cyan::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:#0ff}
.n-cyan:hover{box-shadow:0 0 25px rgba(0,240,255,.15)}

.n-mag{background:rgba(255,0,229,.04);border:1px solid rgba(255,0,229,.18)}
.n-mag::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:#f0e}
.n-mag:hover{box-shadow:0 0 25px rgba(255,0,229,.15)}

.n-gold{background:rgba(255,215,0,.04);border:1px solid rgba(255,215,0,.18)}
.n-gold::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:#ffd700}
.n-gold:hover{box-shadow:0 0 25px rgba(255,215,0,.15)}

.n-green{background:rgba(0,255,136,.04);border:1px solid rgba(0,255,136,.18)}
.n-green::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:#0f8}
.n-green:hover{box-shadow:0 0 25px rgba(0,255,136,.15)}

.n-red{background:rgba(255,51,102,.04);border:1px solid rgba(255,51,102,.18)}
.n-red::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:#f36}
.n-red:hover{box-shadow:0 0 25px rgba(255,51,102,.15)}

.n-purple{background:rgba(170,85,255,.04);border:1px solid rgba(170,85,255,.18)}
.n-purple::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:#a5f}
.n-purple:hover{box-shadow:0 0 25px rgba(170,85,255,.15)}

.n-blue{background:rgba(68,136,255,.04);border:1px solid rgba(68,136,255,.18)}
.n-blue::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:#48f}
.n-blue:hover{box-shadow:0 0 25px rgba(68,136,255,.15)}

.n-orange{background:rgba(255,136,0,.04);border:1px solid rgba(255,136,0,.18)}
.n-orange::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:#f80}
.n-orange:hover{box-shadow:0 0 25px rgba(255,136,0,.15)}

.n-teal{background:rgba(0,200,180,.04);border:1px solid rgba(0,200,180,.18)}
.n-teal::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:#0cb}
.n-teal:hover{box-shadow:0 0 25px rgba(0,200,180,.15)}

.n-pink{background:rgba(255,105,180,.04);border:1px solid rgba(255,105,180,.18)}
.n-pink::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:#ff69b4}
.n-pink:hover{box-shadow:0 0 25px rgba(255,105,180,.15)}

/* CARD CONTENT */
.c-icon{font-size:1.4rem;margin-bottom:5px;display:block;filter:drop-shadow(0 0 5px currentColor)}
.c-lbl{font-size:.55rem;color:rgba(255,255,255,.4);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
.c-val{font-family:'Orbitron',monospace;font-weight:700;font-size:1rem;line-height:1.2;margin-bottom:3px;word-break:break-word}
.c-val.sm{font-size:.8rem}.c-val.xs{font-size:.7rem}
.c-desc{font-size:.65rem;color:rgba(255,255,255,.35);line-height:1.4}
.live-dot{display:inline-block;width:5px;height:5px;border-radius:50%;margin-left:5px;vertical-align:middle;
  animation:livePulse 1.5s ease-in-out infinite}
.live-dot.green{background:#0f8}
@keyframes livePulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.6)}}

/* ZODIAC SPECIAL CARD */
.zodiac-inner{display:flex;align-items:center;gap:14px}
.z-symbol{font-size:3rem;line-height:1;flex-shrink:0;filter:drop-shadow(0 0 12px rgba(255,51,102,.5))}
.z-content{flex:1;min-width:0}
.z-name{font-family:'Orbitron',monospace;font-size:1.1rem;font-weight:700;margin-bottom:2px}
.z-meta{font-size:.6rem;color:rgba(255,255,255,.4);letter-spacing:1px;margin-bottom:4px}
.z-badges{display:flex;gap:5px;flex-wrap:wrap}
.z-badge{font-size:.5rem;padding:2px 8px;border-radius:20px;border:1px solid rgba(255,255,255,.12);
  color:rgba(255,255,255,.6);letter-spacing:1px;text-transform:uppercase}
.z-desc{font-size:.65rem;color:rgba(255,255,255,.4);margin-top:5px;line-height:1.5}

/* CHINESE ZODIAC */
.cz-row{display:flex;align-items:center;gap:10px}
.cz-emoji{font-size:2.4rem;flex-shrink:0}

/* MOON VISUAL */
.moon-ball{width:44px;height:44px;border-radius:50%;position:relative;margin:4px auto 6px;
  background:radial-gradient(circle at 35% 35%,#f5f5dc,#b8b8a0);
  box-shadow:0 0 14px rgba(255,255,200,.25),inset -3px -3px 8px rgba(0,0,0,.4)}
.moon-shadow{position:absolute;top:0;border-radius:50%;width:44px;height:44px;background:#050510}

/* ORBIT MINI */
.orbit-mini{width:54px;height:54px;margin:2px auto 4px;position:relative}
.orbit-mini .ring{position:absolute;border:1px dashed rgba(255,215,0,.15);border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%)}
.orbit-mini .r1{width:22px;height:22px}.orbit-mini .r2{width:38px;height:38px}.orbit-mini .r3{width:54px;height:54px}
.orbit-mini .sun{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:8px;height:8px;border-radius:50%;background:#ffd700;box-shadow:0 0 8px #ffd700}
.orbit-mini .earth{position:absolute;width:5px;height:5px;border-radius:50%;background:#48f;box-shadow:0 0 5px #48f;
  top:50%;left:50%;margin:-2.5px 0 0 -2.5px;transform-origin:2.5px 2.5px;animation:orbitSpin 6s linear infinite}
@keyframes orbitSpin{0%{transform:rotate(0deg) translateX(19px)}100%{transform:rotate(360deg) translateX(19px)}}

/* SECTION DIVIDERS */
.section-sep{text-align:center;padding:18px 0 10px;position:relative}
.section-sep::before{content:'';position:absolute;top:50%;left:10%;right:10%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent)}
.sep-text{font-family:'Orbitron',monospace;font-size:.55rem;letter-spacing:4px;text-transform:uppercase;
  color:rgba(255,255,255,.25);background:#050510;padding:0 12px;position:relative;display:inline-block}

/* SHARE AREA */
.share-area{margin-top:18px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.share-btn{display:flex;align-items:center;gap:6px;padding:10px 18px;border-radius:10px;cursor:pointer;
  font-family:'Exo 2',sans-serif;font-size:.78rem;font-weight:600;letter-spacing:.5px;
  transition:all .25s;border:1px solid}
.share-btn.link{background:rgba(68,136,255,.08);border-color:rgba(68,136,255,.25);color:#48f}
.share-btn.reset{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.1);color:rgba(255,255,255,.5)}
.share-btn:hover{transform:translateY(-2px)}
.share-btn.link:hover{box-shadow:0 0 20px rgba(68,136,255,.2)}

/* TOAST */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);
  background:rgba(0,255,136,.85);color:#000;padding:10px 22px;border-radius:10px;font-size:.82rem;
  font-weight:700;opacity:0;transition:all .3s;pointer-events:none;z-index:300;backdrop-filter:blur(10px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* CONFETTI */
.confetti-piece{position:fixed;width:8px;height:8px;z-index:200;pointer-events:none;border-radius:1px}

/* ANIMATION ENTRY */
.card{animation:cardFadeIn .5s ease both}
@keyframes cardFadeIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}

/* RESPONSIVE */
@media(max-width:340px){.clock-strip{grid-template-columns:repeat(3,1fr)}.ck:nth-child(4),.ck:nth-child(5){grid-column:auto}}
</style>

<script>
// ========== STARFIELD ==========
const canvas = document.getElementById('starfield');
const ctx = canvas.getContext('2d');
let stars = [];
function initStars() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  stars = [];
  const count = Math.min(200, Math.floor(canvas.width * canvas.height / 5000));
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.3 + 0.3,
      a: Math.random(),
      da: (Math.random() - 0.5) * 0.02
    });
  }
}
function drawStars() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (const s of stars) {
    s.a += s.da;
    if (s.a > 1 || s.a < 0.1) s.da *= -1;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${s.a.toFixed(2)})`;
    ctx.fill();
  }
  requestAnimationFrame(drawStars);
}
initStars(); drawStars();

function moonPhase(date){
  const y=date.getFullYear(),m=date.getMonth()+1,d=date.getDate();
  let yr=y,mo=m;if(mo<3){yr--;mo+=12;}
  const a=Math.floor(yr/100),b=2-a+Math.floor(a/4);
  const jd=Math.floor(365.25*(yr+4716))+Math.floor(30.6001*(mo+1))+d+b-1524.5;
  const ph=((jd-2451550.1)%29.530588+29.530588)%29.530588;
  const illum=((1-Math.cos(ph/29.530588*2*Math.PI))/2*100).toFixed(0);
  const ps=[['🌑','Luna Nuova',0,1.85],['🌒','Crescente',1.85,7.38],['🌓','Primo Quarto',7.38,11.08],['🌔','Gibbosa Crescente',11.08,14.77],['🌕','Luna Piena',14.77,18.46],['🌖','Gibbosa Calante',18.46,22.15],['🌗','Ultimo Quarto',22.15,25.85],['🌘','Calante',25.85,29.53]];
  for(const p of ps)if(ph>=p[2]&&ph<p[3])return{e:p[0],n:p[1],illum,phase:ph};
  return{e:'🌑',n:'Luna Nuova',illum:0,phase:ph};
}

function julianDay(date){
  const y=date.getFullYear(),m=date.getMonth()+1,d=date.getDate();
  let yr=y,mo=m;if(mo<3){yr--;mo+=12;}
  const a=Math.floor(yr/100),b=2-a+Math.floor(a/4);
  return Math.floor(365.25*(yr+4716))+Math.floor(30.6001*(mo+1))+d+b-1524.5;
}

function getSeason(m,d){
  if((m===3&&d>=20)||m===4||m===5||(m===6&&d<21))return{e:'🌸',n:'Primavera'};
  if((m===6&&d>=21)||m===7||m===8||(m===9&&d<23))return{e:'☀️',n:'Estate'};
  if((m===9&&d>=23)||m===10||m===11||(m===12&&d<21))return{e:'🍂',n:'Autunno'};
  return{e:'❄️',n:'Inverno'};
}

// ========== LIVE TICKER ==========
function tick(){
  if(!birthDT)return;
  const now=new Date(),ms=now-birthDT;
  const sec=ms/1000,days=ms/864e5;
  const y=Math.floor(days/365.25),rd=Math.floor(days-y*365.25);
  const rh=Math.floor((ms%864e5)/36e5);
  const rm=Math.floor((ms%36e5)/6e4);
  const rs=Math.floor((ms%6e4)/1000);
  document.getElementById('ckY').textContent=fmt(y);
  document.getElementById('ckD').textContent=fmt(rd);
  document.getElementById('ckH').textContent=pad(rh);
  document.getElementById('ckM').textContent=pad(rm);
  document.getElementById('ckS').textContent=pad(rs);

  const upd=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=fmt(v);};
  const updK=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=fmtKm(v);};
  upd('lv-hb',sec*70/60);
  upd('lv-br',sec*16/60);
  upd('lv-blinks',(ms/36e5)*(16/24)*15*60);
  upd('lv-sec',sec);
  updK('lv-sun',sec*29.78);
  updK('lv-gal',sec*220);
  updK('lv-and',sec*110);
  updK('lv-cmb',sec*627);
}

// ========== MOON SHADOW CSS ==========
function moonShadowCSS(phase){
  const norm=phase/29.530588;
  if(norm<0.25){const pct=norm/0.25;return`border-radius:50%;right:0;width:${(1-pct)*100}%`;}
  if(norm<0.5){const pct=(norm-0.25)/0.25;return`border-radius:50%;left:0;width:${pct*100}%`;} // wrong side intentionally for waxing
  if(norm<0.75){const pct=(norm-0.5)/0.25;return`border-radius:50%;right:0;width:${pct*100}%`;}
  const pct=(norm-0.75)/0.25;return`border-radius:50%;left:0;width:${(1-pct)*100}%`;
}

// ========== CONFETTI ==========
function confetti(){
  const colors=['#0ff','#f0f','#ff0','#0f8','#f36','#a5f','#48f','#f80'];
  for(let i=0;i<40;i++){
    const p=document.createElement('div');p.className='confetti-piece';
    const sz=Math.random()*6+4;
    Object.assign(p.style,{width:sz+'px',height:sz+'px',background:colors[i%colors.length],
      left:Math.random()*100+'vw',top:'-10px',borderRadius:Math.random()>.5?'50%':'2px',
      transform:`rotate(${Math.random()*360}deg)`});
    document.body.appendChild(p);
    const dur=Math.random()*2000+2000;
    p.animate([
      {transform:`translateY(0) rotate(0deg)`,opacity:1},
      {transform:`translateY(${window.innerHeight+50}px) rotate(${Math.random()*720}deg)`,opacity:0}
    ],{duration:dur,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>p.remove();
  }
}

  </div>`;

  // Moon at birth
  html+=`<div class="card ${nc()}" style="animation-delay:.2s">
    <div class="moon-ball"><div class="moon-shadow" style="${moonShadowCSS(moon.phase)}"></div></div>
    <div class="c-lbl">Luna alla Nascita</div>
    <div class="c-val sm">${moon.n} ${moon.e}</div>
    <div class="c-desc">Illuminazione: ${moon.illum}%</div>
  </div>`;

  // Chinese zodiac
  html+=`<div class="card ${nc()}" style="animation-delay:.25s">
    <div class="cz-row">
      <div class="cz-emoji">${chinese.e}</div>
      <div>
        <div class="c-lbl">Zodiaco Cinese</div>
        <div class="c-val sm">Anno ${chinese.art} ${chinese.n}</div>
      </div>
    </div>
  </div>`;

  // SEPARATOR - Corpo
  html+=`<div class="section-sep span2"><span class="sep-text">Il Tuo Corpo</span></div>`;

  // Heartbeats live
  html+=`<div class="card ${nc()}" style="animation-delay:.3s">
    <span class="c-icon">❤️</span>
    <div class="c-lbl">Battiti del Cuore</div>
    <div class="c-val sm"><span id="lv-hb">...</span><span class="live-dot green"></span></div>
    <div class="c-desc">~70 bpm, in tempo reale</div>
  </div>`;

  // Breaths live
  html+=`<div class="card ${nc()}" style="animation-delay:.35s">
    <span class="c-icon">🫁</span>
    <div class="c-lbl">Respiri</div>
    <div class="c-val sm"><span id="lv-br">...</span><span class="live-dot green"></span></div>
    <div class="c-desc">~16 al minuto</div>
  </div>`;

  // Seconds live
  html+=`<div class="card ${nc()}" style="animation-delay:.4s">
    <span class="c-icon">⏱️</span>
    <div class="c-lbl">Secondi Vissuti</div>
    <div class="c-val xs"><span id="lv-sec">...</span><span class="live-dot green"></span></div>
    <div class="c-desc">Contatore in tempo reale</div>
  </div>`;

  // Blinks
  html+=`<div class="card ${nc()}" style="animation-delay:.45s">
    <span class="c-icon">😉</span>
    <div class="c-lbl">Battiti di Ciglia</div>
    <div class="c-val sm"><span id="lv-blinks">...</span><span class="live-dot green"></span></div>
    <div class="c-desc">~15 al minuto da sveglio</div>
  </div>`;

  // Sleep
  html+=`<div class="card ${nc()}" style="animation-delay:.5s">
    <span class="c-icon">😴</span>
    <div class="c-lbl">Giorni Dormendo</div>
    <div class="c-val">${fmt(sleepDays)}</div>
    <div class="c-desc">${fmt(sleepDays*7)} ore, ~7h/notte</div>
  </div>`;

  // Steps
  html+=`<div class="card ${nc()}" style="animation-delay:.55s">
    <span class="c-icon">👣</span>
    <div class="c-lbl">Passi Stimati</div>
    <div class="c-val sm">${fmt(steps)}</div>
    <div class="c-desc">Media 8.000/giorno</div>
  </div>`;

  // Blood
  html+=`<div class="card ${nc()}" style="animation-delay:.6s">
    <span class="c-icon">🩸</span>
    <div class="c-lbl">Sangue Pompato</div>
    <div class="c-val sm">${fmt(bloodL)} L</div>
    <div class="c-desc">~70ml per battito</div>
  </div>`;

  // Hair
  html+=`<div class="card ${nc()}" style="animation-delay:.65s">
    <span class="c-icon">💇</span>
    <div class="c-lbl">Capelli senza Tagli</div>
    <div class="c-val">~${fmt(hairCm)} cm</div>
    <div class="c-desc">0.35mm al giorno</div>
  </div>`;

  // SEPARATOR - Spazio
  html+=`<div class="section-sep span2"><span class="sep-text">Nel Cosmo</span></div>`;

  // KM Sun orbit
  html+=`<div class="card span2 ${nc()}" style="animation-delay:.7s">
    <div style="display:flex;align-items:center;gap:12px">
      <div class="orbit-mini">
        <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
        <div class="sun"></div><div class="earth"></div>
      </div>
      <div style="flex:1;min-width:0">
        <div class="c-lbl">Orbita Attorno al Sole</div>
        <div class="c-val xs"><span id="lv-sun">...</span><span class="live-dot green"></span></div>
        <div class="c-desc">29.78 km/s. 1 giro = ~940 Mln km</div>
      </div>
    </div>
  </div>`;

  // Galactic orbit
  html+=`<div class="card ${nc()}" style="animation-delay:.75s">
    <span class="c-icon">🌌</span>
    <div class="c-lbl">Orbita Galattica</div>
    <div class="c-val xs"><span id="lv-gal">...</span><span class="live-dot green"></span></div>
    <div class="c-desc">220 km/s nel giro galattico</div>
  </div>`;

  // Andromeda
  html+=`<div class="card ${nc()}" style="animation-delay:.8s">
    <span class="c-icon">🔵</span>
    <div class="c-lbl">Verso Andromeda</div>
    <div class="c-val xs"><span id="lv-and">...</span><span class="live-dot green"></span></div>
    <div class="c-desc">110 km/s, fusione tra ~4.5 Mld anni</div>
  </div>`;

  // CMB
  html+=`<div class="card span2 ${nc()}" style="animation-delay:.85s">
    <span class="c-icon">🌀</span>
    <div class="c-lbl">Moto nel Cosmo (vs Fondo Cosmico CMB)</div>
    <div class="c-val xs"><span id="lv-cmb">...</span><span class="live-dot green"></span></div>
    <div class="c-desc">627 km/s rispetto al fondo cosmico a microonde</div>
  </div>`;

  // Moon orbits
  html+=`<div class="card ${nc()}" style="animation-delay:.9s">
    <span class="c-icon">🌙</span>
    <div class="c-lbl">Orbite della Luna</div>
    <div class="c-val">${fmt(luneOrbite)}</div>
    <div class="c-desc">1 orbita ogni 27.3 giorni</div>
  </div>`;

  // SEPARATOR - Vita
  html+=`<div class="section-sep span2"><span class="sep-text">La Tua Vita</span></div>`;

  // Saint
  html+=`<div class="card ${nc()}" style="animation-delay:.95s">
    <span class="c-icon">⛪</span>
    <div class="c-lbl">Santo del Giorno</div>
    <div class="c-val sm">${saint}</div>
    <div class="c-desc">${d} ${MONTHS[m-1]}</div>
  </div>`;

  // Season
  html+=`<div class="card ${nc()}" style="animation-delay:1s">
    <span class="c-icon">${season.e}</span>
    <div class="c-lbl">Stagione di Nascita</div>
    <div class="c-val">${season.n}</div>
  </div>`;

  // World pop
  html+=`<div class="card ${nc()}" style="animation-delay:1.05s">
    <span class="c-icon">🌍</span>
    <div class="c-lbl">Popolazione Mondiale</div>
    <div class="c-val sm">${pop} Mld</div>
    <div class="c-desc">Stima anno ${y}. Oggi ~8.2 miliardi</div>
  </div>`;

  // Julian Day
  html+=`<div class="card ${nc()}" style="animation-delay:1.1s">
    <span class="c-icon">🔢</span>
    <div class="c-lbl">Giorno Giuliano</div>
    <div class="c-val sm">${jd.toLocaleString('it-IT')}</div>
    <div class="c-desc">JDN astronomico</div>
  </div>`;

  // Coffee
  html+=`<div class="card ${nc()}" style="animation-delay:1.15s">
    <span class="c-icon">☕</span>
    <div class="c-lbl">Caffe Stimati</div>
    <div class="c-val">${fmt(coffee)}</div>
    <div class="c-desc">Media italiana: 1.5/giorno</div>
  </div>`;

  // Weekends
  html+=`<div class="card ${nc()}" style="animation-delay:1.2s">
    <span class="c-icon">🎉</span>
    <div class="c-lbl">Weekend Vissuti</div>
    <div class="c-val">${fmt(weekends)}</div>
    <div class="c-desc">${fmt(weeks)} settimane complete</div>
  </div>`;

  // Next birthday
  html+=`<div class="card span2 ${nc()}" style="animation-delay:1.25s">
    <span class="c-icon">🎂</span>
    <div class="c-lbl">Prossimo Compleanno</div>
    <div class="c-val">Fra ${daysNext} giorni</div>
    <div class="c-desc">${d} ${MONTHS[m-1]} ${nb.getFullYear()}</div>
  </div>`;

  grid.innerHTML=html;
  window.scrollTo({top:0,behavior:'smooth'});
  confetti();

  // Update URL
  const url=new URL(location.href);url.searchParams.set('d',dv);
  if(tv)url.searchParams.set('t',tv);
  history.replaceState(null,'',url);
}

// ========== SHARE ==========
function doShare(){
  const url=location.href;
  navigator.clipboard.writeText(url).then(()=>showToast('Link copiato!')).catch(()=>prompt('Copia il link:',url));
}
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
function doReset(){
  document.getElementById('results').style.display='none';
  document.getElementById('inputScreen').style.display='block';
  if(liveTimer)clearInterval(liveTimer);
  const url=new URL(location.href);url.searchParams.delete('d');url.searchParams.delete('t');
  history.replaceState(null,'',url);
}

// ========== URL PARAMS ==========
window.addEventListener('DOMContentLoaded',()=>{
  const params=new URLSearchParams(location.search);
  const d=params.get('d'),t=params.get('t');
  if(d){
    document.getElementById('birthDate').value=d;
    if(t)document.getElementById('birthTime').value=t;
    go();
  }
});
</script>
</body>
</html>
