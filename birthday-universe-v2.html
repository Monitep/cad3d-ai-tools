<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Birthday Universe</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Exo+2:ital,wght@0,300;0,400;0,600;0,700;0,800;1,300&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
:root{
  --bg:#050510;--bg-card:rgba(10,10,30,.7);--border:rgba(255,255,255,.08);--border-h:rgba(255,255,255,.16);
  --tx:#fff;--txm:rgba(255,255,255,.4);--txd:rgba(255,255,255,.6);
  --a1:#0ff;--a2:#f0f;--a3:#ff0;--neb1:#0ff;--neb2:#f0f;--neb3:#80f;
  --panel:rgba(10,10,30,.92);--input-bg:rgba(255,255,255,.04);--input-b:rgba(255,255,255,.1);--fs:1rem;
}
.th-ocean{--bg:#020d1f;--a1:#00dfd8;--a2:#4d96ff;--a3:#0af;--neb1:#0ad;--neb2:#06f;--neb3:#048;--panel:rgba(2,13,31,.94)}
.th-fire{--bg:#100505;--a1:#ff6b35;--a2:#ff0054;--a3:#ffd700;--neb1:#f60;--neb2:#f05;--neb3:#a00;--panel:rgba(16,5,5,.94)}
.th-forest{--bg:#030a05;--a1:#6bcb77;--a2:#c8f557;--a3:#0fa;--neb1:#0c6;--neb2:#5c0;--neb3:#084;--panel:rgba(3,10,5,.94)}
.th-aurora{--bg:#050510;--a1:#7928ca;--a2:#ff0080;--a3:#ffd93d;--neb1:#70c;--neb2:#f08;--neb3:#a5f;--panel:rgba(8,5,20,.94)}
.th-gold{--bg:#0a0800;--a1:#ffd700;--a2:#ff8c00;--a3:#fff;--neb1:#da0;--neb2:#f80;--neb3:#a60;--panel:rgba(10,8,0,.94)}
.th-light{
  --bg:#eef0f8;--bg-card:rgba(255,255,255,.8);--border:rgba(0,0,0,.08);--border-h:rgba(0,0,0,.14);
  --tx:#1a1a2e;--txm:rgba(0,0,0,.4);--txd:rgba(0,0,0,.6);
  --a1:#7928ca;--a2:#ff0080;--a3:#ffd700;--neb1:rgba(120,40,200,.06);--neb2:rgba(255,0,128,.05);--neb3:rgba(100,60,220,.04);
  --panel:rgba(240,238,255,.96);--input-bg:rgba(255,255,255,.9);--input-b:rgba(0,0,0,.12);
}
.th-light .moon-shadow{background:var(--bg)!important}
.th-light input[type=date],.th-light input[type=time]{color-scheme:light}
body{font-family:'Exo 2',sans-serif;background:var(--bg);min-height:100vh;overflow-x:hidden;color:var(--tx);font-size:var(--fs);transition:background .4s,color .4s}
#starfield{position:fixed;inset:0;z-index:0;pointer-events:none}
.nebula{position:fixed;border-radius:50%;filter:blur(100px);opacity:.12;pointer-events:none;z-index:0;transition:background .5s}
.neb1{width:50vmax;height:50vmax;background:radial-gradient(circle,var(--neb1),transparent);top:-15%;left:-10%;animation:nebDrift 40s ease-in-out infinite alternate}
.neb2{width:45vmax;height:45vmax;background:radial-gradient(circle,var(--neb2),transparent);bottom:-15%;right:-10%;animation:nebDrift 35s ease-in-out infinite alternate-reverse}
.neb3{width:35vmax;height:35vmax;background:radial-gradient(circle,var(--neb3),transparent);top:50%;left:40%;animation:nebDrift 45s ease-in-out infinite alternate}
@keyframes nebDrift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.15)}100%{transform:translate(-30px,40px) scale(.9)}}
#app{position:relative;z-index:1;width:100%;max-width:1400px;margin:0 auto;padding:20px 16px 100px}
#inputScreen{text-align:center;padding-top:12vh}
.logo-title{font-family:'Orbitron',monospace;font-size:clamp(1.6rem,5vw,3rem);font-weight:900;letter-spacing:3px;background:linear-gradient(135deg,var(--a1),var(--a2),var(--a3));background-size:200% 200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:gradShift 4s ease infinite}
@keyframes gradShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.logo-sub{font-size:.78rem;color:var(--txm);letter-spacing:5px;text-transform:uppercase;margin:6px 0 30px}
.input-card{background:var(--bg-card);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:20px;padding:28px 22px;max-width:400px;margin:0 auto;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.input-card label{display:block;font-size:.7rem;letter-spacing:2px;text-transform:uppercase;color:var(--txm);margin-bottom:6px;text-align:left}
.input-card input{width:100%;padding:12px 14px;background:var(--input-bg);border:1px solid var(--input-b);border-radius:10px;color:var(--tx);font-family:'Orbitron',monospace;font-size:.9rem;outline:none;margin-bottom:16px;transition:all .3s;color-scheme:dark}
.input-card input:focus{border-color:var(--a1);box-shadow:0 0 15px rgba(0,240,255,.12)}
.input-hint{font-size:.68rem;color:var(--txm);margin:-10px 0 16px;text-align:left}
.btn-go{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--a1),var(--a2));color:#000;font-family:'Orbitron',monospace;font-size:.85rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .3s}
.btn-go:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,240,255,.25)}
#results{display:none}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.birth-date-display{font-family:'Orbitron',monospace;font-size:.7rem;color:var(--txm);letter-spacing:1px;background:var(--bg-card);padding:6px 12px;border-radius:8px;border:1px solid var(--border)}
.top-actions{display:flex;gap:6px}
.top-btn{background:var(--bg-card);border:1px solid var(--border);color:var(--txd);font-size:.7rem;padding:6px 12px;border-radius:8px;cursor:pointer;font-family:'Exo 2',sans-serif;transition:all .2s}
.top-btn:hover{border-color:var(--border-h);color:var(--tx)}
.section-title{font-family:'Orbitron',monospace;font-size:clamp(1.1rem,3vw,1.6rem);font-weight:900;text-align:center;margin-bottom:16px;background:linear-gradient(135deg,var(--a1),var(--a2),var(--a3));background-size:200% 200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:gradShift 4s ease infinite}
.clock-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:18px;max-width:700px;margin-left:auto;margin-right:auto}
.ck{background:var(--bg-card);border:1px solid rgba(0,240,255,.12);border-radius:12px;padding:12px 4px;text-align:center;position:relative;overflow:hidden;backdrop-filter:blur(8px)}
.ck::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--a1),transparent)}
.ck-v{font-family:'Orbitron',monospace;font-size:clamp(1.1rem,3.5vw,1.8rem);font-weight:900;color:var(--a1);text-shadow:0 0 12px rgba(0,240,255,.4);line-height:1.1}
.ck-l{font-size:.5rem;color:var(--txm);letter-spacing:2px;text-transform:uppercase;margin-top:3px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
@media(min-width:768px){.grid{grid-template-columns:repeat(3,1fr);gap:14px}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(4,1fr);gap:16px}}
@media(min-width:1280px){.grid{grid-template-columns:repeat(5,1fr);gap:16px}}
.card{border-radius:14px;padding:16px 14px;position:relative;overflow:hidden;backdrop-filter:blur(8px);transition:transform .25s,box-shadow .25s;min-height:100px;background:var(--bg-card);border:1px solid var(--border);animation:cardFadeIn .5s ease both}
.card:active{transform:scale(.97)}
.card.span2{grid-column:span 2}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;transition:background .4s}
.card[data-neon="cyan"]{border-color:rgba(0,240,255,.15)}.card[data-neon="cyan"]::before{background:#0ff}.card[data-neon="cyan"]:hover{box-shadow:0 0 25px rgba(0,240,255,.12)}
.card[data-neon="mag"]{border-color:rgba(255,0,229,.15)}.card[data-neon="mag"]::before{background:#f0e}.card[data-neon="mag"]:hover{box-shadow:0 0 25px rgba(255,0,229,.12)}
.card[data-neon="gold"]{border-color:rgba(255,215,0,.15)}.card[data-neon="gold"]::before{background:#ffd700}.card[data-neon="gold"]:hover{box-shadow:0 0 25px rgba(255,215,0,.12)}
.card[data-neon="green"]{border-color:rgba(0,255,136,.15)}.card[data-neon="green"]::before{background:#0f8}.card[data-neon="green"]:hover{box-shadow:0 0 25px rgba(0,255,136,.12)}
.card[data-neon="red"]{border-color:rgba(255,51,102,.15)}.card[data-neon="red"]::before{background:#f36}.card[data-neon="red"]:hover{box-shadow:0 0 25px rgba(255,51,102,.12)}
.card[data-neon="purple"]{border-color:rgba(170,85,255,.15)}.card[data-neon="purple"]::before{background:#a5f}.card[data-neon="purple"]:hover{box-shadow:0 0 25px rgba(170,85,255,.12)}
.card[data-neon="blue"]{border-color:rgba(68,136,255,.15)}.card[data-neon="blue"]::before{background:#48f}.card[data-neon="blue"]:hover{box-shadow:0 0 25px rgba(68,136,255,.12)}
.card[data-neon="orange"]{border-color:rgba(255,136,0,.15)}.card[data-neon="orange"]::before{background:#f80}.card[data-neon="orange"]:hover{box-shadow:0 0 25px rgba(255,136,0,.12)}
.card[data-neon="teal"]{border-color:rgba(0,200,180,.15)}.card[data-neon="teal"]::before{background:#0cb}.card[data-neon="teal"]:hover{box-shadow:0 0 25px rgba(0,200,180,.12)}
.card[data-neon="pink"]{border-color:rgba(255,105,180,.15)}.card[data-neon="pink"]::before{background:#ff69b4}.card[data-neon="pink"]:hover{box-shadow:0 0 25px rgba(255,105,180,.12)}
.c-icon{font-size:1.5rem;margin-bottom:6px;display:block;filter:drop-shadow(0 0 5px currentColor)}
.c-lbl{font-size:.58rem;color:var(--txm);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
.c-val{font-family:'Orbitron',monospace;font-weight:700;font-size:1rem;line-height:1.2;margin-bottom:3px;word-break:break-word;color:var(--tx)}
.c-val.sm{font-size:.85rem}.c-val.xs{font-size:.72rem}
.c-desc{font-size:.65rem;color:var(--txm);line-height:1.5}
.live-dot{display:inline-block;width:5px;height:5px;border-radius:50%;margin-left:5px;vertical-align:middle;background:#0f8;animation:livePulse 1.5s ease-in-out infinite}
@keyframes livePulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.6)}}
.zodiac-inner{display:flex;align-items:center;gap:14px}
.z-symbol{font-size:3rem;line-height:1;flex-shrink:0;filter:drop-shadow(0 0 12px rgba(255,51,102,.4))}
.z-content{flex:1;min-width:0}
.z-name{font-family:'Orbitron',monospace;font-size:1.1rem;font-weight:700;margin-bottom:2px}
.z-badges{display:flex;gap:5px;flex-wrap:wrap}
.z-badge{font-size:.5rem;padding:3px 9px;border-radius:20px;border:1px solid var(--border);color:var(--txd);letter-spacing:1px;text-transform:uppercase}
.z-desc{font-size:.65rem;color:var(--txm);margin-top:5px;line-height:1.5}
.cz-row{display:flex;align-items:center;gap:10px}
.cz-emoji{font-size:2.4rem;flex-shrink:0}
.moon-ball{width:44px;height:44px;border-radius:50%;position:relative;margin:4px auto 6px;background:radial-gradient(circle at 35% 35%,#f5f5dc,#b8b8a0);box-shadow:0 0 14px rgba(255,255,200,.25),inset -3px -3px 8px rgba(0,0,0,.4)}
.moon-shadow{position:absolute;top:0;border-radius:50%;width:44px;height:44px;background:#050510;transition:background .4s}
.orbit-mini{width:54px;height:54px;margin:2px auto 4px;position:relative}
.orbit-mini .ring{position:absolute;border:1px dashed rgba(255,215,0,.15);border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%)}
.orbit-mini .r1{width:22px;height:22px}.orbit-mini .r2{width:38px;height:38px}.orbit-mini .r3{width:54px;height:54px}
.orbit-mini .sun{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:8px;height:8px;border-radius:50%;background:#ffd700;box-shadow:0 0 8px #ffd700}
.orbit-mini .earth{position:absolute;width:5px;height:5px;border-radius:50%;background:#48f;box-shadow:0 0 5px #48f;top:50%;left:50%;margin:-2.5px 0 0 -2.5px;transform-origin:2.5px 2.5px;animation:orbitSpin 6s linear infinite}
@keyframes orbitSpin{0%{transform:rotate(0deg) translateX(19px)}100%{transform:rotate(360deg) translateX(19px)}}
.section-sep{text-align:center;padding:20px 0 12px;position:relative;grid-column:1/-1}
.section-sep::before{content:'';position:absolute;top:50%;left:5%;right:5%;height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent)}
.sep-text{font-family:'Orbitron',monospace;font-size:.6rem;letter-spacing:4px;text-transform:uppercase;color:var(--txm);background:var(--bg);padding:0 14px;position:relative;display:inline-block;transition:background .4s}
.share-area{margin-top:20px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.share-btn{display:flex;align-items:center;gap:6px;padding:10px 20px;border-radius:10px;cursor:pointer;font-family:'Exo 2',sans-serif;font-size:.8rem;font-weight:600;transition:all .25s;border:1px solid}
.share-btn.link{background:rgba(68,136,255,.06);border-color:rgba(68,136,255,.2);color:#48f}
.share-btn.reset{background:rgba(255,255,255,.03);border-color:var(--border);color:var(--txm)}
.share-btn:hover{transform:translateY(-2px)}
.fab{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab-btn{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--a1),var(--a2));border:none;color:#000;font-size:1.3rem;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,.4);transition:all .3s;display:flex;align-items:center;justify-content:center}
.fab-btn:hover{transform:scale(1.1) rotate(30deg)}
.fab-panel{background:var(--panel);backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:18px;padding:20px;width:270px;display:none;box-shadow:0 20px 60px rgba(0,0,0,.5);transition:background .4s}
.fab-panel.open{display:block;animation:panelIn .25s ease}
@keyframes panelIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.panel-title{color:var(--txm);font-size:.65rem;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;font-weight:700}
.themes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tswatch{width:32px;height:32px;border-radius:50%;border:2.5px solid transparent;cursor:pointer;transition:all .2s}
.tswatch:hover,.tswatch.active{border-color:#fff;transform:scale(1.15)}
.th-light .tswatch:hover,.th-light .tswatch.active{border-color:#555}
.tswatch[data-th=""]{background:linear-gradient(135deg,#0ff,#f0f)}
.tswatch[data-th="ocean"]{background:linear-gradient(135deg,#0070f3,#00dfd8)}
.tswatch[data-th="fire"]{background:linear-gradient(135deg,#ff6b35,#ff0054)}
.tswatch[data-th="forest"]{background:linear-gradient(135deg,#17c964,#c8f557)}
.tswatch[data-th="aurora"]{background:linear-gradient(135deg,#7928ca,#ff0080)}
.tswatch[data-th="gold"]{background:linear-gradient(135deg,#ffd700,#ff8c00)}
.tswatch[data-th="light"]{background:linear-gradient(135deg,#eef0f8,#c8b4ff);border-color:rgba(0,0,0,.15)!important}
.tswatch[data-th="light"]:hover,.tswatch[data-th="light"].active{border-color:#7928ca!important}
.divider{height:1px;background:var(--border);margin:14px 0}
.fs-ctrl{display:flex;align-items:center;gap:8px}
.fs-btn{width:34px;height:34px;border-radius:8px;background:var(--bg-card);border:1px solid var(--border);color:var(--tx);font-size:1rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center}
.fs-btn:hover{border-color:var(--border-h)}
.fs-val{color:var(--txd);font-size:.85rem;font-weight:700;flex:1;text-align:center}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(0,255,136,.85);color:#000;padding:10px 22px;border-radius:10px;font-size:.82rem;font-weight:700;opacity:0;transition:all .3s;pointer-events:none;z-index:300}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.confetti-piece{position:fixed;width:8px;height:8px;z-index:200;pointer-events:none;border-radius:1px}
@keyframes cardFadeIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<canvas id="starfield"></canvas>
<div class="nebula neb1"></div><div class="nebula neb2"></div><div class="nebula neb3"></div>
<div class="toast" id="toast"></div>
<div id="app">
  <div id="inputScreen">
    <div class="logo-title">BIRTHDAY UNIVERSE</div>
    <div class="logo-sub">La tua vita in numeri cosmici</div>
    <div class="input-card">
      <label>Data di nascita</label><input type="date" id="birthDate">
      <label>Ora di nascita</label><input type="time" id="birthTime">
      <div class="input-hint">Opzionale, migliora la precisione dei calcoli</div>
      <button class="btn-go" onclick="go()">ESPLORA IL TUO UNIVERSO</button>
    </div>
  </div>
  <div id="results">
    <div class="section-title">BIRTHDAY UNIVERSE</div>
    <div class="top-bar">
      <div class="birth-date-display" id="birthDisplay">-</div>
      <div class="top-actions">
        <button class="top-btn" onclick="doShare()">🔗 Condividi</button>
        <button class="top-btn" onclick="doReset()">← Cambia</button>
      </div>
    </div>
    <div class="clock-strip">
      <div class="ck"><div class="ck-v" id="ckY">-</div><div class="ck-l">Anni</div></div>
      <div class="ck"><div class="ck-v" id="ckD">-</div><div class="ck-l">Giorni</div></div>
      <div class="ck"><div class="ck-v" id="ckH">-</div><div class="ck-l">Ore</div></div>
      <div class="ck"><div class="ck-v" id="ckM">-</div><div class="ck-l">Minuti</div></div>
      <div class="ck"><div class="ck-v" id="ckS">-</div><div class="ck-l">Secondi</div></div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="share-area">
      <button class="share-btn link" onclick="doShare()">🔗 Copia Link</button>
      <button class="share-btn reset" onclick="doReset()">← Cambia Data</button>
    </div>
  </div>
</div>
<div class="fab">
  <div class="fab-panel" id="fabPanel">
    <div class="panel-title">Tema Colore</div>
    <div class="themes">
      <div class="tswatch active" data-th="" title="Cosmico" onclick="setTheme(this)"></div>
      <div class="tswatch" data-th="ocean" title="Oceano" onclick="setTheme(this)"></div>
      <div class="tswatch" data-th="fire" title="Fuoco" onclick="setTheme(this)"></div>
      <div class="tswatch" data-th="forest" title="Foresta" onclick="setTheme(this)"></div>
      <div class="tswatch" data-th="aurora" title="Aurora" onclick="setTheme(this)"></div>
      <div class="tswatch" data-th="gold" title="Oro" onclick="setTheme(this)"></div>
      <div class="tswatch" data-th="light" title="Chiaro" onclick="setTheme(this)"></div>
    </div>
    <div class="divider"></div>
    <div class="panel-title">Dimensione Testo</div>
    <div class="fs-ctrl">
      <button class="fs-btn" onclick="changeFS(-1)">A−</button>
      <div class="fs-val" id="fsVal">100%</div>
      <button class="fs-btn" onclick="changeFS(1)">A+</button>
    </div>
  </div>
  <button class="fab-btn" onclick="togglePanel()" title="Impostazioni">⚙️</button>
</div>
<script>
const canvas=document.getElementById('starfield'),ctx=canvas.getContext('2d');let stars=[];
function initStars(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;stars=[];const n=Math.min(250,Math.floor(canvas.width*canvas.height/4000));for(let i=0;i<n;i++)stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*1.3+.3,a:Math.random(),da:(Math.random()-.5)*.02});}
function drawStars(){ctx.clearRect(0,0,canvas.width,canvas.height);for(const s of stars){s.a+=s.da;if(s.a>1||s.a<.1)s.da*=-1;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${s.a.toFixed(2)})`;ctx.fill();}requestAnimationFrame(drawStars);}
initStars();drawStars();window.addEventListener('resize',initStars);

function setTheme(el){document.querySelectorAll('.tswatch').forEach(s=>s.classList.remove('active'));el.classList.add('active');const t=el.dataset.th;document.body.className=document.body.className.replace(/th-\w+/g,'').trim();if(t)document.body.classList.add('th-'+t);document.querySelectorAll('.moon-shadow').forEach(m=>{m.style.background=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()});document.querySelectorAll('.sep-text').forEach(s=>{s.style.background=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()});try{localStorage.setItem('bu2-theme',t)}catch(e){}}
const FS=[80,90,100,110,120,135,150];let fsIdx=2;
function applyFS(){document.documentElement.style.setProperty('--fs',(FS[fsIdx]/100)+'rem');document.getElementById('fsVal').textContent=FS[fsIdx]+'%';try{localStorage.setItem('bu2-fs',fsIdx)}catch(e){}}

  h+='<div class="card span2" data-neon="'+nc()+'" style="animation-delay:.46s"><div style="display:flex;align-items:center;gap:14px"><div class="orbit-mini"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="sun"></div><div class="earth"></div></div><div style="flex:1;min-width:0"><div class="c-lbl">Orbita Attorno al Sole</div><div class="c-val xs"><span id="lv-sun">...</span><span class="live-dot"></span></div><div class="c-desc">29.78 km/s. 1 giro = ~940 Mln km</div></div></div></div>';

  h+='<div class="card span2" data-neon="'+nc()+'" style="animation-delay:.54s"><span class="c-icon">\uD83C\uDF00</span><div class="c-lbl">Moto nel Cosmo (vs Fondo CMB)</div><div class="c-val xs"><span id="lv-cmb">...</span><span class="live-dot"></span></div><div class="c-desc">627 km/s rispetto al fondo cosmico a microonde</div></div>';

  h+='<div class="section-sep"><span class="sep-text">La Tua Vita</span></div>';
  h+=C(nc(),'\u26EA','Santo del Giorno',saint,d+' '+MONTHS[m-1],'sm','.6');
  h+=C(nc(),season.e,'Stagione di Nascita',season.n,'','','.62');

  h+='<div class="card span2" data-neon="'+nc()+'" style="animation-delay:.72s"><span class="c-icon">\uD83C\uDF82</span><div class="c-lbl">Prossimo Compleanno</div><div class="c-val">Fra '+daysNext+' giorni</div><div class="c-desc">'+d+' '+MONTHS[m-1]+' '+nb.getFullYear()+'</div></div>';
  grid.innerHTML=h;window.scrollTo({top:0,behavior:'smooth'});confetti();
  const u=new URL(location.href);u.searchParams.set('d',dv);if(tv)u.searchParams.set('t',tv);history.replaceState(null,'',u);
}
window.addEventListener('DOMContentLoaded',()=>{
  try{const t=localStorage.getItem('bu2-theme');if(t!==null){const sw=document.querySelector('.tswatch[data-th="'+t+'"]');if(sw)setTheme(sw);}const f=localStorage.getItem('bu2-fs');if(f!==null){fsIdx=parseInt(f);applyFS();}}catch(e){}
  const p=new URLSearchParams(location.search);const d=p.get('d'),t=p.get('t');
  if(d){document.getElementById('birthDate').value=d;if(t)document.getElementById('birthTime').value=t;go();}
});
