<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#010912">
<title>AquaPhysics</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#010912;touch-action:manipulation}
canvas{display:block;position:fixed;top:0;left:0}
#ui{
  position:fixed;inset:0;z-index:10;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(1,9,18,.95);
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;user-select:none;
}
.icon{font-size:4rem;margin-bottom:.6rem}
h1{color:#fff;font-weight:200;font-size:2.2rem;letter-spacing:6px;text-transform:uppercase;margin-bottom:.3rem}
.sub{color:#0f88aa;font-size:.78rem;letter-spacing:3px;text-transform:uppercase;margin-bottom:1.8rem}
p{color:rgba(255,255,255,.45);font-size:.83rem;text-align:center;line-height:1.85;margin-bottom:2.5rem;max-width:260px}
button{
  background:linear-gradient(135deg,#0055cc,#00ccff);
  color:#fff;border:none;padding:14px 46px;border-radius:50px;
  font-size:1rem;letter-spacing:1px;text-transform:uppercase;
  box-shadow:0 0 50px rgba(0,160,255,.4);touch-action:manipulation;
}
button:active{transform:scale(.95);opacity:.9}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="icon">💧</div>
  <h1>Aqua</h1>
  <div class="sub">SPH Fluid Simulation</div>
  <p>Inclina il telefono per muovere l'acqua.<br>Tocca per creare turbolenza.<br>Scuoti forte per un'esplosione.</p>
  <button onclick="start()">Attiva Sensori</button>
</div>

<script>
'use strict';
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', {alpha:false});
let W=0, H=0;
function resize(){ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; }
resize();
window.addEventListener('resize', resize);

// ============================================================
//  SPH - Smoothed Particle Hydrodynamics
// ============================================================
const NUM   = 160;
const HSML  = 26;
const HSML2 = HSML * HSML;
const MASS  = 1.0;
const RHO0  = 7.0;
const KGAS  = 120.0;
const VISC  = 70.0;
const DT    = 0.013;
const GSCL  = 52.0;
const BDAMP = -0.38;
const PAD   = 5;

const KP6 = 315.0 / (64.0 * Math.PI * Math.pow(HSML, 9));
const KSP  = -45.0 / (Math.PI * Math.pow(HSML, 6));
const KV   =  45.0 / (Math.PI * Math.pow(HSML, 6));

const px  = new Float32Array(NUM);
const py  = new Float32Array(NUM);
const pvx = new Float32Array(NUM);
const pvy = new Float32Array(NUM);
const rho = new Float32Array(NUM);
const prs = new Float32Array(NUM);
const fx  = new Float32Array(NUM);
const fy  = new Float32Array(NUM);

let gx = 0.0, gy = 9.8;
let running = false;
let lastShake = 0;

function initParticles() {
  const cols = Math.max(7, Math.floor(W * 0.68 / HSML));
  const spc  = HSML * 0.87;
  const sx   = (W - cols * spc) * 0.5;
  const sy   = H * 0.5;
  for (let i = 0; i < NUM; i++) {
    const c = i % cols, r = Math.floor(i / cols);
    px[i]  = sx + c * spc + (Math.random() - .5) * 3;
    py[i]  = sy + r * spc + (Math.random() - .5) * 3;
    pvx[i] = (Math.random() - .5) * 5;
    pvy[i] = Math.random() * 4;
  }
}

function computeDens() {
  for (let i = 0; i < NUM; i++) {
    let d = 0;
    for (let j = 0; j < NUM; j++) {
      const dx = px[j]-px[i], dy = py[j]-py[i];
      const r2 = dx*dx + dy*dy;
      if (r2 < HSML2) { const q = HSML2-r2; d += MASS*KP6*q*q*q; }
    }
    rho[i] = Math.max(d, 0.001);
    prs[i] = KGAS * (rho[i] - RHO0);
  }
}

function computeForces() {
  fx.fill(0); fy.fill(0);
  for (let i = 0; i < NUM; i++) {
    let fpx=0,fpy=0,fvx=0,fvy=0;
    for (let j = 0; j < NUM; j++) {
      if (i===j) continue;
      const dx=px[j]-px[i], dy=py[j]-py[i];
      const r2=dx*dx+dy*dy;
      if (r2>=HSML2||r2<0.01) continue;
      const r=Math.sqrt(r2), q=HSML-r;
      const sp=KSP*q*q/r*MASS*(prs[i]+prs[j])/(2.0*rho[j]);
      fpx+=sp*dx; fpy+=sp*dy;
      const vf=VISC*MASS*q/rho[j]*KV;
      fvx+=vf*(pvx[j]-pvx[i]); fvy+=vf*(pvy[j]-pvy[i]);
    }
    fx[i]=fpx+fvx+gx*GSCL*rho[i];
    fy[i]=fpy+fvy+gy*GSCL*rho[i];
  }
}

function integrate() {
  const VMAX=650;
  for (let i=0;i<NUM;i++) {
    pvx[i]+=DT*fx[i]/rho[i];
    pvy[i]+=DT*fy[i]/rho[i];
    const spd=Math.sqrt(pvx[i]*pvx[i]+pvy[i]*pvy[i]);
    if(spd>VMAX){const s=VMAX/spd; pvx[i]*=s; pvy[i]*=s;}
    px[i]+=DT*pvx[i]; py[i]+=DT*pvy[i];
    if(px[i]<PAD)   {px[i]=PAD;   pvx[i]*=BDAMP;}
    if(px[i]>W-PAD) {px[i]=W-PAD; pvx[i]*=BDAMP;}
    if(py[i]<PAD)   {py[i]=PAD;   pvy[i]*=BDAMP;}
    if(py[i]>H-PAD) {py[i]=H-PAD; pvy[i]*=BDAMP;}
  }
}

// ============================================================
//  TEXTURE SFERA pre-renderizzata
// ============================================================
const PR = 13;
let sphereTex=null, glowTex=null;

function buildTextures() {
  const SD=(PR+2)*2;
  const sc=document.createElement('canvas');
  sc.width=sc.height=SD;
  const sx=sc.getContext('2d'), cr=SD/2;
  // base scura
  sx.beginPath(); sx.arc(cr,cr,cr-.5,0,Math.PI*2);
  sx.fillStyle='rgba(8,40,140,0.75)'; sx.fill();
  // gradiente 3D
  const sg=sx.createRadialGradient(cr-cr*.32,cr-cr*.36,cr*.07,cr+cr*.08,cr+cr*.08,cr);
  sg.addColorStop(0,  'rgba(215,248,255,0.98)');
  sg.addColorStop(.18,'rgba(110,192,255,0.95)');
  sg.addColorStop(.5, 'rgba(45,115,235,0.90)');
  sg.addColorStop(1,  'rgba(14,58,185,0.72)');
  sx.fillStyle=sg;
  sx.beginPath(); sx.arc(cr,cr,cr-1,0,Math.PI*2); sx.fill();
  // highlight
  sx.beginPath(); sx.arc(cr-cr*.29,cr-cr*.33,cr*.23,0,Math.PI*2);
  sx.fillStyle='rgba(255,255,255,0.82)'; sx.fill();
  sphereTex=sc;

  // alone
  const GD=PR*5;
  const gc=document.createElement('canvas');
  gc.width=gc.height=GD;
  const gctx=gc.getContext('2d'), gr=GD/2;
  const gg=gctx.createRadialGradient(gr,gr,0,gr,gr,gr);
  gg.addColorStop(0,'rgba(70,160,255,0.28)');
  gg.addColorStop(.5,'rgba(30,100,220,0.10)');
  gg.addColorStop(1,'rgba(0,0,0,0)');
  gctx.fillStyle=gg; gctx.fillRect(0,0,GD,GD);
  glowTex=gc;
}

// ============================================================
//  RENDERING
// ============================================================
function render() {
  ctx.fillStyle='#010912';
  ctx.fillRect(0,0,W,H);

  // Alone (additive)
  const GR=PR*2.5, GD=PR*5;
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<NUM;i++) ctx.drawImage(glowTex,px[i]-GR,py[i]-GR,GD,GD);

  // Sfere
  ctx.globalCompositeOperation='source-over';
  const SD=(PR+2)*2;
  for(let i=0;i<NUM;i++) ctx.drawImage(sphereTex,px[i]-PR-2,py[i]-PR-2,SD,SD);

  // Contenitore 3D
  const D=20;
  ctx.globalAlpha=0.62;

  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(D,D); ctx.lineTo(D,H); ctx.lineTo(0,H); ctx.closePath();
  let g=ctx.createLinearGradient(0,0,D,0);
  g.addColorStop(0,'rgba(55,125,205,0.52)'); g.addColorStop(1,'rgba(12,48,125,0.12)');
  ctx.fillStyle=g; ctx.fill();

  ctx.beginPath(); ctx.moveTo(W,0); ctx.lineTo(W-D,D); ctx.lineTo(W-D,H); ctx.lineTo(W,H); ctx.closePath();
  g=ctx.createLinearGradient(W-D,0,W,0);
  g.addColorStop(0,'rgba(12,48,125,0.12)'); g.addColorStop(1,'rgba(55,125,205,0.52)');
  ctx.fillStyle=g; ctx.fill();

  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(D,D); ctx.lineTo(W-D,D); ctx.lineTo(W,0); ctx.closePath();
  g=ctx.createLinearGradient(0,0,0,D);
  g.addColorStop(0,'rgba(35,90,165,0.42)'); g.addColorStop(1,'rgba(8,38,95,0.1)');
  ctx.fillStyle=g; ctx.fill();

  ctx.globalAlpha=1;
  ctx.strokeStyle='rgba(115,200,255,0.65)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(0,0);   ctx.lineTo(D,D);   ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W,0);   ctx.lineTo(W-D,D); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(D,D);   ctx.lineTo(W-D,D); ctx.stroke();
  ctx.strokeStyle='rgba(80,160,235,0.28)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(D,D);   ctx.lineTo(D,H);   ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W-D,D); ctx.lineTo(W-D,H); ctx.stroke();
}

// ============================================================
//  INPUT
// ============================================================
function setupMotion() {
  window.addEventListener('devicemotion', e=>{
    const a=e.accelerationIncludingGravity;
    if(!a) return;
    gx=gx*.78+(a.x||0)*.22;
    gy=gy*.78+(-(a.y||0))*.22;
    const raw=e.acceleration;
    if(raw){
      const m=Math.sqrt((raw.x||0)**2+(raw.y||0)**2+(raw.z||0)**2);
      const now=Date.now();
      if(m>22&&now-lastShake>700){
        lastShake=now;
        for(let i=0;i<NUM;i++){pvx[i]+=(Math.random()-.5)*1100; pvy[i]+=(Math.random()-.5)*1100;}
      }
    }
  });
}

canvas.addEventListener('pointerdown', e=>{
  if(!running) return; e.preventDefault();
  const tx=e.clientX, ty=e.clientY;
  for(let i=0;i<NUM;i++){
    const dx=px[i]-tx, dy=py[i]-ty, d=Math.sqrt(dx*dx+dy*dy);
    if(d<110&&d>.1){const f=(110-d)/110*750; pvx[i]+=dx/d*f; pvy[i]+=dy/d*f;}
  }
},{passive:false});

// ============================================================
//  LOOP
// ============================================================
function loop(){
  if(!running) return;
  computeDens(); computeForces(); integrate(); render();
  requestAnimationFrame(loop);
}

async function start(){
  document.getElementById('ui').style.display='none';
  buildTextures(); initParticles();
  if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){
    try{const p=await DeviceMotionEvent.requestPermission(); if(p==='granted') setupMotion();}
    catch(err){console.warn(err);}
  } else { setupMotion(); }
  running=true; requestAnimationFrame(loop);
}
</script>
</body>
</html>
