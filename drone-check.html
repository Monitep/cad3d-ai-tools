<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DroneCheck</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;600;700;900&display=swap');
:root{
  --bg:#070a0e;--sf:#0d1117;--sf2:#111620;--br:#1c2333;
  --green:#00e87a;--yel:#ffcc00;--red:#ff3355;--blu:#4d9fff;--ora:#ff8c00;
  --txt:#c8d6e8;--mut:#4a5568;
  --mono:'Share Tech Mono',monospace;--sans:'Barlow Condensed',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);min-height:100vh}
body::before{content:'';position:fixed;inset:0;
  background-image:linear-gradient(rgba(77,159,255,.02)1px,transparent 1px),
  linear-gradient(90deg,rgba(77,159,255,.02)1px,transparent 1px);
  background-size:36px 36px;pointer-events:none;z-index:0}
.app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:16px 13px 50px}

.hdr{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.hdr-l{flex:1}
.logo{font-family:var(--mono);font-size:10px;color:var(--blu);letter-spacing:.15em;opacity:.6;margin-bottom:2px}
.htitle{font-size:24px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.htitle small{display:block;font-size:10px;font-weight:400;letter-spacing:.2em;color:var(--mut);margin-top:3px}

/* STATUS */
.sc{border-radius:14px;padding:20px 17px;margin-bottom:12px;border:1px solid var(--br);
  background:var(--sf);transition:border-color .4s,background .4s}
.sc.g{border-color:var(--green);background:linear-gradient(135deg,#0d1117 55%,#00e87a07)}
.sc.y{border-color:var(--yel);background:linear-gradient(135deg,#0d1117 55%,#ffcc0007)}
.sc.r{border-color:var(--red);background:linear-gradient(135deg,#0d1117 55%,#ff335507)}
.slbl{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--mut);margin-bottom:9px}
.smain{display:flex;align-items:center;gap:15px}
.sball{width:58px;height:58px;border-radius:50%;border:2px solid var(--br);
  display:flex;align-items:center;justify-content:center;font-size:25px;flex-shrink:0;position:relative}
.g .sball{border-color:var(--green)}.y .sball{border-color:var(--yel)}.r .sball{border-color:var(--red)}
.sball.pulse::after{content:'';position:absolute;inset:-6px;border-radius:50%;
  border:2px solid currentColor;animation:pr 2s infinite}
.g .sball.pulse{color:var(--green)}.y .sball.pulse{color:var(--yel)}.r .sball.pulse{color:var(--red)}
@keyframes pr{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.5);opacity:0}}
.sv{font-size:32px;font-weight:900;text-transform:uppercase;line-height:1}
.g .sv{color:var(--green)}.y .sv{color:var(--yel)}.r .sv{color:var(--red)}
.ss{font-size:13px;color:var(--txt);margin-top:4px;opacity:.75;line-height:1.3}
.gps{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:12px;
  border-top:1px solid var(--br);font-family:var(--mono);font-size:11px;color:var(--mut)}
.gdot{width:7px;height:7px;border-radius:50%;background:var(--mut);flex-shrink:0}
.gdot.on{background:var(--green);animation:bl 2s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.3}}
.gv{color:var(--txt);flex:1;font-size:12px}
.gacc{font-family:var(--mono);font-size:10px;color:var(--mut);background:rgba(255,255,255,.03);
  border:1px solid var(--br);border-radius:5px;padding:2px 6px}

/* SECTION */
.st{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--mut);text-transform:uppercase;
  margin-bottom:9px;display:flex;align-items:center;gap:8px}
.st::after{content:'';flex:1;height:1px;background:var(--br)}

/* CARDS */
.card{background:var(--sf);border:1px solid var(--br);border-radius:10px;margin-bottom:12px}

/* ZONES */
.zlist{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.zi{background:var(--sf);border:1px solid rgba(255,51,85,.4);background:rgba(255,51,85,.04);border-radius:10px;padding:11px 13px;display:flex;align-items:flex-start;gap:10px}
.zy{background:var(--sf);border:1px solid rgba(255,204,0,.3);background:rgba(255,204,0,.04);border-radius:10px;padding:11px 13px;display:flex;align-items:flex-start;gap:10px}
.zb{background:var(--sf);border:1px solid rgba(77,159,255,.25);border-radius:10px;padding:11px 13px;display:flex;align-items:flex-start;gap:10px}
.zdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:4px}
.zi .zdot{background:var(--red)}.zy .zdot{background:var(--yel)}.zb .zdot{background:var(--blu)}
.zinfo{flex:1;min-width:0}
.zname{font-size:14px;font-weight:700;line-height:1.2}
.ztype{font-size:11px;color:var(--mut);margin-top:1px}
.zalt{font-family:var(--mono);font-size:10px;color:var(--mut);margin-top:2px}
.zbadge{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:4px;font-weight:bold;flex-shrink:0}
.zi .zbadge{background:rgba(255,51,85,.2);color:var(--red)}
.zy .zbadge{background:rgba(255,204,0,.2);color:var(--yel)}
.zb .zbadge{background:rgba(77,159,255,.15);color:var(--blu)}

/* NOTAM */
.nlist{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.nitem{background:var(--sf);border-radius:10px;padding:12px 13px;cursor:pointer;touch-action:manipulation;user-select:none}
.nitem.na{border:1px solid rgba(255,51,85,.4);background:rgba(255,51,85,.04)}
.nitem.nf{border:1px solid rgba(255,204,0,.3);background:rgba(255,204,0,.04)}
.nitem.ni{border:1px solid rgba(77,159,255,.25)}
.nhdr{display:flex;align-items:flex-start;gap:8px}
.nbadge{font-family:var(--mono);font-size:10px;font-weight:bold;padding:2px 7px;border-radius:4px;flex-shrink:0;margin-top:1px}
.na .nbadge{background:rgba(255,51,85,.2);color:var(--red)}
.nf .nbadge{background:rgba(255,204,0,.2);color:var(--yel)}
.ni .nbadge{background:rgba(77,159,255,.15);color:var(--blu)}
.nid{font-family:var(--mono);font-size:11px;color:var(--blu);flex:1;word-break:break-all}
.nloc{font-family:var(--mono);font-size:11px;color:var(--mut);flex-shrink:0}
.nsum{font-size:13px;color:var(--txt);margin-top:6px;line-height:1.4;opacity:.85}
.ntime{font-family:var(--mono);font-size:10px;color:var(--mut);margin-top:5px}
.nfull{display:none;margin-top:9px;padding-top:9px;border-top:1px solid var(--br);
  font-family:var(--mono);font-size:11px;color:var(--mut);line-height:1.6;white-space:pre-wrap;word-break:break-all}
.nitem.exp .nfull{display:block}

/* METAR */
.met{padding:13px;border-radius:10px;background:var(--sf);border:1px solid var(--br);margin-bottom:12px}
.met-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.met-icao{font-family:var(--mono);font-size:13px;color:var(--blu);font-weight:bold}
.met-name{font-size:11px;color:var(--mut)}
.fcat{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:4px;font-weight:bold}
.fcat.VFR{background:rgba(0,232,122,.2);color:var(--green)}
.fcat.MVFR{background:rgba(77,159,255,.2);color:var(--blu)}
.fcat.IFR,.fcat.LIFR{background:rgba(255,51,85,.2);color:var(--red)}
.met-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.met-item{background:var(--sf2);border-radius:7px;padding:8px 10px}
.met-lbl{font-family:var(--mono);font-size:9px;color:var(--mut);letter-spacing:.1em;margin-bottom:2px}
.met-val{font-size:15px;font-weight:700;letter-spacing:.02em}
.met-unit{font-size:10px;color:var(--mut);font-weight:400;margin-left:2px}
.met-raw{margin-top:9px;padding-top:9px;border-top:1px solid var(--br);
  font-family:var(--mono);font-size:10px;color:var(--mut);word-break:break-all;line-height:1.5}
.wind-arrow{display:inline-block;margin-right:4px}

/* MISC */
.disc{background:rgba(255,204,0,.03);border:1px solid rgba(255,204,0,.15);
  border-radius:10px;padding:11px 13px;margin-bottom:12px;display:flex;gap:9px}
.disc p{font-size:11px;line-height:1.5;color:rgba(255,204,0,.7)}
.ubar{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--sf2);
  border:1px solid var(--br);border-radius:8px;margin-bottom:12px;font-family:var(--mono);font-size:10px;color:var(--mut)}
.ufr{color:var(--green)}.ulo{color:var(--yel)}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.btn{border:1px solid var(--br);background:var(--sf);color:var(--txt);border-radius:11px;
  padding:13px 10px;font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;
  text-decoration:none;touch-action:manipulation;user-select:none;transition:transform .1s,opacity .1s}
.btn:active{transform:scale(.95);opacity:.75}
.btn .ico{font-size:21px}
.bblu{border-color:rgba(77,159,255,.5);background:rgba(77,159,255,.08);color:var(--blu)}
.bful{grid-column:1/-1;flex-direction:row;justify-content:center;padding:14px;font-size:14px;gap:8px}
.empty{text-align:center;padding:18px;background:var(--sf);border:1px solid var(--br);border-radius:10px;margin-bottom:12px}
.empty .eico{font-size:26px;margin-bottom:6px}
.empty p{font-size:12px;color:var(--mut);line-height:1.5}
.fetch-ing{display:flex;align-items:center;gap:10px;padding:13px;background:var(--sf);
  border:1px solid var(--br);border-radius:10px;margin-bottom:12px}
.ms{width:14px;height:14px;border:2px solid var(--br);border-top-color:var(--blu);
  border-radius:50%;animation:sp .6s linear infinite;flex-shrink:0}
.fetch-ing span{font-family:var(--mono);font-size:11px;color:var(--mut)}
.loading{text-align:center;padding:50px 20px}
.sp{width:44px;height:44px;border:3px solid var(--br);border-top-color:var(--blu);
  border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 16px}
@keyframes sp{to{transform:rotate(360deg)}}
.loading p{font-family:var(--mono);font-size:12px;color:var(--mut)}
.loading .sub{font-size:11px;opacity:.6;margin-top:4px}
.fn{font-size:10px;color:var(--mut);font-family:var(--mono);text-align:center;margin-top:10px;opacity:.5}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.fi{animation:fi .3s ease}
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <div class="hdr-l">
      <div class="logo">NOTAM · ZONES · METAR — LIVE</div>
      <div class="htitle">DroneCheck<small>ITALIA — CONDIZIONI VOLO</small></div>
    </div>
    <span style="font-size:28px">🛸</span>
  </div>
  <div id="mc">
    <div class="loading"><div class="sp"></div><p>Rilevamento GPS...</p><p class="sub">Assicurati di avere il GPS attivo</p></div>
  </div>
</div>
<script>
const PROXY = 'https://cad3d.expert/ai/notam-proxy.php';

// ── TYPE MAP ──────────────────────────────────────────────────────────────────
const TYPES={0:{l:'Airspace',s:'b'},1:{l:'RESTRICTED',s:'r'},2:{l:'DANGER',s:'r'},
  3:{l:'PROHIBITED',s:'r'},4:{l:'CTR',s:'r'},5:{l:'TMA',s:'y'},6:{l:'TMZ',s:'y'},
  7:{l:'RMZ',s:'y'},8:{l:'ATZ',s:'y'},9:{l:'ATZ Airport',s:'y'},10:{l:'Airway',s:'b'},
  11:{l:'MTR',s:'b'},12:{l:'Alert',s:'y'},13:{l:'ADIZ',s:'y'},14:{l:'NOTAM Zone',s:'y'}};

// ── AIRPORTS (for METAR + NOTAM link) ─────────────────────────────────────────
const APS=[
  ['Milano Malpensa','LIMC',45.6306,8.7281],['Lugano CH','LSZA',45.9728,8.9106],
  ['Milano Linate','LIML',45.4454,9.2797],['Bergamo','LIME',45.6739,9.7042],
  ['Torino','LIMF',45.2008,7.6497],['Genova','LIMJ',44.4133,8.8375],
  ['Brescia','LIPO',45.4289,10.3306],['Verona','LIPX',45.3957,10.8886],
  ['Venezia','LIPZ',45.5053,12.3519],['Treviso','LIPH',45.6484,12.1944],
  ['Trieste','LIPQ',45.8275,13.4722],['Bolzano','LIPB',46.4602,11.3264],
  ['Bologna','LIPE',44.5354,11.2887],['Firenze','LIRQ',43.810,11.2051],
  ['Pisa','LIRP',43.6839,10.3927],['Roma FCO','LIRF',41.7999,12.2462],
  ['Roma CIA','LIRA',41.7994,12.5949],['Napoli','LIRN',40.886,14.2908],
  ['Bari','LIBD',41.1389,16.7606],['Palermo','LICJ',38.176,13.091],
  ['Catania','LICC',37.4668,15.0664],['Cagliari','LIEE',39.2515,9.0543],
];

// ── UTILS ─────────────────────────────────────────────────────────────────────
const hav=(la1,lo1,la2,lo2)=>{
  const R=6371,dL=(la2-la1)*Math.PI/180,dO=(lo2-lo1)*Math.PI/180;
  const a=Math.sin(dL/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dO/2)**2;
  return R*2*Math.asin(Math.sqrt(a));
};
const fmtD=d=>d<1?(d*1e3).toFixed(0)+'m':d.toFixed(1)+'km';
const esc=s=>s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):'';

// ── POINT IN POLYGON ──────────────────────────────────────────────────────────
function pip(lon,lat,ring){
  let ins=false;
  for(let i=0,j=ring.length-1;i<ring.length;j=i++){
    const[xi,yi]=ring[i],[xj,yj]=ring[j];
    if(((yi>lat)!==(yj>lat))&&(lon<(xj-xi)*(lat-yi)/(yj-yi)+xi))ins=!ins;
  }
  return ins;
}
function inGeom(lon,lat,g){
  if(!g)return false;
  if(g.type==='Polygon')return pip(lon,lat,g.coordinates[0]);
  if(g.type==='MultiPolygon')return g.coordinates.some(p=>pip(lon,lat,p[0]));
  return false;
}

// ── ALT FORMAT ────────────────────────────────────────────────────────────────
function fmtAlt(lim){
  if(!lim)return '';
  const v=lim.value??lim.val??0;
  const u=String(lim.unit?.shortName||lim.unit||'FT').toUpperCase();
  const r=String(lim.referenceDatum?.shortName||lim.referenceDatum||'MSL').toUpperCase();
  if(v===0&&(r==='GND'||r==='SFC'))return 'GND';
  if(u==='FL'||u==='6')return `FL${String(v).padStart(3,'0')}`;
  return `${v}ft ${r}`;
}

function affectsDrone(as){
  const t=as.type?.value??as.type??-1;
  if(t===10||t===11)return false;
  const ll=as.lowerLimit||as.lower_limit;
  if(!ll)return true;
  const v=ll.value??ll.val??0;
  const u=String(ll.unit?.shortName||ll.unit||'FT').toUpperCase();
  if(u==='FL'&&v>10)return false;
  if((u==='FT'||u==='0')&&v>1000)return false;
  return true;
}

// ── NEARBY AIRPORTS ───────────────────────────────────────────────────────────
function nearbyAP(lat,lon,n=4){
  const seen=new Set();
  return APS.map(([name,icao,alat,alon])=>({name,icao,d:hav(lat,lon,alat,alon)}))
    .sort((a,b)=>a.d-b.d)
    .filter(a=>{if(seen.has(a.icao))return false;seen.add(a.icao);return true;})
    .slice(0,n);
}

// ── FETCH VIA PROXY ───────────────────────────────────────────────────────────
async function call(params,timeout=14000){
  const url=PROXY+'?'+new URLSearchParams(params);
  const r=await fetch(url,{signal:AbortSignal.timeout(timeout)});
  if(!r.ok)throw new Error(`HTTP ${r.status}`);
  return r.json();
}

// ── NOTAM PARSE ───────────────────────────────────────────────────────────────
function parseNotams(arr){
  if(!Array.isArray(arr))return[];
  const now=Date.now();
  return arr.map(n=>{
    const id=n.notamID||n.id||'?';
    const icao=n.icaoLocation||n.location||'';
    const text=n.traditionalMessage||n.text||n.message||'';
    let start=null,end=null,isActive=false,isUpcoming=false;
    try{
      if(n.startTime)start=new Date(n.startTime);
      if(n.endTime)end=new Date(n.endTime);
      if(start&&end){isActive=start<=now&&end>=now;isUpcoming=start>now&&start<now+86400000*3;}
      else isActive=true;
    }catch(_){}
    const up=text.toUpperCase();
    const hi=/UAS|DRONE|UAV|RPAS|VIETATO|PROHIBIT|RESTRICT|DANGER|TFR|\bD\d|\bR\d|\bP\d/.test(up);
    const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length>5);
    const sum=lines.slice(0,2).join(' ').substring(0,130)+(text.length>130?'…':'');
    return{id,icao,text,sum,start,end,isActive,isUpcoming,hi};
  })
  .filter(n=>n.isActive||n.isUpcoming)
  .sort((a,b)=>{if(a.isActive!==b.isActive)return a.isActive?-1:1;if(a.hi!==b.hi)return a.hi?-1:1;return 0;});
}

// ── METAR PARSE ───────────────────────────────────────────────────────────────
function parseMetar(arr){
  if(!Array.isArray(arr)||arr.length===0)return null;
  const m=arr[0];
  const wdir=m.wdir??m.windDirDegrees??null;
  const wspd=m.wspd??m.windSpeedKt??null;
  const wgst=m.wgst??m.windGustKt??null;
  const vis=m.visib??m.visibilityStatuteMi??null;
  const tmp=m.temp??m.tempC??null;
  const clouds=m.clouds||[];
  const cat=m.flightCategory||m.fltcat||'';
  const raw=m.rawOb||m.rawMetar||m.raw||'';
  const icao=m.icaoId||m.stationId||'';
  const name=m.name||m.stationName||'';
  // Ceiling = lowest BKN or OVC
  let ceil=null;
  for(const c of clouds){
    const cov=(c.cover||c.coverage||'').toUpperCase();
    if((cov==='BKN'||cov==='OVC')&&c.base!=null){ceil=c.base;break;}
  }
  return{icao,name,wdir,wspd,wgst,vis,tmp,ceil,cat,clouds,raw};
}

function windArrow(deg){
  if(deg==null)return '';
  const rot=(deg+180)%360;
  return `<span class="wind-arrow" style="display:inline-block;transform:rotate(${rot}deg)">↑</span>`;
}

// ── STATE ─────────────────────────────────────────────────────────────────────
let LAT=null,LON=null,ACC=null,lastUp=null;

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(zones,notams,metar,loadingZones,loadingNotams,loadingMetar){
  const aps=nearbyAP(LAT,LON);
  const icaoStr=aps.map(a=>a.icao).join(',');
  const faaUrl=`https://notams.aim.faa.gov/notamSearch/?searchType=0&designatorsForLocation=${icaoStr}`;

  // ── Process zones ──
  const inside=[],nearby=[];
  if(zones?.items){
    for(const as of zones.items.filter(affectsDrone)){
      const t=as.type?.value??as.type??0;
      const info=TYPES[t]||{l:'Zona',s:'b'};
      const obj={name:as.name||'Zona',typeLabel:info.l,sev:info.s,
        altLow:fmtAlt(as.lowerLimit||as.lower_limit),
        altHigh:fmtAlt(as.upperLimit||as.upper_limit),
        icaoClass:as.icaoClass?.shortName||as.icaoClass||''};
      if(as.geometry&&inGeom(LON,LAT,as.geometry)){obj.status='DENTRO';inside.push(obj);}
      else{
        const c=as.centroid;
        if(c?.type==='Point'){const[lo,la]=c.coordinates;const d=hav(LAT,LON,la,lo);if(d<15){obj.status='VICINO';obj.dist=d;nearby.push(obj);}}
      }
    }
    nearby.sort((a,b)=>(a.dist||99)-(b.dist||99));
  }

  // ── Process NOTAMs ──
  const notamList=Array.isArray(notams)?parseNotams(notams):[];
  const hiActive=notamList.filter(n=>n.isActive&&n.hi);

  // ── Process METAR ──
  const met=parseMetar(Array.isArray(metar)?metar:[]);

  // ── Verdict ──
  const redIn=inside.filter(z=>z.sev==='r');
  const yelIn=inside.filter(z=>z.sev==='y');
  const metBad=met&&(met.wspd!=null&&met.wspd>15||met.ceil!=null&&met.ceil<1000||met.cat==='IFR'||met.cat==='LIFR');
  let cls,ico,verdict,sub;
  if(redIn.length||hiActive.length){
    cls='r';ico='⛔';verdict='VIETATO';
    const r=[];if(redIn.length)r.push(redIn.length+' zona CTR/RESTR');if(hiActive.length)r.push(hiActive.length+' NOTAM critico');
    sub=r.join(' + ');
  } else if(yelIn.length||notamList.filter(n=>n.isActive).length||metBad){
    cls='y';ico='⚠️';verdict='ATTENZIONE';
    const r=[];if(yelIn.length)r.push(yelIn.length+' zona TMA/ATZ');
    if(notamList.filter(n=>n.isActive).length)r.push('NOTAM attivi');
    if(metBad)r.push('meteo limitante');
    sub=r.join(' · ')||'Verifica raccomandata';
  } else if(loadingZones||loadingNotams){
    cls='y';ico='⏳';verdict='VERIFICA';sub='Caricamento dati in corso...';
  } else {
    cls='g';ico='✅';verdict='LIBERO';sub='Nessuna restrizione rilevata'+(met?` · ${met.cat||'VFR'}`:'')+' ✓';
  }

  // ── Zones HTML ──
  const allZ=[...inside,...nearby.slice(0,5)];
  let zHtml='';
  if(loadingZones){zHtml=`<div class="fetch-ing"><div class="ms"></div><span>Caricamento zone OpenAIP...</span></div>`;}
  else if(!zones){zHtml=`<div class="empty"><div class="eico">📡</div><p>Zone non disponibili</p></div>`;}
  else if(allZ.length===0){zHtml=`<div class="empty"><div class="eico">🌿</div><p>Nessuna zona aeronautica nei ~55 km.<br>Spazio aereo libero in questa area.</p></div>`;}
  else{
    const cmap={r:'zi',y:'zy',b:'zb'};
    zHtml=`<div class="zlist">${allZ.map(z=>`
      <div class="${cmap[z.sev]||'zb'}">
        <div class="zdot"></div>
        <div class="zinfo">
          <div class="zname">${esc(z.name)}</div>
          <div class="ztype">${esc(z.typeLabel)}${z.icaoClass?' · Cl.'+esc(z.icaoClass):''}</div>
          ${(z.altLow||z.altHigh)?`<div class="zalt">${z.altLow||'?'} → ${z.altHigh||'?'}</div>`:''}
        </div>
        <span class="zbadge">${esc(z.status)}${z.dist?' '+fmtD(z.dist):''}</span>
      </div>`).join('')}</div>`;
  }

  // ── NOTAM HTML ──
  let nHtml='';
  if(loadingNotams){nHtml=`<div class="fetch-ing"><div class="ms"></div><span>Recupero NOTAM live...</span></div>`;}
  else if(!Array.isArray(notams)){
    nHtml=`<div class="empty"><div class="eico">📡</div><p>NOTAM non disponibili.<br>Proxy non raggiungibile.</p></div>`;
  } else if(notamList.length===0){
    nHtml=`<div class="empty"><div class="eico">📭</div><p>Nessun NOTAM attivo nel raggio ~80 km.</p></div>`;
  } else {
    nHtml=`<div class="nlist">${notamList.map(n=>{
      const c=n.hi&&n.isActive?'na':n.isUpcoming?'nf':'ni';
      const b=n.hi&&n.isActive?'CRITICO':n.isUpcoming?'FUTURO':'INFO';
      const fmtT=d=>d?d.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'})+'&nbsp;'+d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})+'z':'';
      return `<div class="nitem ${c}" onclick="this.classList.toggle('exp')">
        <div class="nhdr"><span class="nbadge">${b}</span><span class="nid">${esc(n.id)}</span><span class="nloc">${esc(n.icao)}</span></div>
        <div class="nsum">${esc(n.sum)}</div>
        ${n.start?`<div class="ntime">▶ ${fmtT(n.start)}${n.end?' → '+fmtT(n.end):''}</div>`:''}
        <div class="nfull">${esc(n.text)}</div>
      </div>`;
    }).join('')}</div>`;
  }

  // ── METAR HTML ──
  let mHtml='';
  if(loadingMetar){mHtml=`<div class="fetch-ing"><div class="ms"></div><span>Recupero meteo METAR...</span></div>`;}
  else if(!met){mHtml=`<div class="empty"><div class="eico">🌤️</div><p>Meteo non disponibile</p></div>`;}
  else{
    const catCls=met.cat&&['VFR','MVFR','IFR','LIFR'].includes(met.cat)?met.cat:'VFR';
    const windStr=met.wspd!=null?`${windArrow(met.wdir)}${met.wdir!=null?met.wdir+'°&nbsp;':''}<b>${met.wspd}</b><span class="met-unit">kt</span>${met.wgst?`&nbsp;G<b>${met.wgst}</b>kt`:''}`:'-';
    const visStr=met.vis!=null?`<b>${met.vis}</b><span class="met-unit">${parseFloat(met.vis)>2?'km':'km'}</span>`:'-';
    const ceilStr=met.ceil!=null?`<b>${met.ceil}</b><span class="met-unit">ft</span>`:'<b>CAVOK</b>';
    const tmpStr=met.tmp!=null?`<b>${met.tmp}</b><span class="met-unit">°C</span>`:'-';
    mHtml=`<div class="met">
      <div class="met-hdr">
        <div><div class="met-icao">${esc(met.icao)}</div><div class="met-name">${esc(met.name||aps[0]?.name||'')}</div></div>
        <span class="fcat ${catCls}">${met.cat||'VFR'}</span>
      </div>
      <div class="met-grid">
        <div class="met-item"><div class="met-lbl">VENTO</div><div class="met-val">${windStr}</div></div>
        <div class="met-item"><div class="met-lbl">VISIBILITÀ</div><div class="met-val">${visStr}</div></div>
        <div class="met-item"><div class="met-lbl">SOFFITTO</div><div class="met-val">${ceilStr}</div></div>
        <div class="met-item"><div class="met-lbl">TEMP</div><div class="met-val">${tmpStr}</div></div>
      </div>
      ${met.raw?`<div class="met-raw">${esc(met.raw)}</div>`:''}
    </div>`;
  }

  const upStr=lastUp?lastUp.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})+' UTC':'';

  document.getElementById('mc').innerHTML=`
    <div class="sc ${cls} fi">
      <div class="slbl">// STATO VOLO — POSIZIONE CORRENTE</div>
      <div class="smain">
        <div class="sball${cls==='g'?' pulse':''}">${ico}</div>
        <div><div class="sv">${verdict}</div><div class="ss">${sub}</div></div>
      </div>
      <div class="gps">
        <div class="gdot on"></div>
        <div class="gv">${LAT.toFixed(5)}, ${LON.toFixed(5)}</div>
        <div class="gacc">±${ACC<10000?Math.round(ACC):'>1k'}m</div>
      </div>
    </div>

    <div class="ubar">
      <span class="${zones&&notams?'ufr':'ulo'}">●</span>
      <span>${zones&&notams?'LIVE':'Parziale'}</span>
      ${upStr?`<span style="margin-left:auto">${upStr}</span>`:''}
    </div>

    <div class="st">Meteo aeroporto più vicino</div>
    ${mHtml}

    <div class="st">Zone aeree${zones?.items?' — '+allZ.length+' rilevate':''}</div>
    ${zHtml}

    <div class="st">NOTAM live${Array.isArray(notams)?' — '+notamList.length+' nel raggio':''}</div>
    ${nHtml}

    <div class="disc">
      <span style="font-size:13px;flex-shrink:0;margin-top:1px">⚠️</span>
      <p>Zone da OpenAIP (agg. mensile). NOTAM live da ICAO/aviationweather.gov. Meteo da METAR reale. Possono mancare zone militari classificate. Verificare sempre su D-Flight prima di volare.</p>
    </div>

    <div class="st">Azioni rapide</div>
    <div class="bgrid">
      <a href="https://www.d-flight.it/web-app" target="_blank" class="btn bblu"><span class="ico">🛫</span>D-Flight</a>
      <a href="${faaUrl}" target="_blank" class="btn bblu"><span class="ico">📋</span>NOTAM FAA</a>
      <button class="btn" id="cpbtn" onclick="copyC()"><span class="ico">📋</span>Copia GPS</button>
      <button class="btn" onclick="go()"><span class="ico">🔄</span>Aggiorna</button>
    </div>
    <div class="fn">MAX 120m AGL · ENAC UAS-IT · Verificare su D-Flight</div>
  `;
}

function copyC(){
  if(!LAT)return;
  navigator.clipboard.writeText(`${LAT.toFixed(6)}, ${LON.toFixed(6)}`).then(()=>{
    const b=document.getElementById('cpbtn');
    if(b){const o=b.innerHTML;b.innerHTML='<span class="ico">✅</span>Copiato!';setTimeout(()=>{if(b)b.innerHTML=o;},1500);}
  });
}

// ── ENTRY ─────────────────────────────────────────────────────────────────────
async function go(){
  document.getElementById('mc').innerHTML=`
    <div class="loading"><div class="sp"></div><p>Rilevamento GPS...</p><p class="sub">Assicurati di avere il GPS attivo</p></div>`;

  if(!navigator.geolocation){
    document.getElementById('mc').innerHTML=`
      <div style="background:var(--sf);border:1px solid rgba(255,51,85,.4);border-radius:14px;padding:28px 18px;text-align:center;margin-bottom:12px">
        <h3 style="color:var(--red);margin-bottom:8px;font-size:18px">GPS non supportato</h3>
        <p style="font-size:13px;color:var(--mut)">Usa un browser con supporto geolocalizzazione.</p>
      </div>`;
    return;
  }

  navigator.geolocation.getCurrentPosition(async pos=>{
    LAT=pos.coords.latitude; LON=pos.coords.longitude; ACC=pos.coords.accuracy;
    // Show loading state immediately
    render(null,null,null,true,true,true);

    const aps=nearbyAP(LAT,LON,3);
    const icaos=aps.map(a=>a.icao).join(',');

    // Fetch all three in parallel
    const [zonesRes,notamsRes,metarRes]=await Promise.allSettled([
      call({action:'airspaces',lat:LAT,lon:LON}),
      call({action:'notam',lat:LAT,lon:LON}),
      call({action:'metar',icaos}),
    ]);

    lastUp=new Date();
    const zones=zonesRes.status==='fulfilled'?zonesRes.value:null;
    const notams=notamsRes.status==='fulfilled'?notamsRes.value:null;
    const metar=metarRes.status==='fulfilled'?metarRes.value:null;

    render(zones,notams,metar,false,false,false);
  },
  err=>{
    let msg='Impossibile ottenere la posizione.';
    if(err.code===1)msg='Accesso GPS negato. Abilitalo nelle impostazioni del browser.';
    if(err.code===3)msg='Timeout GPS. Vai all\'aperto e riprova.';
    document.getElementById('mc').innerHTML=`
      <div style="background:var(--sf);border:1px solid rgba(255,51,85,.35);border-radius:14px;padding:28px 18px;text-align:center;margin-bottom:12px">
        <div style="font-size:36px;margin-bottom:10px">📡</div>
        <h3 style="font-size:18px;font-weight:800;color:var(--red);margin-bottom:8px">GPS non disponibile</h3>
        <p style="font-size:13px;color:var(--mut)">${msg}</p>
      </div>
      <div class="bgrid">
        <a href="https://www.d-flight.it/web-app" target="_blank" class="btn bblu"><span class="ico">🛫</span>D-Flight</a>
        <button class="btn" onclick="go()"><span class="ico">🔄</span>Riprova</button>
      </div>`;
  },{enableHighAccuracy:true,timeout:12000,maximumAge:0});
}

go();
</script>
</body>
</html>
