<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DroneCheck Italia</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;400;600;700;900&display=swap');
:root{
  --bg:#070a0e;--surface:#0d1117;--surface2:#111620;--border:#1c2333;
  --green:#00e87a;--yellow:#ffcc00;--red:#ff3355;--blue:#4d9fff;--orange:#ff8c00;
  --text:#c8d6e8;--muted:#4a5568;
  --mono:'Share Tech Mono',monospace;--sans:'Barlow Condensed',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;
  background-image:linear-gradient(rgba(77,159,255,.025) 1px,transparent 1px),
  linear-gradient(90deg,rgba(77,159,255,.025) 1px,transparent 1px);
  background-size:36px 36px;pointer-events:none;z-index:0}
.app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:18px 14px 50px}

/* HEADER */
.header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.logo{font-family:var(--mono);font-size:10px;color:var(--blue);letter-spacing:.15em;opacity:.7;margin-bottom:2px}
.title{font-size:24px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.title small{display:block;font-size:10px;font-weight:400;letter-spacing:.22em;color:var(--muted);margin-top:3px}
.drone-ico{font-size:30px;margin-left:auto}

/* STATUS CARD */
.status-card{border-radius:14px;padding:22px 18px;margin-bottom:14px;
  border:1px solid var(--border);background:var(--surface);position:relative;overflow:hidden;transition:border-color .4s,background .4s}
.status-card.green{border-color:var(--green);background:linear-gradient(135deg,#0d1117 60%,#00e87a08)}
.status-card.yellow{border-color:var(--yellow);background:linear-gradient(135deg,#0d1117 60%,#ffcc0008)}
.status-card.red{border-color:var(--red);background:linear-gradient(135deg,#0d1117 60%,#ff335508)}
.slabel{font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:var(--muted);margin-bottom:10px}
.smain{display:flex;align-items:center;gap:16px}
.sball{width:60px;height:60px;border-radius:50%;border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;position:relative;transition:border-color .4s}
.green .sball{border-color:var(--green)}
.yellow .sball{border-color:var(--yellow)}
.red .sball{border-color:var(--red)}
.sball.pulse::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid currentColor;animation:pring 2s infinite}
.green .sball.pulse{color:var(--green)}.yellow .sball.pulse{color:var(--yellow)}.red .sball.pulse{color:var(--red)}
@keyframes pring{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.sverdict{font-size:34px;font-weight:900;text-transform:uppercase;line-height:1;transition:color .4s}
.green .sverdict{color:var(--green)}.yellow .sverdict{color:var(--yellow)}.red .sverdict{color:var(--red)}
.ssub{font-size:13px;color:var(--text);margin-top:4px;opacity:.75;line-height:1.35}
.gps-row{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:14px;
  border-top:1px solid var(--border);font-family:var(--mono);font-size:11px;color:var(--muted)}
.gps-dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0}
.gps-dot.on{background:var(--green);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.gps-val{color:var(--text);flex:1;font-size:12px}
.acc{font-family:var(--mono);font-size:10px;color:var(--muted);
  background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:5px;padding:2px 6px}

/* SECTIONS */
.stitle{font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;
  margin-bottom:10px;display:flex;align-items:center;gap:8px}
.stitle::after{content:'';flex:1;height:1px;background:var(--border)}

/* ZONE ITEMS */
.zlist{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.zitem{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 13px;
  display:flex;align-items:flex-start;gap:11px}
.zitem.zi{border-color:rgba(255,51,85,.4);background:rgba(255,51,85,.05)}
.zitem.zy{border-color:rgba(255,204,0,.3);background:rgba(255,204,0,.04)}
.zitem.zb{border-color:rgba(77,159,255,.25)}
.zdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:5px}
.zi .zdot{background:var(--red)}.zy .zdot{background:var(--yellow)}.zb .zdot{background:var(--blue)}
.zinfo{flex:1;min-width:0}
.zname{font-size:14px;font-weight:700;line-height:1.2}
.ztype{font-size:11px;color:var(--muted);margin-top:1px}
.zalt{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:3px}
.zright{text-align:right;flex-shrink:0}
.zbadge{display:inline-block;font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:4px;font-weight:bold}
.zi .zbadge{background:rgba(255,51,85,.2);color:var(--red)}
.zy .zbadge{background:rgba(255,204,0,.2);color:var(--yellow)}
.zb .zbadge{background:rgba(77,159,255,.15);color:var(--blue)}

/* NOTAM BOX */
.notam-box{background:var(--surface);border:1px solid rgba(77,159,255,.3);
  background:rgba(77,159,255,.04);border-radius:10px;padding:14px;margin-bottom:14px}
.notam-box p{font-size:12px;color:rgba(77,159,255,.85);line-height:1.5;margin-bottom:12px}
.notam-airports{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.notam-ap{display:flex;align-items:center;gap:10px;padding:8px 10px;
  background:var(--surface);border:1px solid var(--border);border-radius:8px}
.notam-icao{font-family:var(--mono);font-size:13px;color:var(--blue);min-width:44px;font-weight:bold}
.notam-name{font-size:12px;color:var(--muted);flex:1}
.notam-dist{font-family:var(--mono);font-size:11px;color:var(--muted)}

/* DISCLAIMER */
.disc{background:rgba(255,204,0,.04);border:1px solid rgba(255,204,0,.18);
  border-radius:10px;padding:11px 13px;margin-bottom:14px;display:flex;gap:9px;align-items:flex-start}
.disc p{font-size:11px;line-height:1.5;color:rgba(255,204,0,.75)}

/* BUTTONS */
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);
  border-radius:11px;padding:13px 10px;font-family:var(--sans);font-size:13px;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:5px;transition:transform .1s,opacity .1s;text-decoration:none;
  touch-action:manipulation;user-select:none}
.btn:active{transform:scale(.95);opacity:.75}
.btn .ico{font-size:22px}
.bblu{border-color:rgba(77,159,255,.5);background:rgba(77,159,255,.1);color:var(--blue)}
.bfull{grid-column:1/-1;flex-direction:row;justify-content:center;
  padding:15px;font-size:14px;gap:8px;border-color:rgba(77,159,255,.4);background:rgba(77,159,255,.08);color:var(--blue)}

/* LOADING */
.loading{text-align:center;padding:50px 20px}
.spinner{width:44px;height:44px;border:3px solid var(--border);border-top-color:var(--blue);
  border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{font-family:var(--mono);font-size:12px;color:var(--muted)}
.loading .sub{font-size:11px;opacity:.6;margin-top:4px}
.mini-spin{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--blue);
  border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0}
.fetching{display:flex;align-items:center;gap:10px;padding:14px;
  background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:14px}
.fetching span{font-family:var(--mono);font-size:11px;color:var(--muted)}

/* ERROR */
.errc{background:var(--surface);border:1px solid rgba(255,51,85,.35);
  border-radius:14px;padding:28px 18px;text-align:center;margin-bottom:14px}
.errc h3{font-size:18px;font-weight:800;color:var(--red);margin-bottom:8px}
.errc p{font-size:13px;color:var(--muted);line-height:1.5}

/* UPDATE BAR */
.ubar{display:flex;align-items:center;justify-content:space-between;
  padding:8px 13px;background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;margin-bottom:14px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.ufresh{color:var(--green)}
.umanual{color:var(--yellow)}

.footnote{font-size:10px;color:var(--muted);font-family:var(--mono);text-align:center;margin-top:10px;opacity:.5}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fi{animation:fi .3s ease forwards}

.empty{text-align:center;padding:18px;background:var(--surface);
  border:1px solid var(--border);border-radius:10px;margin-bottom:14px}
.empty .eico{font-size:26px;margin-bottom:6px}
.empty p{font-size:12px;color:var(--muted);line-height:1.5}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div>
      <div class="logo">OPENAIP · D-FLIGHT · NOTAM</div>
      <div class="title">DroneCheck<small>ITALIA — LIVE AIRSPACE</small></div>
    </div>
    <div class="drone-ico">🛸</div>
  </div>
  <div id="mc">
    <div class="loading"><div class="spinner"></div><p>Rilevamento GPS...</p><p class="sub">Assicurati di avere il GPS attivo</p></div>
  </div>
</div>
<script>
const OAIP_KEY = '1f30b1d752ccf615a93897fd493c488f';

// ── TYPE MAP ─────────────────────────────────────────────────────────────────
const TYPES = {
  0:{l:'Airspace',s:'info'},
  1:{l:'RESTRICTED',s:'red'},
  2:{l:'DANGER',s:'red'},
  3:{l:'PROHIBITED',s:'red'},
  4:{l:'CTR',s:'red'},
  5:{l:'TMA',s:'yellow'},
  6:{l:'TMZ',s:'yellow'},
  7:{l:'RMZ',s:'yellow'},
  8:{l:'ATZ',s:'yellow'},
  9:{l:'ATZ Airport',s:'yellow'},
  10:{l:'Airway',s:'info'},
  11:{l:'MTR',s:'info'},
  12:{l:'Alert',s:'yellow'},
  13:{l:'ADIZ',s:'yellow'},
  14:{l:'NOTAM Zone',s:'yellow'},
};

// ── NEARBY AIRPORTS for NOTAM link ───────────────────────────────────────────
const AIRPORTS = [
  ["Milano Malpensa","LIMC",45.6306,8.7281],["Milano Linate","LIML",45.4454,9.2797],
  ["Bergamo","LIME",45.6739,9.7042],["Lugano CH","LSZA",45.9728,8.9106],
  ["Torino","LIMF",45.2008,7.6497],["Genova","LIMJ",44.4133,8.8375],
  ["Brescia","LIPO",45.4289,10.3306],["Verona","LIPX",45.3957,10.8886],
  ["Venezia","LIPZ",45.5053,12.3519],["Treviso","LIPH",45.6484,12.1944],
  ["Trieste","LIPQ",45.8275,13.4722],["Bolzano","LIPB",46.4602,11.3264],
  ["Bologna","LIPE",44.5354,11.2887],["Firenze","LIRQ",43.810,11.2051],
  ["Pisa","LIRP",43.6839,10.3927],["Roma FCO","LIRF",41.7999,12.2462],
  ["Roma CIA","LIRA",41.7994,12.5949],["Napoli","LIRN",40.886,14.2908],
  ["Bari","LIBD",41.1389,16.7606],["Palermo","LICJ",38.176,13.091],
  ["Catania","LICC",37.4668,15.0664],["Cagliari","LIEE",39.2515,9.0543],
];

// ── UTILS ─────────────────────────────────────────────────────────────────────
function hav(la1,lo1,la2,lo2){
  const R=6371,dL=(la2-la1)*Math.PI/180,dO=(lo2-lo1)*Math.PI/180;
  const a=Math.sin(dL/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dO/2)**2;
  return R*2*Math.asin(Math.sqrt(a));
}
function fmtD(d){return d<1?(d*1000).toFixed(0)+'m':d.toFixed(1)+'km'}
function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):''}

// ── POINT IN POLYGON (ray casting) ───────────────────────────────────────────
function pip(lon,lat,ring){
  let inside=false;
  for(let i=0,j=ring.length-1;i<ring.length;j=i++){
    const [xi,yi]=ring[i],[xj,yj]=ring[j];
    if(((yi>lat)!==(yj>lat))&&(lon<(xj-xi)*(lat-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
function inGeom(lon,lat,geom){
  if(!geom) return false;
  if(geom.type==='Polygon') return pip(lon,lat,geom.coordinates[0]);
  if(geom.type==='MultiPolygon') return geom.coordinates.some(p=>pip(lon,lat,p[0]));
  return false;
}

// ── ALT FORMAT ───────────────────────────────────────────────────────────────
function fmtAlt(lim){
  if(!lim) return '';
  const v=lim.value??lim.val??0;
  const unit=(lim.unit?.shortName||lim.unit||'FT').toString().toUpperCase();
  const ref=(lim.referenceDatum?.shortName||lim.referenceDatum||'MSL').toString().toUpperCase();
  if(v===0&&(ref==='GND'||ref==='SFC')) return 'GND';
  if(unit==='FL'||unit==='6') return `FL${String(v).padStart(3,'0')}`;
  return `${v}ft ${ref}`;
}

// Check if airspace affects drones at 0-120m (roughly)
function affectsDrone(as){
  const t=as.type?.value??as.type??-1;
  // Skip pure airways and military training routes
  if(t===10||t===11) return false;
  // Check lower limit: skip if starts above FL010 (~1000ft)
  const ll=as.lowerLimit||as.lower_limit;
  if(!ll) return true; // include if unknown
  const v=ll.value??ll.val??0;
  const unit=(ll.unit?.shortName||ll.unit||'FT').toString().toUpperCase();
  if(unit==='FL'&&v>10) return false; // FL010+ above drone ceiling
  if((unit==='FT'||unit==='0')&&v>1000) return false; // above 1000ft
  return true;
}

// ── FETCH AIRSPACES FROM OPENAIP ─────────────────────────────────────────────
async function fetchAirspaces(lat,lon){
  const pad=0.5;
  const poly=JSON.stringify({
    type:'Polygon',
    coordinates:[[[lon-pad,lat-pad],[lon+pad,lat-pad],[lon+pad,lat+pad],[lon-pad,lat+pad],[lon-pad,lat-pad]]]
  });

  const headers={'x-openaip-api-key':OAIP_KEY,'Accept':'application/json'};
  const sig=AbortSignal.timeout(12000);

  // Try 1: geometry bbox query
  try{
    const url=`https://api.core.openaip.net/api/airspaces?geometry=${encodeURIComponent(poly)}&limit=300`;
    const r=await fetch(url,{headers,signal:sig});
    if(r.ok){const d=await r.json(); if(d.items?.length>=0) return {ok:true,items:d.items}}
  }catch(_){}

  // Try 2: country query + client bbox filter
  try{
    const sig2=AbortSignal.timeout(15000);
    const url=`https://api.core.openaip.net/api/airspaces?country=IT&limit=500&page=1`;
    const r=await fetch(url,{headers,signal:sig2});
    if(r.ok){
      const d=await r.json();
      const items=(d.items||[]).filter(as=>{
        const c=as.centroid||as.geometry;
        if(!c) return true;
        const coord=c.coordinates||[];
        const [clon,clat]=c.type==='Point'?coord:(coord[0]?.[0]||[0,0]);
        return Math.abs(clat-lat)<1&&Math.abs(clon-lon)<1;
      });
      return {ok:true,items};
    }
  }catch(_){}

  return {ok:false,items:[]};
}

// ── NEARBY AIRPORTS for NOTAM ─────────────────────────────────────────────────
function nearbyAP(lat,lon){
  return AIRPORTS.map(([name,icao,alat,alon])=>({name,icao,d:hav(lat,lon,alat,alon)}))
    .sort((a,b)=>a.d-b.d).slice(0,5);
}

// ── STATE ─────────────────────────────────────────────────────────────────────
let LAT=null,LON=null,ACC=null,lastUp=null;

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(oaipResult){
  const dfUrl='https://www.d-flight.it/web-app';
  const gmUrl=`https://www.google.com/maps?q=${LAT.toFixed(6)},${LON.toFixed(6)}`;

  // Process airspaces
  let inside=[], nearby=[], fetchFailed=false;
  if(!oaipResult){
    // still loading
  } else if(!oaipResult.ok||!oaipResult.items){
    fetchFailed=true;
  } else {
    const items=oaipResult.items.filter(affectsDrone);
    for(const as of items){
      const t=as.type?.value??as.type??0;
      const info=TYPES[t]||{l:'Zona',s:'info'};
      const name=as.name||'Zona senza nome';
      const altLow=fmtAlt(as.lowerLimit||as.lower_limit);
      const altHigh=fmtAlt(as.upperLimit||as.upper_limit);
      const obj={name,typeLabel:info.l,sev:info.s,altLow,altHigh,icaoClass:as.icaoClass?.shortName||as.icaoClass||''};

      // Check if inside polygon
      if(as.geometry&&inGeom(LON,LAT,as.geometry)){
        obj.status='DENTRO';
        inside.push(obj);
      } else {
        // check centroid distance for "nearby"
        const cent=as.centroid;
        if(cent?.type==='Point'){
          const [clon,clat]=cent.coordinates;
          const d=hav(LAT,LON,clat,clon);
          if(d<15){obj.status='VICINO';obj.dist=d;nearby.push(obj);}
        }
      }
    }
    nearby.sort((a,b)=>(a.dist||99)-(b.dist||99));
  }

  // Verdict
  const redInside=inside.filter(z=>z.sev==='red');
  const yelInside=inside.filter(z=>z.sev!=='red'&&z.sev!=='info');
  let cls,ico,verdict,sub;
  if(redInside.length>0){
    cls='red';ico='⛔';verdict='VIETATO';
    sub=`Sei dentro ${redInside.length} zona${redInside.length>1?'e':''} critica${redInside.length>1?'e':''}`;
  } else if(yelInside.length>0||inside.length>0){
    cls='yellow';ico='⚠️';verdict='ATTENZIONE';
    sub=`Sei dentro ${inside.length} zona${inside.length>1?'e':''} con restrizioni`;
  } else if(!oaipResult){
    cls='yellow';ico='⏳';verdict='VERIFICA';sub='Caricamento dati spazio aereo...';
  } else if(fetchFailed){
    cls='yellow';ico='📡';verdict='OFFLINE';sub='Dati aereo non disponibili — verifica manuale';
  } else {
    cls='green';ico='✅';verdict='LIBERO';sub='Nessuna zona critica rilevata in questa posizione';
  }

  // Zones HTML
  const allZones=[...inside,...nearby.slice(0,5)];
  let zonesHtml='';
  if(!oaipResult){
    zonesHtml=`<div class="fetching"><div class="mini-spin"></div><span>Caricamento dati OpenAIP...</span></div>`;
  } else if(fetchFailed){
    zonesHtml=`<div class="empty"><div class="eico">📡</div><p>Servizio OpenAIP non raggiungibile.<br>Controlla la connessione.</p></div>`;
  } else if(allZones.length===0){
    zonesHtml=`<div class="empty"><div class="eico">🌿</div><p>Nessuna zona aeronautica rilevata<br>in questa posizione (raggio ~55 km).</p></div>`;
  } else {
    const cls2z={red:'zi',yellow:'zy',info:'zb'};
    zonesHtml=`<div class="zlist">${allZones.map(z=>`
      <div class="zitem ${cls2z[z.sev]||'zb'}">
        <div class="zdot"></div>
        <div class="zinfo">
          <div class="zname">${esc(z.name)}</div>
          <div class="ztype">${esc(z.typeLabel)}${z.icaoClass?' · Classe '+esc(z.icaoClass):''}</div>
          ${(z.altLow||z.altHigh)?`<div class="zalt">${z.altLow||'?'} → ${z.altHigh||'?'}</div>`:''}
        </div>
        <div class="zright">
          <span class="zbadge">${esc(z.status)}${z.dist?' '+fmtD(z.dist):''}</span>
        </div>
      </div>`).join('')}</div>`;
  }

  // NOTAM section
  const aps=nearbyAP(LAT,LON);
  const icaoStr=aps.map(a=>a.icao).join(',');
  const faaUrl=`https://notams.aim.faa.gov/notamSearch/?searchType=0&designatorsForLocation=${icaoStr}`;
  const notamHtml=`
    <div class="notam-box">
      <p>I NOTAM non sono disponibili in-app (nessuna API pubblica CORS-compatible per EU). Tocca sotto per controllare i NOTAM degli aeroporti più vicini su FAA/ICAO — pubblico, nessun login.</p>
      <div class="notam-airports">${aps.map(a=>`
        <div class="notam-ap">
          <span class="notam-icao">${esc(a.icao)}</span>
          <span class="notam-name">${esc(a.name)}</span>
          <span class="notam-dist">${fmtD(a.d)}</span>
        </div>`).join('')}
      </div>
      <a href="${faaUrl}" target="_blank" class="btn bfull" style="text-decoration:none">
        <span class="ico">📋</span>&nbsp;Controlla NOTAM (${aps.length} aeroporti)
      </a>
    </div>`;

  const ubar=!oaipResult
    ?`<span>Caricamento...</span>`
    :oaipResult.ok
      ?`<span class="ufresh">● OpenAIP LIVE</span>&nbsp; ${lastUp?lastUp.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})+' UTC':''}`
      :`<span class="umanual">⚠ Offline — dati non aggiornati</span>`;

  document.getElementById('mc').innerHTML=`
    <div class="status-card ${cls} fi">
      <div class="slabel">// STATO VOLO — POSIZIONE CORRENTE</div>
      <div class="smain">
        <div class="sball${cls==='green'?' pulse':''}">${ico}</div>
        <div>
          <div class="sverdict">${verdict}</div>
          <div class="ssub">${sub}</div>
        </div>
      </div>
      <div class="gps-row">
        <div class="gps-dot on"></div>
        <div class="gps-val">${LAT.toFixed(5)}, ${LON.toFixed(5)}</div>
        <div class="acc">±${ACC<10000?Math.round(ACC):'>1k'}m</div>
      </div>
    </div>

    <div class="ubar">${ubar}</div>

    <div class="stitle">Zone aeree${oaipResult?.ok?' — '+allZones.length+' rilevate':''}</div>
    ${zonesHtml}

    <div class="stitle">NOTAM</div>
    ${notamHtml}

    <div class="disc">
      <div style="font-size:14px;flex-shrink:0;margin-top:1px">⚠️</div>
      <p>Dati spazio aereo da OpenAIP (aggiornati mensilmente). Possono mancare zone temporanee o militari classificate. Verifica sempre su D-Flight prima di volare.</p>
    </div>

    <div class="stitle">Azioni rapide</div>
    <div class="bgrid">
      <a href="${dfUrl}" target="_blank" class="btn bblu"><span class="ico">🛫</span>D-Flight</a>
      <a href="${gmUrl}" target="_blank" class="btn"><span class="ico">📍</span>Maps</a>
      <button class="btn" id="cpbtn" onclick="copyC()"><span class="ico">📋</span>Copia GPS</button>
      <button class="btn" onclick="startGPS()"><span class="ico">🔄</span>Aggiorna</button>
    </div>
    <div class="footnote">MAX 120m AGL · ENAC UAS-IT · Verificare sempre su D-Flight</div>
  `;
}

function copyC(){
  if(!LAT) return;
  navigator.clipboard.writeText(`${LAT.toFixed(6)}, ${LON.toFixed(6)}`).then(()=>{
    const b=document.getElementById('cpbtn');
    if(b){const o=b.innerHTML;b.innerHTML='<span class="ico">✅</span>Copiato!';setTimeout(()=>{if(b)b.innerHTML=o;},1500);}
  });
}

// ── ENTRY ─────────────────────────────────────────────────────────────────────
async function startGPS(){
  document.getElementById('mc').innerHTML=`
    <div class="loading"><div class="spinner"></div><p>Rilevamento GPS...</p><p class="sub">Assicurati di avere il GPS attivo</p></div>`;

  if(!navigator.geolocation){
    document.getElementById('mc').innerHTML=`
      <div class="errc"><h3>GPS non supportato</h3><p>Usa un browser con supporto geolocalizzazione.</p></div>
      <div class="bgrid"><a href="https://www.d-flight.it/web-app" target="_blank" class="btn bblu"><span class="ico">🛫</span>D-Flight</a></div>`;
    return;
  }

  navigator.geolocation.getCurrentPosition(
    async pos=>{
      LAT=pos.coords.latitude; LON=pos.coords.longitude; ACC=pos.coords.accuracy;
      render(null);  // show immediately while fetching
      const data=await fetchAirspaces(LAT,LON);
      lastUp=new Date();
      render(data);
    },
    err=>{
      let msg='Impossibile ottenere la posizione.';
      if(err.code===1) msg='Accesso GPS negato. Abilitalo nelle impostazioni del browser.';
      if(err.code===3) msg='Timeout GPS. Vai all\'aperto e riprova.';
      document.getElementById('mc').innerHTML=`
        <div class="errc"><h3>GPS non disponibile</h3><p>${msg}</p></div>
        <div class="bgrid">
          <a href="https://www.d-flight.it/web-app" target="_blank" class="btn bblu"><span class="ico">🛫</span>D-Flight</a>
          <button class="btn" onclick="startGPS()"><span class="ico">🔄</span>Riprova</button>
        </div>`;
    },
    {enableHighAccuracy:true,timeout:12000,maximumAge:0}
  );
}

startGPS();
</script>
</body>
</html>
