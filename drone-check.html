<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DroneCheck Italia</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;400;600;700;900&display=swap');

  :root {
    --bg: #070a0e;
    --surface: #0d1117;
    --surface2: #111620;
    --border: #1c2333;
    --green: #00e87a;
    --green-dim: #00e87a18;
    --yellow: #ffcc00;
    --yellow-dim: #ffcc0018;
    --red: #ff3355;
    --red-dim: #ff335518;
    --blue: #4d9fff;
    --blue-dim: #4d9fff18;
    --text: #c8d6e8;
    --muted: #4a5568;
    --mono: 'Share Tech Mono', monospace;
    --sans: 'Barlow Condensed', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(77,159,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(77,159,255,0.025) 1px, transparent 1px);
    background-size: 36px 36px;
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    padding: 18px 14px 50px;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  .header-left { flex: 1; }
  .logo { font-family: var(--mono); font-size: 10px; color: var(--blue); letter-spacing: 0.15em; opacity: 0.7; margin-bottom: 2px; }
  .header-title { font-size: 24px; font-weight: 900; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1; }
  .header-title small { display: block; font-size: 10px; font-weight: 400; letter-spacing: 0.22em; color: var(--muted); margin-top: 3px; }
  .header-drone { font-size: 30px; }

  .status-card {
    border-radius: 14px;
    padding: 22px 18px;
    margin-bottom: 14px;
    border: 1px solid var(--border);
    background: var(--surface);
    position: relative;
    overflow: hidden;
    transition: border-color 0.4s, background 0.4s;
  }
  .status-card.green  { border-color: var(--green);  background: linear-gradient(135deg, #0d1117 60%, #00e87a08); }
  .status-card.yellow { border-color: var(--yellow); background: linear-gradient(135deg, #0d1117 60%, #ffcc0008); }
  .status-card.red    { border-color: var(--red);    background: linear-gradient(135deg, #0d1117 60%, #ff335508); }

  .status-label { font-family: var(--mono); font-size: 9px; letter-spacing: 0.22em; color: var(--muted); margin-bottom: 10px; }
  .status-main { display: flex; align-items: center; gap: 16px; }

  .status-indicator {
    width: 60px; height: 60px;
    border-radius: 50%;
    border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; flex-shrink: 0;
    position: relative; transition: border-color 0.4s;
  }
  .green  .status-indicator { border-color: var(--green); }
  .yellow .status-indicator { border-color: var(--yellow); }
  .red    .status-indicator { border-color: var(--red); }

  .status-indicator.pulse::after {
    content: ''; position: absolute; inset: -6px;
    border-radius: 50%; border: 2px solid currentColor;
    animation: pulse-ring 2s infinite;
  }
  .green  .status-indicator.pulse { color: var(--green); }
  .yellow .status-indicator.pulse { color: var(--yellow); }
  .red    .status-indicator.pulse { color: var(--red); }
  @keyframes pulse-ring { 0%{transform:scale(0.9);opacity:0.9} 100%{transform:scale(1.5);opacity:0} }

  .status-text { flex: 1; }
  .status-verdict { font-size: 34px; font-weight: 900; text-transform: uppercase; line-height: 1; transition: color 0.4s; }
  .green  .status-verdict { color: var(--green); }
  .yellow .status-verdict { color: var(--yellow); }
  .red    .status-verdict { color: var(--red); }
  .status-sub { font-size: 13px; color: var(--text); margin-top: 4px; opacity: 0.75; line-height: 1.35; }

  .gps-row {
    display: flex; align-items: center; gap: 8px;
    margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border);
    font-family: var(--mono); font-size: 11px; color: var(--muted);
  }
  .gps-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .gps-dot.active { background: var(--green); animation: blink 2s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .gps-coords { color: var(--text); flex: 1; font-size: 12px; }
  .acc-badge {
    font-family: var(--mono); font-size: 10px; color: var(--muted);
    background: rgba(255,255,255,0.03); border: 1px solid var(--border);
    border-radius: 5px; padding: 2px 6px;
  }

  .section-title {
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.22em;
    color: var(--muted); text-transform: uppercase;
    margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
  }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .zones-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .zone-item {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 11px 13px;
    display: flex; align-items: center; gap: 11px;
  }
  .zone-item.red-zone   { border-color: rgba(255,51,85,0.35);  background: rgba(255,51,85,0.04); }
  .zone-item.yellow-zone{ border-color: rgba(255,204,0,0.3);   background: rgba(255,204,0,0.04); }
  .zone-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .red-zone    .zone-dot { background: var(--red); }
  .yellow-zone .zone-dot { background: var(--yellow); }
  .zone-info { flex: 1; }
  .zone-name { font-size: 14px; font-weight: 700; line-height: 1.2; }
  .zone-type { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .zone-dist { font-family: var(--mono); font-size: 13px; text-align: right; flex-shrink: 0; }
  .red-zone    .zone-dist { color: var(--red); }
  .yellow-zone .zone-dist { color: var(--yellow); }

  .notam-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .notam-item {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 13px; cursor: pointer;
    touch-action: manipulation; user-select: none;
  }
  .notam-item.n-active   { border-color: rgba(255,51,85,0.4);  background: rgba(255,51,85,0.05); }
  .notam-item.n-upcoming { border-color: rgba(255,204,0,0.3);  background: rgba(255,204,0,0.04); }
  .notam-item.n-info     { border-color: rgba(77,159,255,0.25); }

  .notam-header { display: flex; align-items: flex-start; gap: 9px; }
  .notam-badge {
    font-family: var(--mono); font-size: 10px; font-weight: bold;
    padding: 2px 7px; border-radius: 4px; flex-shrink: 0; margin-top: 1px;
  }
  .n-active   .notam-badge { background: rgba(255,51,85,0.2);  color: var(--red); }
  .n-upcoming .notam-badge { background: rgba(255,204,0,0.2);  color: var(--yellow); }
  .n-info     .notam-badge { background: rgba(77,159,255,0.15);color: var(--blue); }

  .notam-id  { font-family: var(--mono); font-size: 11px; color: var(--blue); flex: 1; word-break: break-all; }
  .notam-loc { font-family: var(--mono); font-size: 11px; color: var(--muted); flex-shrink: 0; }
  .notam-summary { font-size: 13px; color: var(--text); margin-top: 6px; line-height: 1.45; opacity: 0.85; }
  .notam-time { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 6px; }
  .notam-full {
    display: none; margin-top: 10px; padding-top: 10px;
    border-top: 1px solid var(--border);
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    line-height: 1.6; word-break: break-all; white-space: pre-wrap;
  }
  .notam-item.expanded .notam-full { display: block; }

  .empty-box {
    text-align: center; padding: 20px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; margin-bottom: 14px;
  }
  .empty-box .ico { font-size: 28px; margin-bottom: 6px; }
  .empty-box p { font-size: 12px; color: var(--muted); line-height: 1.5; }

  .loading { text-align: center; padding: 50px 20px; }
  .spinner { width: 44px; height: 44px; border: 3px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading p { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .loading .sub { font-size: 11px; opacity: 0.6; margin-top: 4px; }

  .notam-loading {
    display: flex; align-items: center; gap: 10px;
    padding: 14px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; margin-bottom: 14px;
  }
  .mini-spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.6s linear infinite; flex-shrink: 0; }
  .notam-loading span { font-family: var(--mono); font-size: 11px; color: var(--muted); }

  .disclaimer {
    background: rgba(255,204,0,0.04); border: 1px solid rgba(255,204,0,0.18);
    border-radius: 10px; padding: 11px 13px; margin-bottom: 14px;
    display: flex; gap: 9px; align-items: flex-start;
  }
  .disclaimer-ico { font-size: 14px; flex-shrink: 0; margin-top: 1px; }
  .disclaimer p { font-size: 11px; line-height: 1.5; color: rgba(255,204,0,0.75); }

  .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 9px; }
  .btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    border-radius: 11px; padding: 13px 10px;
    font-family: var(--sans); font-size: 13px; font-weight: 700;
    letter-spacing: 0.04em; text-transform: uppercase;
    cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px;
    transition: transform 0.1s, opacity 0.1s; text-decoration: none;
    touch-action: manipulation; user-select: none;
  }
  .btn:active { transform: scale(0.95); opacity: 0.75; }
  .btn .ico { font-size: 22px; }
  .btn.blue-btn { border-color: rgba(77,159,255,0.5); background: var(--blue-dim); color: var(--blue); }
  .btn-full {
    grid-column: 1 / -1; flex-direction: row; justify-content: center;
    padding: 15px; font-size: 14px; gap: 8px;
    border-color: rgba(77,159,255,0.4); background: var(--blue-dim); color: var(--blue);
  }

  .update-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 13px; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; margin-bottom: 14px;
    font-family: var(--mono); font-size: 10px; color: var(--muted);
  }
  .update-bar .fresh { color: var(--green); }

  .err-card {
    background: var(--surface); border: 1px solid rgba(255,51,85,0.35);
    border-radius: 14px; padding: 28px 18px; text-align: center; margin-bottom: 14px;
  }
  .err-card .ico { font-size: 38px; margin-bottom: 10px; }
  .err-card h3 { font-size: 18px; font-weight: 800; color: var(--red); margin-bottom: 8px; }
  .err-card p { font-size: 13px; color: var(--muted); line-height: 1.5; }

  .altitude-note { font-size: 10px; color: var(--muted); font-family: var(--mono); text-align: center; margin-top: 10px; opacity: 0.5; }

  @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
  .fade-in { animation: fadeIn 0.3s ease forwards; }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="header-left">
      <div class="logo">ENAC / D-FLIGHT // NOTAM LIVE</div>
      <div class="header-title">
        DroneCheck
        <small>ITALIA — REAL-TIME AIRSPACE</small>
      </div>
    </div>
    <div class="header-drone">🛸</div>
  </div>

  <div id="main-content">
    <div class="loading">
      <div class="spinner"></div>
      <p>Rilevamento GPS...</p>
      <p class="sub">Assicurati di avere il GPS attivo</p>
    </div>
  </div>

</div>

<script>
// ── AIRPORT DATABASE ──────────────────────────────────────────────────────────
// [name, ICAO, lat, lon, red_km, yellow_km, type]
const AIRPORTS = [
  ["Milano Malpensa",           "LIMC", 45.6306,  8.7281,  5, 10, "Aeroporto Internazionale"],
  ["Milano Linate",             "LIML", 45.4454,  9.2797,  5, 10, "Aeroporto Internazionale"],
  ["Milano Bresso",             "LIMB", 45.5422,  9.2025,  3,  6, "Aviosuperficie"],
  ["Torino Caselle",            "LIMF", 45.2008,  7.6497,  5, 10, "Aeroporto Internazionale"],
  ["Genova",                    "LIMJ", 44.4133,  8.8375,  5,  9, "Aeroporto"],
  ["Lugano (CH)",               "LSZA", 45.9728,  8.9106,  4,  8, "Aeroporto (Svizzera)"],
  ["Bergamo Orio al Serio",     "LIME", 45.6739,  9.7042,  5, 10, "Aeroporto Internazionale"],
  ["Brescia Montichiari",       "LIPO", 45.4289, 10.3306,  4,  8, "Aeroporto"],
  ["Verona Villafranca",        "LIPX", 45.3957, 10.8886,  5, 10, "Aeroporto Internazionale"],
  ["Venezia Marco Polo",        "LIPZ", 45.5053, 12.3519,  5, 10, "Aeroporto Internazionale"],
  ["Treviso",                   "LIPH", 45.6484, 12.1944,  4,  8, "Aeroporto"],
  ["Trieste",                   "LIPQ", 45.8275, 13.4722,  4,  8, "Aeroporto"],
  ["Bolzano",                   "LIPB", 46.4602, 11.3264,  3,  7, "Aeroporto"],
  ["Bologna Marconi",           "LIPE", 44.5354, 11.2887,  5, 10, "Aeroporto Internazionale"],
  ["Firenze Vespucci",          "LIRQ", 43.8100, 11.2051,  5,  9, "Aeroporto"],
  ["Pisa Galileo Galilei",      "LIRP", 43.6839, 10.3927,  5, 10, "Aeroporto Internazionale"],
  ["Ancona",                    "LIPY", 43.6161, 13.3622,  4,  8, "Aeroporto"],
  ["Perugia",                   "LIRZ", 43.1059, 12.5132,  3,  7, "Aeroporto"],
  ["Roma Fiumicino",            "LIRF", 41.7999, 12.2462,  6, 12, "Aeroporto Internazionale"],
  ["Roma Ciampino",             "LIRA", 41.7994, 12.5949,  5, 10, "Aeroporto"],
  ["Napoli Capodichino",        "LIRN", 40.8860, 14.2908,  5, 10, "Aeroporto Internazionale"],
  ["Bari Karol Wojtyla",        "LIBD", 41.1389, 16.7606,  5,  9, "Aeroporto Internazionale"],
  ["Brindisi",                  "LIBR", 40.6576, 17.9469,  4,  8, "Aeroporto"],
  ["Lamezia Terme",             "LICA", 38.9054, 16.2422,  4,  8, "Aeroporto"],
  ["Reggio Calabria",           "LICR", 38.0712, 15.6516,  3,  7, "Aeroporto"],
  ["Palermo Falcone Borsellino","LICJ", 38.1760, 13.0910,  5,  9, "Aeroporto Internazionale"],
  ["Catania Fontanarossa",      "LICC", 37.4668, 15.0664,  5,  9, "Aeroporto Internazionale"],
  ["Trapani",                   "LICT", 37.9113, 12.4881,  4,  8, "Aeroporto"],
  ["Cagliari Elmas",            "LIEE", 39.2515,  9.0543,  5,  9, "Aeroporto Internazionale"],
  ["Olbia Costa Smeralda",      "LIEO", 40.8987,  9.5177,  4,  8, "Aeroporto"],
  ["Alghero",                   "LIEA", 40.6321,  8.2908,  4,  8, "Aeroporto"],
  // Zone speciali (no ICAO query)
  ["Vaticano",                  null,   41.9022, 12.4539,  3,  5, "Zona vietata permanente"],
  ["Area TMA Roma",             null,   41.9028, 12.4964,  0, 25, "Spazio aereo controllato"],
];

// ── UTILS ─────────────────────────────────────────────────────────────────────
function haversine(la1,lo1,la2,lo2){
  const R=6371,dL=(la2-la1)*Math.PI/180,dO=(lo2-lo1)*Math.PI/180;
  const a=Math.sin(dL/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dO/2)**2;
  return R*2*Math.asin(Math.sqrt(a));
}
function fmtDist(d){ return d<1?(d*1000).toFixed(0)+'m':d.toFixed(1)+'km'; }
function fmtTime(d){
  if(!d) return '—';
  return d.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'2-digit'})+' '+
         d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})+' UTC';
}
function esc(s){ return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):''; }

// ── ZONE CHECK ────────────────────────────────────────────────────────────────
function checkZones(lat,lon){
  return AIRPORTS.map(([name,icao,alat,alon,rr,ry,type])=>{
    const d=haversine(lat,lon,alat,alon);
    if(d>ry) return null;
    return {name,icao,d,sev:d<=rr?'red':'yellow',type};
  }).filter(Boolean).sort((a,b)=>a.d-b.d);
}

// ── NEARBY ICAO ──────────────────────────────────────────────────────────────
function getNearbyIcao(lat,lon){
  return AIRPORTS
    .filter(([,icao,,alat,alon])=>icao&&haversine(lat,lon,alat,alon)<=120)
    .map(([name,icao,,alat,alon])=>({name,icao,d:haversine(lat,lon,alat,alon)}))
    .sort((a,b)=>a.d-b.d)
    .slice(0,6);
}

// ── NOTAM FETCH ──────────────────────────────────────────────────────────────
// aviationweather.gov blocca proxy con 403.
// Tentativo diretto: funziona se il browser gestisce CORS.
// Fallback: restituiamo ICAO vicini per link diretto FAA NOTAM (pubblico, no login).
async function fetchNotams(lat,lon){
  const pad=0.8;
  const w=(lon-pad).toFixed(3), s=(lat-pad).toFixed(3);
  const e=(lon+pad).toFixed(3), n=(lat+pad).toFixed(3);
  const url=`https://aviationweather.gov/api/data/notam?format=json&bbox=${w},${s},${e},${n}&limit=100`;
  try{
    const r=await fetch(url,{signal:AbortSignal.timeout(8000),headers:{'Accept':'application/json'}});
    if(r.ok){
      const data=await r.json();
      if(Array.isArray(data)) return {ok:true, data};
    }
  }catch(_){}
  return {ok:false, nearby:getNearbyIcao(lat,lon)};
}

// ── NOTAM PARSE ──────────────────────────────────────────────────────────────
function parseNotams(arr){
  if(!Array.isArray(arr)) return [];
  const now=Date.now();
  return arr.map(n=>{
    const id   = n.notamID||n.id||'?';
    const icao = n.icaoLocation||n.location||'';
    const text = n.traditionalMessage||n.text||n.message||'';
    let start=null,end=null,isActive=false,isUpcoming=false;
    try{
      if(n.startTime) start=new Date(n.startTime);
      if(n.endTime)   end  =new Date(n.endTime);
      if(start&&end){ isActive=start<=now&&end>=now; isUpcoming=start>now&&start<now+86400000*3; }
      else { isActive=true; }
    }catch(_){}
    const up=text.toUpperCase();
    const isHigh=/UAS|DRONE|UAV|RPAS|VIETATO|PROHIBITED|RESTRICTED|DANGER|TFR|\bD\d|\bR\d|\bP\d/.test(up);
    const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length>5);
    const summary=lines.slice(0,2).join(' ').substring(0,130)+(text.length>130?'\u2026':'');
    return {id,icao,text,summary,start,end,isActive,isUpcoming,isHigh};
  })
  .filter(n=>n.isActive||n.isUpcoming)
  .sort((a,b)=>{
    if(a.isActive!==b.isActive) return a.isActive?-1:1;
    if(a.isHigh!==b.isHigh) return a.isHigh?-1:1;
    return 0;
  });
}

// ── STATE ─────────────────────────────────────────────────────────────────────
let curLat=null,curLon=null,curAcc=null,lastUpdate=null;

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(notamRaw){
  const zones=checkZones(curLat,curLon);
  const redZ=zones.filter(z=>z.sev==='red');
  const yelZ=zones.filter(z=>z.sev==='yellow');
  // Parse NOTAM result (new format: {ok, data} or {ok:false, nearby})
  let notamList=[], notamOk=false, notamNearby=[];
  if(notamRaw){
    if(notamRaw.ok && notamRaw.data){ notamList=parseNotams(notamRaw.data); notamOk=true; }
    else if(!notamRaw.ok && notamRaw.nearby){ notamNearby=notamRaw.nearby; }
  }
  const activeHigh=notamList.filter(n=>n.isActive&&n.isHigh);

  let stClass,stIco,verdict,sub;
  if(redZ.length>0||activeHigh.length>0){
    stClass='red';stIco='⛔';verdict='VIETATO';
    const r=[];
    if(redZ.length) r.push(redZ.length+' zona CTR');
    if(activeHigh.length) r.push(activeHigh.length+' NOTAM critico');
    sub=r.join(' + ')+' rilevat'+(r.length>1||redZ.length+activeHigh.length>1?'i':'o');
  } else if(yelZ.length||notamList.filter(n=>n.isActive).length){
    stClass='yellow';stIco='⚠️';verdict='ATTENZIONE';
    sub='Verifica necessaria: zone o NOTAM attivi vicino a te';
  } else if(!notamRaw){
    stClass='yellow';stIco='⏳';verdict='VERIFICA';
    sub='Zone aeree OK — NOTAM in caricamento...';
  } else {
    stClass='green';stIco='✅';verdict='LIBERO';
    sub='Nessuna restrizione rilevata'+(notamOk?'':' — verifica NOTAM manuale consigliata');
  }

  const dfUrl='https://www.d-flight.it/web-app';
  const amUrl=`https://map.airmap.com/?lat=${curLat.toFixed(5)}&lng=${curLon.toFixed(5)}&zoom=13`;
  const gmUrl=`https://www.google.com/maps?q=${curLat.toFixed(6)},${curLon.toFixed(6)}`;

  // Zones
  const zonesHtml=zones.length===0
    ?`<div class="empty-box"><div class="ico">🌿</div><p>Nessun aeroporto nel raggio di 10 km.</p></div>`
    :`<div class="zones-list">${zones.map(z=>`
        <div class="zone-item ${z.sev}-zone">
          <div class="zone-dot"></div>
          <div class="zone-info">
            <div class="zone-name">${esc(z.name)}${z.icao?` <span style="font-family:var(--mono);font-size:10px;color:var(--muted)">${z.icao}</span>`:''}</div>
            <div class="zone-type">${esc(z.type)}</div>
          </div>
          <div class="zone-dist">${fmtDist(z.d)}</div>
        </div>`).join('')}
      </div>`;

  // NOTAMs HTML
  let notamsHtml='';
  if(!notamRaw){
    notamsHtml=`<div class="notam-loading"><div class="mini-spinner"></div><span>Recupero NOTAM live in corso...</span></div>`;
  } else if(notamOk && notamList.length===0){
    notamsHtml=`<div class="empty-box"><div class="ico">📭</div><p>Nessun NOTAM attivo nel raggio ~80 km.<br><span style="font-size:10px;opacity:0.6">${lastUpdate?'Aggiornato: '+fmtTime(lastUpdate):''}</span></p></div>`;
  } else if(notamOk && notamList.length>0){
    notamsHtml=`<div class="notam-list">${notamList.map(n=>{
      const cls=n.isHigh&&n.isActive?'n-active':n.isUpcoming?'n-upcoming':'n-info';
      const badge=n.isHigh&&n.isActive?'CRITICO':n.isUpcoming?'FUTURO':'INFO';
      return `<div class="notam-item ${cls}" onclick="this.classList.toggle('expanded')">
        <div class="notam-header">
          <div class="notam-badge">${badge}</div>
          <div class="notam-id">${esc(n.id)}</div>
          <div class="notam-loc">${esc(n.icao)}</div>
        </div>
        <div class="notam-summary">${esc(n.summary)}</div>
        ${n.start?`<div class="notam-time">▶ ${fmtTime(n.start)}${n.end?' — '+fmtTime(n.end):''}</div>`:''}
        <div class="notam-full">${esc(n.text)}</div>
      </div>`;
    }).join('')}</div>`;
  } else {
    // Fallback: CORS bloccato — link diretto FAA NOTAM con ICAO vicini
    const icaoStr=notamNearby.map(a=>a.icao).join(',');
    const faaUrl=`https://notams.aim.faa.gov/notamSearch/?searchType=0&designatorsForLocation=${icaoStr}`;
    const icaoList=notamNearby.map(a=>`
      <div class="zone-item" style="border-color:rgba(77,159,255,0.25)">
        <div style="font-family:var(--mono);font-size:13px;color:var(--blue);min-width:44px">${esc(a.icao)}</div>
        <div class="zone-info"><div class="zone-name">${esc(a.name)}</div></div>
        <div class="zone-dist" style="color:var(--muted)">${fmtDist(a.d)}</div>
      </div>`).join('');
    notamsHtml=`
      <div class="disclaimer" style="border-color:rgba(77,159,255,0.3);background:rgba(77,159,255,0.04)">
        <div class="disclaimer-ico">ℹ️</div>
        <p style="color:rgba(77,159,255,0.85)">NOTAM auto-fetch non disponibile su questa rete (blocco CORS). Tocca il bottone per controllare i NOTAM degli aeroporti vicini in un click — fonte FAA/ICAO pubblica, nessun login.</p>
      </div>
      <div class="zones-list" style="margin-bottom:10px">${icaoList}</div>
      <a href="${faaUrl}" target="_blank" class="btn btn-full blue-btn" style="margin-bottom:8px">
        <span class="ico">📋</span>&nbsp; Controlla NOTAM (${notamNearby.length} aeroporti)
      </a>`;
  }

  const updateBar=!notamRaw
    ?`<span>Caricamento NOTAM...</span>`
    :notamOk
      ?`<span class="fresh">● LIVE</span>&nbsp; aggiornato ${fmtTime(lastUpdate)}`
      :`<span style="color:var(--yellow)">⚠ NOTAM manuale richiesto</span>`;

  document.getElementById('main-content').innerHTML=`
    <div class="status-card ${stClass} fade-in">
      <div class="status-label">// STATO VOLO — POSIZIONE CORRENTE</div>
      <div class="status-main">
        <div class="status-indicator${stClass==='green'?' pulse':''}">${stIco}</div>
        <div class="status-text">
          <div class="status-verdict">${verdict}</div>
          <div class="status-sub">${sub}</div>
        </div>
      </div>
      <div class="gps-row">
        <div class="gps-dot active"></div>
        <div class="gps-coords">${curLat.toFixed(5)}, ${curLon.toFixed(5)}</div>
        <div class="acc-badge">±${curAcc<10000?Math.round(curAcc):'>1k'}m</div>
      </div>
    </div>

    <div class="update-bar">${updateBar}</div>

    <div class="section-title">Zone aeree — ${zones.length} trovate</div>
    ${zonesHtml}

    <div class="section-title">NOTAM${notamOk?' live — '+notamList.length+' nel raggio':' — verifica manuale'}</div>
    ${notamsHtml}

    <div class="disclaimer">
      <div class="disclaimer-ico">⚠️</div>
      <p>NOTAM in tempo reale da fonte ICAO/FAA. Tocca ogni NOTAM per il testo completo. Possono mancare zone militari classificate. Verifica sempre su D-Flight prima di volare.</p>
    </div>

    <div class="section-title">Azioni rapide</div>
    <div class="btn-grid">
      <a href="${dfUrl}" target="_blank" class="btn blue-btn"><span class="ico">🛫</span>D-Flight</a>
      <a href="${amUrl}" target="_blank" class="btn blue-btn"><span class="ico">🗺️</span>AirMap</a>
      <a href="${gmUrl}" target="_blank" class="btn"><span class="ico">📍</span>Maps</a>
      <button class="btn" id="copy-btn" onclick="copyCoords()"><span class="ico">📋</span>Copia GPS</button>
    </div>
    <button class="btn btn-full" onclick="startGPS()"><span class="ico">🔄</span>&nbsp; Aggiorna tutto</button>
    <div class="altitude-note">MAX 120m AGL — Regole ENAC UAS · Verificare sempre su D-Flight</div>
  `;
}

function copyCoords(){
  if(!curLat) return;
  navigator.clipboard.writeText(`${curLat.toFixed(6)}, ${curLon.toFixed(6)}`).then(()=>{
    const b=document.getElementById('copy-btn');
    if(b){const o=b.innerHTML;b.innerHTML='<span class="ico">✅</span>Copiato!';setTimeout(()=>{if(b)b.innerHTML=o;},1500);}
  });
}

// ── ENTRY POINT ───────────────────────────────────────────────────────────────
async function startGPS(){
  document.getElementById('main-content').innerHTML=`
    <div class="loading">
      <div class="spinner"></div>
      <p>Rilevamento GPS...</p>
      <p class="sub">Assicurati di avere il GPS attivo</p>
    </div>`;

  if(!navigator.geolocation){
    document.getElementById('main-content').innerHTML=`
      <div class="err-card"><div class="ico">📡</div><h3>GPS non supportato</h3><p>Usa un browser con supporto geolocalizzazione.</p></div>
      <div class="btn-grid"><a href="https://www.d-flight.it/web-app" target="_blank" class="btn blue-btn"><span class="ico">🛫</span>D-Flight</a></div>`;
    return;
  }

  navigator.geolocation.getCurrentPosition(
    async pos=>{
      curLat=pos.coords.latitude;
      curLon=pos.coords.longitude;
      curAcc=pos.coords.accuracy;
      render(null);                          // mostra zone subito
      const raw=await fetchNotams(curLat,curLon);
      lastUpdate=new Date();
      render(raw);                           // aggiorna con NOTAM
    },
    err=>{
      let msg='Impossibile ottenere la posizione.';
      if(err.code===1) msg='Accesso al GPS negato. Abilita la posizione nel browser.';
      if(err.code===3) msg='Timeout GPS. Vai all\'aperto e riprova.';
      document.getElementById('main-content').innerHTML=`
        <div class="err-card"><div class="ico">📡</div><h3>GPS non disponibile</h3><p>${msg}</p></div>
        <div class="btn-grid">
          <a href="https://www.d-flight.it/web-app" target="_blank" class="btn blue-btn"><span class="ico">🛫</span>D-Flight</a>
          <button class="btn" onclick="startGPS()"><span class="ico">🔄</span>Riprova</button>
        </div>`;
    },
    {enableHighAccuracy:true,timeout:12000,maximumAge:0}
  );
}

startGPS();
</script>
</body>
</html>
