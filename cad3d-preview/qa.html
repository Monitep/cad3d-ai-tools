<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Verifica responsive CAD3D</title><style>*{box-sizing:border-box}body{margin:0;background:#dfe5e5;font:14px system-ui;color:#203a43}header{display:flex;gap:20px;align-items:center;padding:18px 24px;background:white;flex-wrap:wrap}label{display:flex;gap:10px;align-items:center}select{font:inherit;padding:8px;border:1px solid #8fa4a8;border-radius:4px}main{padding:30px;display:flex;justify-content:center;overflow:auto}iframe{border:0;background:white;box-shadow:0 8px 45px #203a4325;border-radius:9px;flex-shrink:0}p{margin:0}</style></head><body><header><strong>Verifica responsive</strong><label>Larghezza<select id="width"><option value="360">360 px</option><option value="412" selected>412 px</option><option value="768">768 px</option><option value="1280">1280 px</option></select></label><label>Pagina<select id="page"><option value="index.html">Home</option><option value="progetti.html">Portfolio</option><option value="servizi.html">Servizi</option><option value="architettura.html">Architettura</option><option value="rinnovabili.html">Rinnovabili</option><option value="tour-virtuali.html">Tour virtuali</option><option value="studio.html">Studio</option><option value="contatti.html">Contatti</option><option value="en/index.html">English home</option><option value="en/contatti.html">English contact</option></select></label><p>Vista alla larghezza CSS indicata.</p></header><main><iframe title="Anteprima responsive" src="index.html" width="412" height="892"></iframe></main><script>const frame=document.querySelector('iframe');const width=document.querySelector('#width');const page=document.querySelector('#page');width.addEventListener('change',()=>frame.width=width.value);page.addEventListener('change',()=>frame.src=page.value);</script></body></html>
