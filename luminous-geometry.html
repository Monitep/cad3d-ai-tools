<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luminous Geometry - Surface Dots</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #0a0e27;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
        }

        canvas {
            flex: 1;
            background: linear-gradient(135deg, #0a0e27 0%, #16213e 100%);
            touch-action: manipulation;
            display: block;
            width: 100%;
            height: 100%;
        }

        .controls {
            background: rgba(20, 30, 60, 0.95);
            border-top: 2px solid #00d4ff;
            padding: 12px 15px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            box-shadow: 0 -4px 20px rgba(0, 212, 255, 0.1);
            font-size: 13px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .control-group label {
            color: #00d4ff;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select, input[type="color"], input[type="range"], button {
            padding: 8px;
            border: 1px solid #00d4ff;
            background: rgba(0, 212, 255, 0.1);
            color: #00ff99;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        select:focus, input:focus {
            outline: none;
            background: rgba(0, 212, 255, 0.2);
            box-shadow: 0 0 8px rgba(0, 212, 255, 0.4);
        }

        button {
            background: linear-gradient(135deg, #00d4ff 0%, #00ff99 100%);
            color: #0a0e27;
            font-weight: bold;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 11px;
        }

        button:active {
            transform: scale(0.95);
        }

        .slider-container {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .slider-container input[type="range"] {
            flex: 1;
            padding: 5px;
        }

        .value-badge {
            background: rgba(0, 255, 153, 0.2);
            border: 1px solid #00ff99;
            padding: 4px 8px;
            border-radius: 3px;
            font-weight: bold;
            color: #00ff99;
            min-width: 35px;
            text-align: center;
            font-size: 11px;
        }

        input[type="color"] {
            width: 100%;
            height: 35px;
            border: 1px solid #00d4ff;
            border-radius: 3px;
            cursor: pointer;
        }

        .info {
            color: #666;
            font-size: 10px;
            margin-top: 2px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="controls">
        <div class="control-group">
            <label>Shape</label>
            <select id="shapeSelect">
                <option value="cube">Cube</option>
                <option value="tetrahedron">Tetrahedron</option>
                <option value="octahedron">Octahedron</option>
                <option value="sphere">Sphere</option>
                <option value="cylinder">Cylinder</option>
                <option value="star3d">3D Star</option>
                <option value="torus">Torus</option>
                <option value="pyramid">Pyramid</option>
            </select>
        </div>

        <div class="control-group">
            <label>Surface Dots</label>
            <div class="slider-container">
                <input type="range" id="dotDensity" min="200" max="3000" value="800">
                <span class="value-badge" id="dotDensityValue">800</span>
            </div>
        </div>

        <div class="control-group">
            <label>Primary Color</label>
            <input type="color" id="colorPrimary" value="#00d4ff">
        </div>

        <div class="control-group">
            <label>Accent Color</label>
            <input type="color" id="colorSecondary" value="#00ff99">
        </div>

        <div class="control-group">
            <label>Auto-Spin Speed</label>
            <div class="slider-container">
                <input type="range" id="rotSpeed" min="0" max="100" value="25">
                <span class="value-badge" id="rotSpeedValue">25</span>
            </div>
        </div>

        <div class="control-group">
            <label>Scale</label>
            <div class="slider-container">
                <input type="range" id="scale" min="30" max="200" value="100">
                <span class="value-badge" id="scaleValue">100%</span>
            </div>
        </div>

        <div class="control-group">
            <button id="resetBtn">Reset</button>
        </div>

        <div class="control-group info">
            📱 Drag to rotate • Pinch to scale
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 120;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // State
        let state = {
            rotationX: 0.5,
            rotationY: 0.5,
            rotationZ: 0,
            baseScale: 100,
            autoRotateX: 0.003,
            autoRotateY: 0.005,
            autoRotateZ: 0,
            shape: 'cube',
            dotDensity: 800,
            primaryColor: '#00d4ff',
            secondaryColor: '#00ff99'
        };

        // Touch handling
        let touchStartX = 0, touchStartY = 0;
        let touchStartRotX = 0, touchStartRotY = 0;
        let isDragging = false;
        let lastDistance = 0;

        function getDistance(p1, p2) {
            const dx = p1.x - p2.x;
            const dy = p1.y - p2.y;
            return Math.sqrt(dx * dx + dy * dy);
        }

        // Use touchstart/touchmove/touchend for better mobile support
        document.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                const touch1 = e.touches[0];
                const touch2 = e.touches[1];
                lastDistance = getDistance(
                    {x: touch1.clientX, y: touch1.clientY},
                    {x: touch2.clientX, y: touch2.clientY}
                );
            } else if (e.touches.length === 1) {
                const touch = e.touches[0];
                touchStartX = touch.clientX;
                touchStartY = touch.clientY;
                touchStartRotX = state.rotationX;
                touchStartRotY = state.rotationY;
                isDragging = true;
                e.preventDefault();
            }
        }, {passive: false});

        document.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                const touch1 = e.touches[0];
                const touch2 = e.touches[1];
                const distance = getDistance(
                    {x: touch1.clientX, y: touch1.clientY},
                    {x: touch2.clientX, y: touch2.clientY}
                );
                if (lastDistance > 0) {
                    const ratio = distance / lastDistance;
                    state.baseScale = Math.max(30, Math.min(200, state.baseScale * ratio));
                    document.getElementById('scale').value = state.baseScale;
                    document.getElementById('scaleValue').textContent = state.baseScale.toFixed(0) + '%';
                }
                lastDistance = distance;
                e.preventDefault();
            } else if (isDragging && e.touches.length === 1) {
                const touch = e.touches[0];
                const deltaX = touch.clientX - touchStartX;
                const deltaY = touch.clientY - touchStartY;
                
                state.rotationY = touchStartRotY + deltaX * 0.008;
                state.rotationX = touchStartRotX - deltaY * 0.008;
                e.preventDefault();
            }
        }, {passive: false});

        document.addEventListener('touchend', (e) => {
            if (e.touches.length === 0) {
                isDragging = false;
                lastDistance = 0;
            }
        }, {passive: false});

        // Control listeners
        document.getElementById('shapeSelect').addEventListener('change', (e) => {
            state.shape = e.target.value;
        });

        document.getElementById('dotDensity').addEventListener('input', (e) => {
            state.dotDensity = parseInt(e.target.value);
            document.getElementById('dotDensityValue').textContent = state.dotDensity;
        });

        document.getElementById('colorPrimary').addEventListener('change', (e) => {
            state.primaryColor = e.target.value;
        });

        document.getElementById('colorSecondary').addEventListener('change', (e) => {
            state.secondaryColor = e.target.value;
        });

        document.getElementById('rotSpeed').addEventListener('input', (e) => {
            const speed = parseInt(e.target.value) / 100;
            state.autoRotateX = 0.003 * (speed || 0.01);
            state.autoRotateY = 0.005 * (speed || 0.01);
            document.getElementById('rotSpeedValue').textContent = e.target.value;
        });

        document.getElementById('scale').addEventListener('input', (e) => {
            state.baseScale = parseInt(e.target.value);
            document.getElementById('scaleValue').textContent = state.baseScale + '%';
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            state.rotationX = 0.5;
            state.rotationY = 0.5;
            state.rotationZ = 0;
            state.baseScale = 100;
            document.getElementById('scale').value = 100;
        });

        // 3D Math
        function rotateX(p, a) {
            const c = Math.cos(a), s = Math.sin(a);
            return {x: p.x, y: p.y * c - p.z * s, z: p.y * s + p.z * c};
        }

        function rotateY(p, a) {
            const c = Math.cos(a), s = Math.sin(a);
            return {x: p.x * c + p.z * s, y: p.y, z: -p.x * s + p.z * c};
        }

        function rotateZ(p, a) {
            const c = Math.cos(a), s = Math.sin(a);
            return {x: p.x * c - p.y * s, y: p.x * s + p.y * c, z: p.z};
        }

        function project(p) {
            const fov = 500;
            const depth = fov / (fov + p.z);
            return {
                x: p.x * depth,
                y: p.y * depth,
                z: p.z,
                depth: depth
            };
        }

        // Generate SURFACE points only
        function generateSurfacePoints(shape, density) {
            let points = [];

            if (shape === 'cube') {
                const s = 100;
                const pointsPerFace = Math.floor(density / 6);
                for (let f = 0; f < 6; f++) {
                    for (let i = 0; i < pointsPerFace; i++) {
                        const u = Math.random() * 2 - 1;
                        const v = Math.random() * 2 - 1;
                        let p = {x: u * s, y: v * s, z: s};
                        
                        if (f === 0) p = {x: u * s, y: v * s, z: s};
                        else if (f === 1) p = {x: u * s, y: v * s, z: -s};
                        else if (f === 2) p = {x: s, y: u * s, z: v * s};
                        else if (f === 3) p = {x: -s, y: u * s, z: v * s};
                        else if (f === 4) p = {x: u * s, y: s, z: v * s};
                        else if (f === 5) p = {x: u * s, y: -s, z: v * s};
                        
                        points.push(p);
                    }
                }
            } else if (shape === 'sphere') {
                for (let i = 0; i < density; i++) {
                    const u = Math.random() * Math.PI * 2;
                    const v = Math.random() * Math.PI;
                    const r = 100;
                    points.push({
                        x: r * Math.sin(v) * Math.cos(u),
                        y: r * Math.sin(v) * Math.sin(u),
                        z: r * Math.cos(v)
                    });
                }
            } else if (shape === 'cylinder') {
                const h = 100, r = 80;
                const pointsPerRing = Math.floor(density * 0.7);
                const capPoints = Math.floor(density * 0.3 / 2);
                
                // Lateral surface
                for (let i = 0; i < pointsPerRing; i++) {
                    const u = Math.random() * Math.PI * 2;
                    const v = Math.random() * 2 - 1;
                    points.push({
                        x: Math.cos(u) * r,
                        y: v * h,
                        z: Math.sin(u) * r
                    });
                }
                
                // Top and bottom caps
                for (let i = 0; i < capPoints; i++) {
                    const u = Math.random() * Math.PI * 2;
                    const dist = Math.sqrt(Math.random()) * r;
                    points.push({x: Math.cos(u) * dist, y: h, z: Math.sin(u) * dist});
                    points.push({x: Math.cos(u) * dist, y: -h, z: Math.sin(u) * dist});
                }
            } else if (shape === 'tetrahedron') {
                const v1 = {x: 1, y: 1, z: 1};
                const v2 = {x: 1, y: -1, z: -1};
                const v3 = {x: -1, y: 1, z: -1};
                const v4 = {x: -1, y: -1, z: 1};
                const scale = 80;
                
                const faces = [[v1,v2,v3], [v1,v2,v4], [v1,v3,v4], [v2,v3,v4]];
                const pointsPerFace = Math.floor(density / 4);
                
                for (let f of faces) {
                    for (let i = 0; i < pointsPerFace; i++) {
                        const r1 = Math.random(), r2 = Math.random();
                        const w1 = r1, w2 = r2 * (1 - r1), w3 = (1 - r1) * (1 - r2);
                        points.push({
                            x: (f[0].x * w1 + f[1].x * w2 + f[2].x * w3) * scale,
                            y: (f[0].y * w1 + f[1].y * w2 + f[2].y * w3) * scale,
                            z: (f[0].z * w1 + f[1].z * w2 + f[2].z * w3) * scale
                        });
                    }
                }
            } else if (shape === 'octahedron') {
                const pointsPerFace = Math.floor(density / 8);
                const vertices = [
                    {x: 1, y: 0, z: 0}, {x: -1, y: 0, z: 0},
                    {x: 0, y: 1, z: 0}, {x: 0, y: -1, z: 0},
                    {x: 0, y: 0, z: 1}, {x: 0, y: 0, z: -1}
                ];
                const faces = [
                    [0,2,4], [0,2,5], [0,3,4], [0,3,5],
                    [1,2,4], [1,2,5], [1,3,4], [1,3,5]
                ];
                const scale = 80;
                
                for (let f of faces) {
                    for (let i = 0; i < pointsPerFace; i++) {
                        const r1 = Math.random(), r2 = Math.random();
                        const w1 = r1, w2 = r2 * (1 - r1), w3 = (1 - r1) * (1 - r2);
                        const v0 = vertices[f[0]], v1 = vertices[f[1]], v2 = vertices[f[2]];
                        points.push({
                            x: (v0.x * w1 + v1.x * w2 + v2.x * w3) * scale,
                            y: (v0.y * w1 + v1.y * w2 + v2.y * w3) * scale,
                            z: (v0.z * w1 + v1.z * w2 + v2.z * w3) * scale
                        });
                    }
                }
            } else if (shape === 'star3d') {
                for (let i = 0; i < density; i++) {
                    const u = Math.random() * Math.PI * 2;
                    const v = Math.random() * Math.PI;
                    const spike = 1 + 0.6 * Math.sin(u * 5);
                    const r = 100 * spike;
                    points.push({
                        x: r * Math.sin(v) * Math.cos(u),
                        y: r * Math.sin(v) * Math.sin(u),
                        z: r * Math.cos(v)
                    });
                }
            } else if (shape === 'torus') {
                const R = 80, r = 30;
                for (let i = 0; i < density; i++) {
                    const u = Math.random() * Math.PI * 2;
                    const v = Math.random() * Math.PI * 2;
                    points.push({
                        x: (R + r * Math.cos(v)) * Math.cos(u),
                        y: r * Math.sin(v),
                        z: (R + r * Math.cos(v)) * Math.sin(u)
                    });
                }
            } else if (shape === 'pyramid') {
                const apex = {x: 0, y: 120, z: 0};
                const base = [
                    {x: 100, y: -60, z: 100},
                    {x: -100, y: -60, z: 100},
                    {x: -100, y: -60, z: -100},
                    {x: 100, y: -60, z: -100}
                ];
                const pointsPerFace = Math.floor(density / 5);
                
                // 4 sides
                for (let i = 0; i < 4; i++) {
                    const v1 = apex, v2 = base[i], v3 = base[(i+1)%4];
                    for (let j = 0; j < pointsPerFace; j++) {
                        const r1 = Math.random(), r2 = Math.random();
                        const w1 = r1, w2 = r2 * (1 - r1), w3 = (1 - r1) * (1 - r2);
                        points.push({
                            x: v1.x * w1 + v2.x * w2 + v3.x * w3,
                            y: v1.y * w1 + v2.y * w2 + v3.y * w3,
                            z: v1.z * w1 + v2.z * w2 + v3.z * w3
                        });
                    }
                }
                
                // Base
                for (let i = 0; i < pointsPerFace; i++) {
                    const u = Math.random() * 2 - 1;
                    const v = Math.random() * 2 - 1;
                    points.push({
                        x: u * 100,
                        y: -60,
                        z: v * 100
                    });
                }
            }

            return points.slice(0, density);
        }

        let currentPoints = generateSurfacePoints(state.shape, state.dotDensity);

        // Animation loop
        function animate() {
            state.rotationX += state.autoRotateX;
            state.rotationY += state.autoRotateY;

            if (state.shape !== document.getElementById('shapeSelect').value) {
                state.shape = document.getElementById('shapeSelect').value;
                currentPoints = generateSurfacePoints(state.shape, state.dotDensity);
            }

            // Transform
            const transformed = currentPoints.map(p => {
                let point = p;
                point = rotateX(point, state.rotationX);
                point = rotateY(point, state.rotationY);
                point = rotateZ(point, state.rotationZ);
                
                const scale = (state.baseScale / 100) * 1.5;
                point = {x: point.x * scale, y: point.y * scale, z: point.z * scale};
                
                const proj = project(point);
                proj.screenX = canvas.width / 2 + proj.x;
                proj.screenY = canvas.height / 2 + proj.y;
                return proj;
            });

            // Sort by depth
            transformed.sort((a, b) => a.z - b.z);

            // Clear
            ctx.fillStyle = 'rgba(10, 14, 39, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            function hexToRgb(hex) {
                const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? {r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16)} : {r: 0, g: 212, b: 255};
            }

            const primary = hexToRgb(state.primaryColor);
            const secondary = hexToRgb(state.secondaryColor);

            // Draw dots with SIZE based on depth
            transformed.forEach(p => {
                // Normalize depth 0-1
                const depthNorm = Math.max(0, Math.min(1, (p.depth + 0.3) * 0.8));
                
                // SIZE VARIES: back (far) dots are BIGGER, front (near) dots are smaller
                const minSize = 0.8, maxSize = 3.5;
                const size = minSize + depthNorm * (maxSize - minSize);
                
                // COLOR VARIES: interpolate between primary and secondary
                const r = Math.floor(primary.r + (secondary.r - primary.r) * depthNorm);
                const g = Math.floor(primary.g + (secondary.g - primary.g) * depthNorm);
                const b = Math.floor(primary.b + (secondary.b - primary.b) * depthNorm);
                
                // Alpha also varies
                const alpha = 0.5 + depthNorm * 0.5;

                ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                ctx.beginPath();
                ctx.arc(p.screenX, p.screenY, size, 0, Math.PI * 2);
                ctx.fill();

                // Glow
                ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${alpha * 0.4})`;
                ctx.lineWidth = size * 1.2;
                ctx.stroke();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
