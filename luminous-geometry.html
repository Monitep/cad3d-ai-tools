<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luminous Geometry - 3D Dot Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0a0e27;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
        }

        canvas {
            flex: 1;
            background: linear-gradient(135deg, #0a0e27 0%, #16213e 100%);
            touch-action: manipulation;
            cursor: grab;
        }

        canvas:active {
            cursor: grabbing;
        }

        .controls {
            background: rgba(20, 30, 60, 0.95);
            border-top: 2px solid #00d4ff;
            padding: 15px 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            box-shadow: 0 -4px 20px rgba(0, 212, 255, 0.1);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-group label {
            color: #00d4ff;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        select, input[type="color"], input[type="range"], button {
            padding: 10px;
            border: 1px solid #00d4ff;
            background: rgba(0, 212, 255, 0.1);
            color: #00ff99;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        select:focus, input:focus {
            outline: none;
            background: rgba(0, 212, 255, 0.2);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        button {
            background: linear-gradient(135deg, #00d4ff 0%, #00ff99 100%);
            color: #0a0e27;
            font-weight: bold;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 12px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 255, 153, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .slider-value {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .slider-value input[type="range"] {
            flex: 1;
        }

        .value-display {
            min-width: 40px;
            text-align: right;
            color: #00ff99;
            font-weight: bold;
        }

        .title {
            color: #00d4ff;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        input[type="color"] {
            width: 100%;
            height: 40px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .controls-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        @media (max-width: 768px) {
            .controls {
                grid-template-columns: repeat(2, 1fr);
                padding: 10px 15px;
                gap: 10px;
            }

            select, input, button {
                padding: 8px;
                font-size: 12px;
            }
        }

        .info-text {
            color: #888;
            font-size: 11px;
            margin-top: 3px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="controls">
        <div class="control-group">
            <label class="title">Shape</label>
            <select id="shapeSelect">
                <option value="cube">Cube</option>
                <option value="tetrahedron">Tetrahedron</option>
                <option value="octahedron">Octahedron</option>
                <option value="sphere">Sphere</option>
                <option value="cylinder">Cylinder</option>
                <option value="star3d">3D Star</option>
                <option value="torus">Torus</option>
                <option value="pyramid">Pyramid</option>
            </select>
        </div>

        <div class="control-group">
            <label class="title">Dot Density</label>
            <div class="slider-value">
                <input type="range" id="dotDensity" min="100" max="5000" value="1000">
                <span class="value-display" id="dotDensityValue">1000</span>
            </div>
        </div>

        <div class="control-group">
            <label class="title">Primary Color</label>
            <input type="color" id="colorPrimary" value="#00d4ff">
        </div>

        <div class="control-group">
            <label class="title">Secondary Color</label>
            <input type="color" id="colorSecondary" value="#00ff99">
        </div>

        <div class="control-group">
            <label class="title">Rotation Speed</label>
            <div class="slider-value">
                <input type="range" id="rotSpeed" min="0" max="100" value="30">
                <span class="value-display" id="rotSpeedValue">30</span>
            </div>
        </div>

        <div class="control-group">
            <label class="title">Scale</label>
            <div class="slider-value">
                <input type="range" id="scale" min="20" max="200" value="100">
                <span class="value-display" id="scaleValue">100%</span>
            </div>
        </div>

        <div class="control-group">
            <button id="resetBtn">Reset</button>
        </div>

        <div class="control-group">
            <p class="info-text">Drag to rotate • Pinch to scale • Tap controls to modify</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Resize canvas
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 150;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // State
        let state = {
            rotationX: 0.5,
            rotationY: 0.5,
            rotationZ: 0,
            baseScale: 100,
            autoRotateX: 0.004,
            autoRotateY: 0.006,
            autoRotateZ: 0,
            shape: 'cube',
            dotDensity: 1000,
            primaryColor: '#00d4ff',
            secondaryColor: '#00ff99',
            centerX: 0,
            centerY: 0
        };

        // Touch handling for rotation
        let touchStartX = 0, touchStartY = 0;
        let touchStartRotX = 0, touchStartRotY = 0;
        let isManipulating = false;
        let lastDistance = 0;

        function getDistance(p1, p2) {
            const dx = p1.x - p2.x;
            const dy = p1.y - p2.y;
            return Math.sqrt(dx * dx + dy * dy);
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (e.touches && e.touches.length === 2) {
                const touch1 = e.touches[0];
                const touch2 = e.touches[1];
                lastDistance = getDistance(
                    {x: touch1.clientX, y: touch1.clientY},
                    {x: touch2.clientX, y: touch2.clientY}
                );
            } else if (e.touches && e.touches.length === 1) {
                const touch = e.touches[0];
                touchStartX = touch.clientX;
                touchStartY = touch.clientY;
                touchStartRotX = state.rotationX;
                touchStartRotY = state.rotationY;
                isManipulating = true;
            }
        }, {passive: false});

        canvas.addEventListener('pointermove', (e) => {
            if (e.touches && e.touches.length === 2) {
                const touch1 = e.touches[0];
                const touch2 = e.touches[1];
                const distance = getDistance(
                    {x: touch1.clientX, y: touch1.clientY},
                    {x: touch2.clientX, y: touch2.clientY}
                );
                if (lastDistance > 0) {
                    const ratio = distance / lastDistance;
                    state.baseScale = Math.max(20, Math.min(200, state.baseScale * ratio));
                    document.getElementById('scale').value = state.baseScale;
                    document.getElementById('scaleValue').textContent = state.baseScale.toFixed(0) + '%';
                }
                lastDistance = distance;
            } else if (isManipulating && e.touches && e.touches.length === 1) {
                const touch = e.touches[0];
                const deltaX = touch.clientX - touchStartX;
                const deltaY = touch.clientY - touchStartY;
                
                state.rotationY = touchStartRotY + deltaX * 0.005;
                state.rotationX = touchStartRotX - deltaY * 0.005;
            }
        }, {passive: false});

        canvas.addEventListener('pointerup', () => {
            isManipulating = false;
            lastDistance = 0;
        });

        // Update controls
        document.getElementById('shapeSelect').addEventListener('change', (e) => {
            state.shape = e.target.value;
        });

        document.getElementById('dotDensity').addEventListener('input', (e) => {
            state.dotDensity = parseInt(e.target.value);
            document.getElementById('dotDensityValue').textContent = state.dotDensity;
        });

        document.getElementById('colorPrimary').addEventListener('change', (e) => {
            state.primaryColor = e.target.value;
        });

        document.getElementById('colorSecondary').addEventListener('change', (e) => {
            state.secondaryColor = e.target.value;
        });

        document.getElementById('rotSpeed').addEventListener('input', (e) => {
            const speed = parseInt(e.target.value) / 100;
            state.autoRotateX = 0.004 * speed;
            state.autoRotateY = 0.006 * speed;
            document.getElementById('rotSpeedValue').textContent = e.target.value;
        });

        document.getElementById('scale').addEventListener('input', (e) => {
            state.baseScale = parseInt(e.target.value);
            document.getElementById('scaleValue').textContent = state.baseScale + '%';
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            state.rotationX = 0.5;
            state.rotationY = 0.5;
            state.rotationZ = 0;
            state.baseScale = 100;
        });

        // 3D Math
        function rotateX(point, angle) {
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            return {
                x: point.x,
                y: point.y * cos - point.z * sin,
                z: point.y * sin + point.z * cos
            };
        }

        function rotateY(point, angle) {
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            return {
                x: point.x * cos + point.z * sin,
                y: point.y,
                z: -point.x * sin + point.z * cos
            };
        }

        function rotateZ(point, angle) {
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            return {
                x: point.x * cos - point.y * sin,
                y: point.x * sin + point.y * cos,
                z: point.z
            };
        }

        function project(point, fov = 500) {
            const scale = fov / (fov + point.z);
            return {
                x: point.x * scale,
                y: point.y * scale,
                z: point.z,
                depth: scale
            };
        }

        // Generate shapes
        function generatePoints(shape, density) {
            let points = [];

            function randomInSphere(radius) {
                let point;
                do {
                    point = {
                        x: (Math.random() - 0.5) * 2 * radius,
                        y: (Math.random() - 0.5) * 2 * radius,
                        z: (Math.random() - 0.5) * 2 * radius
                    };
                } while (Math.sqrt(point.x*point.x + point.y*point.y + point.z*point.z) > radius);
                return point;
            }

            if (shape === 'cube') {
                for (let i = 0; i < density; i++) {
                    points.push({
                        x: (Math.random() - 0.5) * 200,
                        y: (Math.random() - 0.5) * 200,
                        z: (Math.random() - 0.5) * 200
                    });
                }
            } else if (shape === 'sphere') {
                for (let i = 0; i < density; i++) {
                    points.push(randomInSphere(100));
                }
            } else if (shape === 'tetrahedron') {
                const h = 100 / Math.sqrt(2/3);
                const baseVertices = [
                    {x: -h*Math.sqrt(3)/3, y: -h/3, z: 0},
                    {x: h*Math.sqrt(3)/3, y: -h/3, z: 0},
                    {x: 0, y: 2*h/3, z: 0},
                    {x: 0, y: 0, z: h*Math.sqrt(2/3)}
                ];
                for (let i = 0; i < density; i++) {
                    const p = Math.random();
                    let point = {x: 0, y: 0, z: 0};
                    const weights = [Math.random(), Math.random(), Math.random(), Math.random()];
                    const sum = weights.reduce((a,b) => a+b);
                    for (let j = 0; j < 4; j++) {
                        point.x += baseVertices[j].x * weights[j] / sum;
                        point.y += baseVertices[j].y * weights[j] / sum;
                        point.z += baseVertices[j].z * weights[j] / sum;
                    }
                    points.push(point);
                }
            } else if (shape === 'octahedron') {
                for (let i = 0; i < density; i++) {
                    const p = randomInSphere(100);
                    const sum = Math.abs(p.x) + Math.abs(p.y) + Math.abs(p.z);
                    points.push({x: p.x/sum*100, y: p.y/sum*100, z: p.z/sum*100});
                }
            } else if (shape === 'cylinder') {
                for (let i = 0; i < density; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const radius = Math.sqrt(Math.random()) * 80;
                    points.push({
                        x: Math.cos(angle) * radius,
                        y: (Math.random() - 0.5) * 150,
                        z: Math.sin(angle) * radius
                    });
                }
            } else if (shape === 'star3d') {
                for (let i = 0; i < density; i++) {
                    const u = Math.random() * 2 * Math.PI;
                    const v = Math.random() * Math.PI;
                    const r = Math.random() * 100;
                    const spiky = 1 + 0.5 * Math.sin(u * 5);
                    points.push({
                        x: spiky * r * Math.sin(v) * Math.cos(u),
                        y: spiky * r * Math.sin(v) * Math.sin(u),
                        z: spiky * r * Math.cos(v)
                    });
                }
            } else if (shape === 'torus') {
                const R = 80, r = 30;
                for (let i = 0; i < density; i++) {
                    const u = Math.random() * 2 * Math.PI;
                    const v = Math.random() * 2 * Math.PI;
                    points.push({
                        x: (R + r * Math.cos(v)) * Math.cos(u),
                        y: r * Math.sin(v),
                        z: (R + r * Math.cos(v)) * Math.sin(u)
                    });
                }
            } else if (shape === 'pyramid') {
                const vertices = [
                    {x: 0, y: 100, z: 0},
                    {x: 80, y: -80, z: 80},
                    {x: -80, y: -80, z: 80},
                    {x: -80, y: -80, z: -80},
                    {x: 80, y: -80, z: -80}
                ];
                for (let i = 0; i < density; i++) {
                    const w = Array(5).fill(0).map(() => Math.random());
                    const sum = w.reduce((a,b) => a+b);
                    let point = {x: 0, y: 0, z: 0};
                    for (let j = 0; j < 5; j++) {
                        point.x += vertices[j].x * w[j] / sum;
                        point.y += vertices[j].y * w[j] / sum;
                        point.z += vertices[j].z * w[j] / sum;
                    }
                    points.push(point);
                }
            }

            return points;
        }

        let currentPoints = generatePoints(state.shape, state.dotDensity);

        // Animation loop
        function animate() {
            state.rotationX += state.autoRotateX;
            state.rotationY += state.autoRotateY;
            state.rotationZ += state.autoRotateZ;

            if (state.shape !== document.getElementById('shapeSelect').value) {
                state.shape = document.getElementById('shapeSelect').value;
                currentPoints = generatePoints(state.shape, state.dotDensity);
            }

            // Transform and project points
            const transformed = currentPoints.map(point => {
                let p = point;
                p = rotateX(p, state.rotationX);
                p = rotateY(p, state.rotationY);
                p = rotateZ(p, state.rotationZ);
                
                const scale = (state.baseScale / 100) * 2;
                p.x *= scale;
                p.y *= scale;
                p.z *= scale;

                const proj = project(p);
                proj.screenX = canvas.width / 2 + proj.x;
                proj.screenY = canvas.height / 2 + proj.y;
                return proj;
            });

            // Sort by depth (painter's algorithm)
            transformed.sort((a, b) => a.z - b.z);

            // Clear canvas
            ctx.fillStyle = 'rgba(10, 14, 39, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Parse colors to RGB
            function hexToRgb(hex) {
                const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? {
                    r: parseInt(result[1], 16),
                    g: parseInt(result[2], 16),
                    b: parseInt(result[3], 16)
                } : {r: 0, g: 212, b: 255};
            }

            const primaryRgb = hexToRgb(state.primaryColor);
            const secondaryRgb = hexToRgb(state.secondaryColor);

            // Draw dots
            transformed.forEach(point => {
                const depth = (point.depth + 0.5) * 0.5; // Normalize 0-1
                const size = 1 + depth * 3;
                
                // Interpolate color
                const r = Math.floor(primaryRgb.r + (secondaryRgb.r - primaryRgb.r) * depth);
                const g = Math.floor(primaryRgb.g + (secondaryRgb.g - primaryRgb.g) * depth);
                const b = Math.floor(primaryRgb.b + (secondaryRgb.b - primaryRgb.b) * depth);
                const alpha = 0.3 + depth * 0.7;

                ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                ctx.beginPath();
                ctx.arc(point.screenX, point.screenY, size, 0, Math.PI * 2);
                ctx.fill();

                // Glow effect
                const glowAlpha = (0.2 + depth * 0.3) * alpha;
                ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${glowAlpha})`;
                ctx.lineWidth = size * 1.5;
                ctx.stroke();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
