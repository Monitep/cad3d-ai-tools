<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Il Tuo Universo Personale</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#07071a;--g1:rgba(100,30,180,.35);--g2:rgba(30,100,200,.3);--g3:rgba(180,30,100,.25);
  --a1:#ff6b9d;--a2:#ffd93d;
  --card:rgba(255,255,255,.035);--card-b:rgba(255,255,255,.07);--card-h:rgba(255,255,255,.16);
  --tx:#fff;--txm:rgba(255,255,255,.42);--txd:rgba(255,255,255,.6);
  --ibg:rgba(255,255,255,.07);--ib:rgba(255,255,255,.12);
  --gc:rgba(255,255,255,.03);--panel:rgba(15,10,35,.92);
  --fs:1rem;
}
.th-ocean{--bg:#020f1f;--g1:rgba(0,100,200,.4);--g2:rgba(0,180,180,.3);--g3:rgba(0,50,150,.2);--a1:#00dfd8;--a2:#4d96ff;--panel:rgba(0,15,35,.92)}
.th-forest{--bg:#030a05;--g1:rgba(20,120,40,.4);--g2:rgba(40,160,60,.25);--g3:rgba(80,200,80,.15);--a1:#6bcb77;--a2:#c8f557;--panel:rgba(3,12,6,.92)}
.th-sunset{--bg:#150500;--g1:rgba(200,80,0,.4);--g2:rgba(220,50,30,.3);--g3:rgba(180,120,0,.2);--a1:#ff9f1c;--a2:#ff4500;--panel:rgba(20,5,0,.92)}
.th-night{--bg:#000;--g1:rgba(30,30,30,.6);--g2:rgba(20,20,20,.4);--g3:rgba(50,50,50,.2);--a1:#d0d0d0;--a2:#888;--panel:rgba(10,10,10,.95)}
.th-light{
  --bg:#eef0f8;--g1:rgba(100,60,220,.1);--g2:rgba(60,120,220,.08);--g3:rgba(180,60,120,.07);
  --a1:#7928ca;--a2:#ff0080;
  --card:rgba(255,255,255,.85);--card-b:rgba(0,0,0,.08);--card-h:rgba(0,0,0,.14);
  --tx:#1a1a2e;--txm:rgba(0,0,0,.45);--txd:rgba(0,0,0,.65);
  --ibg:rgba(255,255,255,.95);--ib:rgba(0,0,0,.15);--gc:rgba(0,0,0,.04);--panel:rgba(240,238,255,.97)
}

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);min-height:100vh;overflow-x:hidden;color:var(--tx);font-size:var(--fs);transition:background .35s,color .35s}

.bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at 15% 40%,var(--g1),transparent 55%),radial-gradient(ellipse at 85% 20%,var(--g2),transparent 55%),radial-gradient(ellipse at 50% 85%,var(--g3),transparent 55%),var(--bg);transition:background .35s}
.bg-grid{position:fixed;inset:0;z-index:-1;background-image:linear-gradient(var(--gc) 1px,transparent 1px),linear-gradient(90deg,var(--gc) 1px,transparent 1px);background-size:50px 50px}

@keyframes floatUp{0%{transform:translateY(100vh);opacity:0}10%{opacity:.6}90%{opacity:.6}100%{transform:translateY(-20vh);opacity:0}}
.pt{position:fixed;border-radius:50%;pointer-events:none;animation:floatUp linear infinite}

/* INPUT */
.hero{text-align:center;padding:60px 20px 50px}
.hero h1{font-size:clamp(2rem,5vw,4rem);font-weight:900;background:linear-gradient(135deg,var(--a1),var(--a2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:10px;line-height:1.1}
.hero p{color:var(--txd);font-size:1rem;margin-bottom:36px}
.icard{max-width:440px;margin:0 auto;background:var(--card);backdrop-filter:blur(20px);border:1px solid var(--card-b);border-radius:24px;padding:36px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
label{display:block;color:var(--txd);font-size:.78rem;letter-spacing:.8px;text-transform:uppercase;margin-bottom:7px;font-weight:600}
input[type=date],input[type=time]{width:100%;padding:13px 16px;background:var(--ibg);border:1px solid var(--ib);border-radius:12px;color:var(--tx);font-size:1rem;margin-bottom:20px;outline:none;transition:all .3s;color-scheme:dark}
.th-light input[type=date],.th-light input[type=time]{color-scheme:light}
input:focus{border-color:rgba(140,50,220,.7);box-shadow:0 0 0 3px rgba(140,50,220,.15)}
.hint{color:var(--txm);font-size:.75rem;margin-top:-14px;margin-bottom:18px;padding-left:4px}
.btn{width:100%;padding:16px;background:linear-gradient(135deg,#7928ca,#ff0080);border:none;border-radius:12px;color:#fff;font-size:1rem;font-weight:800;cursor:pointer;transition:all .3s;letter-spacing:.3px;text-transform:uppercase}
.btn:hover{transform:translateY(-3px);box-shadow:0 14px 36px rgba(120,0,120,.5)}

/* RESULTS */
#results{display:none;max-width:1200px;margin:0 auto;padding:30px 16px 60px}

/* ACTION BAR */
.action-bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:28px}
.abtn{display:flex;align-items:center;gap:7px;padding:10px 20px;background:var(--card);border:1px solid var(--card-b);border-radius:12px;color:var(--txd);cursor:pointer;font-size:.85rem;font-weight:600;transition:all .3s;backdrop-filter:blur(10px)}
.abtn:hover{background:var(--card-h);color:var(--tx);transform:translateY(-2px)}
.abtn.pdf{border-color:rgba(255,107,157,.4);color:#ff6b9d}
.abtn.share{border-color:rgba(77,150,255,.4);color:#4d96ff}
.abtn.reset{border-color:rgba(255,255,255,.15)}

/* TICKER */
.ticker-wrap{text-align:center;padding:36px 24px;background:var(--card);border:1px solid var(--card-b);border-radius:24px;margin-bottom:28px;position:relative;overflow:hidden}
.ticker-wrap::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(120,0,200,.08),rgba(255,0,128,.08))}
.ticker-label{color:var(--txm);font-size:.74rem;letter-spacing:3px;text-transform:uppercase;margin-bottom:12px}
.ticker-main{font-size:clamp(1.8rem,5.5vw,4rem);font-weight:900;background:linear-gradient(135deg,var(--a1),var(--a2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-variant-numeric:tabular-nums;font-feature-settings:"tnum";line-height:1;letter-spacing:-1px}
.ticker-sub{color:var(--txm);font-size:.82rem;margin-top:10px;font-variant-numeric:tabular-nums}

/* CARDS */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--card-b);border-radius:20px;padding:24px;transition:all .3s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden;animation:cardIn .5s ease both}
@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.card:hover{transform:translateY(-4px);border-color:var(--card-h);box-shadow:0 20px 44px rgba(0,0,0,.4)}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:20px 20px 0 0}
.c-p::before{background:linear-gradient(90deg,#7928ca,#ff0080)}
.c-b::before{background:linear-gradient(90deg,#0070f3,#00dfd8)}
.c-g::before{background:linear-gradient(90deg,#17c964,#5ea2ef)}
.c-o::before{background:linear-gradient(90deg,#f5a623,#f56767)}
.c-pk::before{background:linear-gradient(90deg,#ff4ecd,#a855f7)}
.c-cy::before{background:linear-gradient(90deg,#06b6d4,#3b82f6)}
.c-l::before{background:linear-gradient(90deg,#84cc16,#22c55e)}
.c-r::before{background:linear-gradient(90deg,#ef4444,#f97316)}
.c-y::before{background:linear-gradient(90deg,#eab308,#f59e0b)}
.emo{font-size:2.2rem;margin-bottom:9px;display:block}
.clabel{color:var(--txm);font-size:.68rem;letter-spacing:1.8px;text-transform:uppercase;margin-bottom:6px}
.cval{font-size:1.55rem;font-weight:800;color:var(--tx);line-height:1.2;margin-bottom:5px;font-variant-numeric:tabular-nums}
.cdesc{color:var(--txm);font-size:.88rem;line-height:1.6}

/* ZODIAC WIDE */
.zodiac-card{grid-column:span 2}
@media(max-width:600px){.zodiac-card{grid-column:span 1}}
.zi{display:flex;align-items:center;gap:20px}
@media(max-width:600px){.zi{flex-direction:column;text-align:center}}
.z-sym{font-size:5rem;line-height:1;flex-shrink:0}
.z-name{font-size:2rem;font-weight:900;color:var(--tx);margin-bottom:3px}
.z-dates{color:var(--txm);font-size:.8rem;margin-bottom:7px;letter-spacing:.5px}
.z-traits{color:var(--txd);font-size:.86rem;line-height:1.65}

/* FLOAT CONTROLS */
.fab{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab-btn{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#7928ca,#ff0080);border:none;color:#fff;font-size:1.4rem;cursor:pointer;box-shadow:0 6px 24px rgba(120,0,120,.5);transition:all .3s;display:flex;align-items:center;justify-content:center}
.fab-btn:hover{transform:scale(1.1) rotate(30deg)}
.fab-panel{background:var(--panel);backdrop-filter:blur(24px);border:1px solid var(--card-b);border-radius:20px;padding:20px;width:260px;display:none;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.fab-panel.open{display:block;animation:panelIn .25s ease}
@keyframes panelIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.panel-title{color:var(--txm);font-size:.7rem;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px;font-weight:700}
.themes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tswatch{width:34px;height:34px;border-radius:50%;border:2.5px solid transparent;cursor:pointer;transition:all .2s;position:relative}
.tswatch:hover,.tswatch.active{border-color:#fff;transform:scale(1.15)}
.th-light .tswatch:hover,.th-light .tswatch.active{border-color:#555}
.tswatch[data-th=""]      {background:linear-gradient(135deg,#7928ca,#ff0080)}
.tswatch[data-th="ocean"] {background:linear-gradient(135deg,#0070f3,#00dfd8)}
.tswatch[data-th="forest"]{background:linear-gradient(135deg,#17c964,#c8f557)}
.tswatch[data-th="sunset"]{background:linear-gradient(135deg,#ff9f1c,#ff4500)}
.tswatch[data-th="night"] {background:linear-gradient(135deg,#333,#888)}
.tswatch[data-th="light"] {background:linear-gradient(135deg,#eef0f8,#c8b4ff);border-color:rgba(0,0,0,.2)!important}
.tswatch[data-th="light"]:hover{border-color:#7928ca!important}
.fs-ctrl{display:flex;align-items:center;gap:8px}
.fs-btn{width:32px;height:32px;border-radius:8px;background:var(--card);border:1px solid var(--card-b);color:var(--tx);font-size:1.1rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center}
.fs-btn:hover{background:var(--card-h)}
.fs-val{color:var(--txd);font-size:.85rem;font-weight:700;flex:1;text-align:center;min-width:36px}
.divider{height:1px;background:var(--card-b);margin:14px 0}

/* TOAST */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(50,200,100,.9);color:#fff;padding:10px 24px;border-radius:12px;font-size:.88rem;font-weight:600;opacity:0;transition:all .3s;pointer-events:none;z-index:300}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

<div class="bg-grid"></div>
<div class="toast" id="toast"></div>

<!-- INPUT -->

    </div>

</div>

function moonPhase(date){
  const y=date.getFullYear(),m=date.getMonth()+1,d=date.getDate();
  let yr=y,mo=m;if(mo<3){yr--;mo+=12;}
  const a=Math.floor(yr/100),b=2-a+Math.floor(a/4);
  const jd=Math.floor(365.25*(yr+4716))+Math.floor(30.6001*(mo+1))+d+b-1524.5;
  const ph=((jd-2451550.1)%29.530588+29.530588)%29.530588;
  const ps=[['🌑','Luna Nuova',0,1.85],['🌒','Crescente',1.85,7.38],['🌓','Primo Quarto',7.38,11.08],['🌔','Gibbosa Crescente',11.08,14.77],['🌕','Luna Piena',14.77,18.46],['🌖','Gibbosa Calante',18.46,22.15],['🌗','Ultimo Quarto',22.15,25.85],['🌘','Calante',25.85,29.53]];
  for(const p of ps)if(ph>=p[2]&&ph<p[3])return{e:p[0],n:p[1]};
  return{e:'🌑',n:'Luna Nuova'};
}

function julianDay(date){
  const y=date.getFullYear(),m=date.getMonth()+1,d=date.getDate();
  let yr=y,mo=m;if(mo<3){yr--;mo+=12;}
  const a=Math.floor(yr/100),b=2-a+Math.floor(a/4);
  return Math.floor(365.25*(yr+4716))+Math.floor(30.6001*(mo+1))+d+b-1524.5;
}

function getSeason(m,d){
  if((m===3&&d>=20)||m===4||m===5||(m===6&&d<21))return{e:'🌸',n:'Primavera'};
  if((m===6&&d>=21)||m===7||m===8||(m===9&&d<23))return{e:'☀️',n:'Estate'};
  if((m===9&&d>=23)||m===10||m===11||(m===12&&d<21))return{e:'🍂',n:'Autunno'};
  return{e:'❄️',n:'Inverno'};
}

// ===== COUNTER ANIMATION =====
function animateCounter(el,target,duration=1400){
  const start=performance.now();
  const step=time=>{
    const p=Math.min((time-start)/duration,1);
    const ease=1-Math.pow(1-p,3);
    el.textContent=fmt(Math.floor(ease*target));
    if(p<1)requestAnimationFrame(step);
    else el.textContent=fmt(target);
  };
  requestAnimationFrame(step);
}
function startCounters(){
  document.querySelectorAll('[data-cnt]').forEach(el=>{
    const delay=parseInt(el.dataset.delay||0);
    setTimeout(()=>animateCounter(el,parseFloat(el.dataset.cnt)),delay);
  });
}

function tick(){
  if(!birthDT)return;
  const now=new Date(),ms=now-birthDT;
  const sec=Math.floor(ms/1000),min=Math.floor(ms/60000),hr=Math.floor(ms/3600000);
  const days=Math.floor(ms/86400000);
  const y=Math.floor(days/365.25),rd=Math.floor(days-y*365.25);
  const rh=Math.floor((ms%86400000)/3600000);
  const rm=Math.floor((ms%3600000)/60000);
  const rs=Math.floor((ms%60000)/1000);
  document.getElementById('tickerMain').textContent=`${y}a ${rd}g ${pad(rh)}:${pad(rm)}:${pad(rs)}`;
  document.getElementById('tickerSub').textContent=`${fmt(sec)} secondi  •  ${fmt(min)} minuti  •  ${fmt(hr)} ore`;
  const upd=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=fmt(v);};
  upd('lv-sec',sec);
  upd('lv-hb',sec*70/60);
  upd('lv-br',sec*16/60);
  upd('lv-blinks',(ms/3600000)*(16/24)*15*60);
}

function go(){

  if(!dv){alert('Inserisci la data di nascita!');return;}

  const[y,m,d]=dv.split('-').map(Number);
  birthDT=tv?new Date(y,m-1,d,...tv.split(':').map(Number),0):new Date(y,m-1,d,0,0,0);
  _tv=tv;_m=m;_d=d;_y=y;

  const now=new Date(),ms=now-birthDT;
  const days=ms/86400e3,totalMin=ms/6e4;
  _totalDays=Math.floor(days);_totalHr=Math.floor(ms/36e5);_totalMin=Math.floor(totalMin);
  _weeks=Math.floor(_totalDays/7);_years=Math.floor(_totalDays/365.25);
  _sleepDays=Math.floor(_totalDays*7/24);_weekends=_weeks*2;

  _hairCm=Math.floor(_totalDays*.35/10);
  _earthMM=(_totalDays/365.25*940).toFixed(1);
  // Distanze astronomiche: km/giorno = velocità km/s × 86400
  // Sole attorno galassia: 220 km/s → 19.008 Mln km/giorno
  // Milky Way verso Andromeda: 110 km/s → 9.504 Mln km/giorno
  // Sistema solare nel cosmo (vs CMB): 627 km/s → 54.2 Mln km/giorno
  _kmGalassia  = (_totalDays * 19.008).toFixed(0);   // Mln km
  _kmAndromeda = (_totalDays * 9.504).toFixed(0);    // Mln km
  _kmCosmo     = (_totalDays * 54.173).toFixed(0);   // Mln km
  _luneOrbite  = Math.floor(_totalDays / 27.3);
  _jd=julianDay(birthDT);

  let nb=new Date(now.getFullYear(),m-1,d);if(nb<=now)nb=new Date(now.getFullYear()+1,m-1,d);
  _daysNext=Math.ceil((nb-now)/864e5);

  _zodiac=getZodiac(m,d);_chinese=getChinese(y);_moon=moonPhase(birthDT);_season=getSeason(m,d);
  const mmdd=pad(m)+'-'+pad(d);_saint=SAINTS[mmdd]||'N/D';_pop=worldPop(y);

  document.getElementById('results').style.display='block';

// ===== PDF =====
function makePDF(){
  if(!window.jspdf){showToast('Libreria PDF non caricata');return;}
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const W=210,H=297,mg=14;let y=mg;

  const txt=(s,x,yy,opts)=>doc.text(String(s),x,yy,opts||{});
  const row=(label,val,yy)=>{
    doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(90,90,90);
    txt(label,mg+5,yy);
    doc.setFont('helvetica','bold');doc.setTextColor(20,20,20);
    txt(val,105,yy);
    return yy+6.5;
  };
  const section=(title,r,g,b,yy)=>{
    if(yy>H-40){doc.addPage();yy=mg;}
    doc.setFillColor(r,g,b);doc.rect(mg,yy,3,7,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(9.5);doc.setTextColor(r,g,b);
    txt(title,mg+6,yy+5.5);
    return yy+12;
  };

  // HEADER BAR
  doc.setFillColor(18,8,45);doc.rect(0,0,W,32,'F');
  doc.setFillColor(255,107,157);doc.rect(0,30,W/3,2.5,'F');
  doc.setFillColor(255,217,61);doc.rect(W/3,30,W/3,2.5,'F');
  doc.setFillColor(107,203,119);doc.rect(2*W/3,30,W/3,2.5,'F');
  doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(18);
  txt('IL TUO UNIVERSO PERSONALE',W/2,14,{align:'center'});
  doc.setFontSize(8);doc.setFont('helvetica','normal');doc.setTextColor(190,170,255);
  txt(`Data: ${_bday}${_tv?' alle '+_tv:''} | Generato il ${new Date().toLocaleDateString('it-IT')}`,W/2,24,{align:'center'});

  y=42;

  // SECTION 1: NASCITA
  y=section('DATI DI NASCITA',121,40,202,y);
  y=row('Data di nascita:',`${_dowStr} ${_bday}${_tv?' alle '+_tv:''}`,y);
  y=row('Santo del giorno:',_saint,y);
  y=row('Stagione:',_season.n,y);
  y=row('Fase lunare:',_moon.n,y);
  y=row('Giorno Giuliano (JDN):',Math.floor(_jd).toLocaleString('it-IT'),y);
  y=row('Popolazione mondiale:',_pop+' miliardi stimati (anno '+_y+')',y);
  y+=4;

  // SECTION 2: ZODIACO
  y=section('SEGNO ZODIACALE',255,0,128,y);
  y=row('Segno Occidentale:',`${_zodiac.n} ${_zodiac.s}  |  ${_zodiac.el} / ${_zodiac.pl}`,y);
  doc.setFont('helvetica','italic');doc.setFontSize(8);doc.setTextColor(80,80,80);
  const traits=doc.splitTextToSize(_zodiac.t,W-2*mg-10);
  doc.text(traits,mg+5,y);y+=traits.length*4.5+5;
  y=row('Zodiaco Cinese:',`Anno del ${_chinese.n} ${_chinese.e}`,y);
  y+=4;

  // SECTION 3: STATISTICHE
  y=section('STATISTICHE DI VITA',23,201,100,y);
  y=row('Anni compiuti:',`${_years} anni`,y);
  y=row('Giorni vissuti:',fmt(_totalDays),y);
  y=row('Settimane:',fmt(_weeks),y);
  y=row('Ore totali:',fmt(_totalHr),y);
  y=row('Giorni dormendo:',`${fmt(_sleepDays)}  (media 7h/notte)`,y);
  y=row('Weekend vissuti:',fmt(_weekends),y);
  y=row('Prossimo compleanno:','fra '+_daysNext+' giorni',y);
  y+=4;

  // SECTION 4: BIOLOGIA
  if(y>H-70){doc.addPage();y=mg;}
  y=section("STIME BIOLOGICHE",245,167,28,y);
  const nowMs=new Date()-birthDT;
  y=row('Battiti del cuore:','~'+fmt(nowMs/1000*70/60)+'  (70 bpm)',y);
  y=row('Respiri:','~'+fmt(nowMs/1000*16/60)+'  (16/min)',y);
  y=row('Passi stimati:','~'+fmt(_steps)+'  (8.000/giorno)',y);
  y=row('Litri di sangue pompati:','~'+fmt(_bloodL),y);
  y=row('Km percorsi attorno al Sole:','~'+_earthMM+' Mln km',y);
  y=row('Caffe stimati:','~'+fmt(_coffee)+'  (1.5/giorno)',y);
  y=row('Capelli cresciuti:','~'+_hairCm+' cm  (senza tagli)',y);

  // FOOTER
  doc.setFillColor(18,8,45);doc.rect(0,H-16,W,16,'F');
  doc.setFontSize(7.5);doc.setFont('helvetica','normal');doc.setTextColor(170,150,220);
  txt('cad3d.expert/ai/birthday-universe.html  |  Generato con Il Tuo Universo Personale',W/2,H-6,{align:'center'});

  doc.save(`universo-${_y}.pdf`);
  showToast('📄 PDF scaricato!');
}

// ===== RESET =====
function doReset(){
  if(liveTimer)clearInterval(liveTimer);birthDT=null;
  document.getElementById('inputSection').style.display='block';
  document.getElementById('results').style.display='none';
}

// ===== URL PARAMS AUTO-LOAD =====
function checkURL(){
  const p=new URLSearchParams(location.search);
  const dv=p.get('d'),tv=p.get('t');
  if(dv){
    document.getElementById('birthDate').value=dv;
    if(tv)document.getElementById('birthTime').value=tv;
    setTimeout(go,300);
  }
}

spawnParticles();

const savedFS=parseInt(localStorage.getItem('bday-fs')||0);

checkURL();
