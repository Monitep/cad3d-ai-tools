<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Il Tuo Universo Personale</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#07071a;min-height:100vh;overflow-x:hidden;color:white}

/* ---- BACKGROUND ---- */
.bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at 15% 40%,rgba(100,30,180,.35),transparent 55%),radial-gradient(ellipse at 85% 20%,rgba(30,100,200,.3),transparent 55%),radial-gradient(ellipse at 50% 85%,rgba(180,30,100,.25),transparent 55%),#07071a}
.bg-grid{position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:50px 50px}

/* ---- PARTICLES ---- */
@keyframes floatUp{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:.7}90%{opacity:.7}100%{transform:translateY(-20vh) scale(1);opacity:0}}
.pt{position:fixed;border-radius:50%;pointer-events:none;animation:floatUp linear infinite}

/* ---- INPUT SECTION ---- */
.hero{text-align:center;padding:60px 20px 50px;position:relative}
.hero h1{font-size:clamp(2.2rem,5vw,4.2rem);font-weight:900;background:linear-gradient(135deg,#ff6b9d 0%,#ffd93d 30%,#6bcb77 60%,#4d96ff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:10px;line-height:1.1}
.hero p{color:rgba(255,255,255,.55);font-size:1.05rem;margin-bottom:40px}
.input-card{max-width:460px;margin:0 auto;background:rgba(255,255,255,.04);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.1);border-radius:28px;padding:40px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(100,30,180,.2)}
label{display:block;color:rgba(255,255,255,.6);font-size:.82rem;letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px;font-weight:600}
input[type=date],input[type=time]{width:100%;padding:14px 18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:14px;color:white;font-size:1rem;margin-bottom:22px;outline:none;transition:all .3s;color-scheme:dark}
input:focus{border-color:rgba(140,50,220,.7);box-shadow:0 0 0 3px rgba(140,50,220,.15);background:rgba(255,255,255,.1)}
.hint{color:rgba(255,255,255,.35);font-size:.78rem;margin-top:-14px;margin-bottom:20px;padding-left:4px}
.btn{width:100%;padding:17px;background:linear-gradient(135deg,#7928ca,#ff0080);border:none;border-radius:14px;color:white;font-size:1.05rem;font-weight:800;cursor:pointer;transition:all .3s;letter-spacing:.5px;text-transform:uppercase;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-3px);box-shadow:0 14px 40px rgba(120,0,120,.5)}
.btn:active{transform:translateY(0)}

/* ---- RESULTS ---- */
#results{display:none;max-width:1200px;margin:0 auto;padding:30px 18px 60px}

/* ---- BIG TICKER ---- */
.ticker-wrap{text-align:center;padding:40px 30px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:28px;margin-bottom:32px;position:relative;overflow:hidden}
.ticker-wrap::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(120,0,200,.08),rgba(255,0,128,.08))}
.ticker-label{color:rgba(255,255,255,.45);font-size:.78rem;letter-spacing:3px;text-transform:uppercase;margin-bottom:14px}
.ticker-main{font-size:clamp(2rem,6vw,4.5rem);font-weight:900;background:linear-gradient(135deg,#ff6b9d,#ffd93d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-variant-numeric:tabular-nums;font-feature-settings:"tnum";line-height:1;letter-spacing:-1px}
.ticker-sub{color:rgba(255,255,255,.4);font-size:.85rem;margin-top:10px;font-variant-numeric:tabular-nums}

/* ---- CARDS ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.card{background:rgba(255,255,255,.035);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.07);border-radius:22px;padding:26px;transition:all .35s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden;animation:cardIn .5s ease both}
@keyframes cardIn{from{opacity:0;transform:translateY(28px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.card:hover{transform:translateY(-5px);border-color:rgba(255,255,255,.16);box-shadow:0 24px 50px rgba(0,0,0,.5)}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:22px 22px 0 0}
.c-p::before{background:linear-gradient(90deg,#7928ca,#ff0080)}
.c-b::before{background:linear-gradient(90deg,#0070f3,#00dfd8)}
.c-g::before{background:linear-gradient(90deg,#17c964,#5ea2ef)}
.c-o::before{background:linear-gradient(90deg,#f5a623,#f56767)}
.c-pk::before{background:linear-gradient(90deg,#ff4ecd,#a855f7)}
.c-cy::before{background:linear-gradient(90deg,#06b6d4,#3b82f6)}
.c-l::before{background:linear-gradient(90deg,#84cc16,#22c55e)}
.c-r::before{background:linear-gradient(90deg,#ef4444,#f97316)}
.c-y::before{background:linear-gradient(90deg,#eab308,#f59e0b)}
.emo{font-size:2.4rem;margin-bottom:10px;display:block}
.clabel{color:rgba(255,255,255,.42);font-size:.7rem;letter-spacing:1.8px;text-transform:uppercase;margin-bottom:7px}
.cval{font-size:1.65rem;font-weight:800;color:#fff;line-height:1.2;margin-bottom:5px;font-variant-numeric:tabular-nums}
.cdesc{color:rgba(255,255,255,.38);font-size:.8rem;line-height:1.55}

/* ---- ZODIAC WIDE ---- */
.zodiac-card{grid-column:span 2}
@media(max-width:640px){.zodiac-card{grid-column:span 1}}
.zodiac-inner{display:flex;align-items:center;gap:24px}
@media(max-width:640px){.zodiac-inner{flex-direction:column;text-align:center}}
.z-sym{font-size:5.5rem;line-height:1;flex-shrink:0}
.z-name{font-size:2.2rem;font-weight:900;color:#fff;margin-bottom:4px}
.z-dates{color:rgba(255,255,255,.45);font-size:.82rem;margin-bottom:8px;letter-spacing:.5px}
.z-traits{color:rgba(255,255,255,.65);font-size:.88rem;line-height:1.65}

/* ---- RESET ---- */
.reset{display:block;margin:36px auto 0;padding:12px 36px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;color:rgba(255,255,255,.5);cursor:pointer;font-size:.9rem;transition:all .3s}
.reset:hover{background:rgba(255,255,255,.12);color:#fff}
</style>
</head>

  </div>
</div>

<div id="results">

// ==== POPOLAZIONE ====
const POP=[[1900,1.60],[1910,1.75],[1920,1.86],[1930,2.07],[1940,2.30],
[1950,2.50],[1955,2.77],[1960,3.03],[1965,3.34],[1970,3.70],
[1975,4.07],[1980,4.43],[1985,4.83],[1990,5.31],[1995,5.72],
[2000,6.10],[2005,6.54],[2010,6.93],[2015,7.38],[2020,7.80],
[2025,8.20],[2030,8.55]];
function worldPop(y){
  for(let i=0;i<POP.length-1;i++){
    if(y>=POP[i][0]&&y<POP[i+1][0]){
      const t=(y-POP[i][0])/(POP[i+1][0]-POP[i][0]);
      return(POP[i][1]+t*(POP[i+1][1]-POP[i][1])).toFixed(2);
    }
  }
  return y<POP[0][0]?POP[0][1].toFixed(2):POP[POP.length-1][1].toFixed(2);
}

   t:'Analitico, preciso, metodico. Perfezionista con un cuore grande.'},
  {n:'Bilancia',s:'♎',e:'⚖️',sm:9,sd:23,em:10,ed:22,el:'Aria',pl:'Venere',
   t:'Diplomatico, estetico, giusto. Cerca sempre equilibrio e armonia.'},
  {n:'Scorpione',s:'♏',e:'🦂',sm:10,sd:23,em:11,ed:21,el:'Acqua',pl:'Plutone',
   t:'Intenso, perspicace, trasformativo. Vede oltre le apparenze.'},

   t:'Avventuroso, ottimista, filosofo. Ama esplorare mondi nuovi.'},
];
function getZodiac(m,d){
  for(const z of ZODIAC){
    if(z.sm===12&&z.em===1){if((m===12&&d>=z.sd)||(m===1&&d<=z.ed))return z;}
    else{if((m===z.sm&&d>=z.sd)||(m===z.em&&d<=z.ed))return z;}
  }
  return ZODIAC[0];
}

// ==== ZODIACO CINESE ====
const CHZ=['Topo 🐀','Bue 🐂','Tigre 🐯','Coniglio 🐇','Drago 🐉','Serpente 🐍',
'Cavallo 🐴','Capra 🐐','Scimmia 🐒','Gallo 🐓','Cane 🐕','Maiale 🐷'];
function getChinese(y){return CHZ[((y-1900)%12+12)%12];}

// ==== FASE LUNARE ====
function moonPhase(date){
  const y=date.getFullYear(),m=date.getMonth()+1,d=date.getDate();
  let yr=y,mo=m;
  if(mo<3){yr--;mo+=12;}
  const a=Math.floor(yr/100),b=2-a+Math.floor(a/4);
  const jd=Math.floor(365.25*(yr+4716))+Math.floor(30.6001*(mo+1))+d+b-1524.5;
  const ph=((jd-2451550.1)%29.530588+29.530588)%29.530588;
  const ps=[['🌑','Luna Nuova',0,1.85],['🌒','Crescente',1.85,7.38],
    ['🌓','Primo Quarto',7.38,11.08],['🌔','Gibbosa Crescente',11.08,14.77],
    ['🌕','Luna Piena',14.77,18.46],['🌖','Gibbosa Calante',18.46,22.15],
    ['🌗','Ultimo Quarto',22.15,25.85],['🌘','Calante',25.85,29.53]];
  for(const p of ps)if(ph>=p[2]&&ph<p[3])return{e:p[0],n:p[1]};
  return{e:'🌑',n:'Luna Nuova'};
}

// ==== STAGIONE ====
function getSeason(m,d){
  if((m===3&&d>=20)||m===4||m===5||(m===6&&d<21))return{e:'🌸',n:'Primavera'};
  if((m===6&&d>=21)||m===7||m===8||(m===9&&d<23))return{e:'☀️',n:'Estate'};
  if((m===9&&d>=23)||m===10||m===11||(m===12&&d<21))return{e:'🍂',n:'Autunno'};
  return{e:'❄️',n:'Inverno'};
}

// ==== UTILS ====
const DAYS=['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
const MONTHS=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno',
'Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
function fmt(n){return Math.floor(n).toLocaleString('it-IT');}
function pad(n){return String(n).padStart(2,'0');}

// ==== STATE ====
let birthDT=null,liveTimer=null;

// ==== PARTICLES ====
function spawnParticles(){
  const colors=['#ff6b9d','#ffd93d','#6bcb77','#4d96ff','#c77dff','#ff9f1c','#00dfd8'];
  for(let i=0;i<35;i++){
    const p=document.createElement('div');
    p.className='pt';
    const sz=Math.random()*4+2;
    Object.assign(p.style,{
      width:sz+'px',height:sz+'px',
      background:colors[Math.floor(Math.random()*colors.length)],
      left:Math.random()*100+'vw',
      animationDuration:(Math.random()*18+14)+'s',
      animationDelay:(Math.random()*-25)+'s',
      opacity:.55
    });
    document.body.appendChild(p);
  }
}

// ==== LIVE TICKER ====
function tick(){
  if(!birthDT)return;
  const now=new Date(),ms=now-birthDT;
  const sec=Math.floor(ms/1000),min=Math.floor(ms/60000),hr=Math.floor(ms/3600000);
  const days=Math.floor(ms/86400000);
  const y=Math.floor(days/365.25),rd=Math.floor(days-y*365.25);
  const rh=Math.floor((ms%86400000)/3600000);
  const rm=Math.floor((ms%3600000)/60000);
  const rs=Math.floor((ms%60000)/1000);
  document.getElementById('tickerMain').textContent=
    `${y}a ${rd}g ${pad(rh)}:${pad(rm)}:${pad(rs)}`;
  document.getElementById('tickerSub').textContent=
    `${fmt(sec)} secondi  •  ${fmt(min)} minuti  •  ${fmt(hr)} ore`;
  const el=id=>{const e=document.getElementById(id);return e;};
  const upd=(id,val)=>{const e=el(id);if(e)e.textContent=fmt(val);};
  upd('lv-sec',sec);
  upd('lv-hb',sec*70/60);    // ~70 bpm
  upd('lv-br',sec*16/60);    // ~16 breaths/min
  upd('lv-blinks',sec*(16/24)*15/60); // ~15 blinks/min when awake
}
