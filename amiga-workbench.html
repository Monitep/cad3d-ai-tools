/* ========================= RENDER ============================ */
function gatherTris(){
  const tris=[],lights=[];
  let cam=null;
  for(const o of scene.objs){
    if(o.kind==='camera'){cam=o;continue;}
    if(o.kind==='light'){lights.push({pos:[...o.pos],i:o.intensity/255});continue;}
    if(o.kind!=='mesh')continue;
    const wv=worldVerts(o);
    for(const f of o.faces){
      for(let k=1;k<f.length-1;k++){
        const a=wv[f[0]],b=wv[f[k]],c=wv[f[k+1]];
        if(!a||!b||!c)continue;
        const e1=vsub(b,a),e2=vsub(c,a);
        const n=vnorm(vcross(e1,e2));
        tris.push({a,e1,e2,n,col:o.color,spec:o.spec/255,refl:o.refl/255});
      }
    }
  }
  if(!lights.length)lights.push({pos:[400,-500,600],i:1});
  return{tris,lights,cam};
}
function hitTri(t,ro,rd,tmin,tmax){
  const p=vcross(rd,t.e2);
  const det=vdot(t.e1,p);
  if(Math.abs(det)<1e-8)return-1;
  const inv=1/det;
  const s=vsub(ro,t.a);
  const u=vdot(s,p)*inv;
  if(u<0||u>1)return-1;
  const q=vcross(s,t.e1);
  const v=vdot(rd,q)*inv;
  if(v<0||u+v>1)return-1;
  const d=vdot(t.e2,q)*inv;
  return(d>tmin&&d<tmax)?d:-1;
}
function shade(tris,lights,hit,pnt,rd,depth){
  const t=tris[hit];
  let n=t.n;
  if(vdot(n,rd)>0)n=vscale(n,-1);
  let r=0.13*t.col[0],g=0.13*t.col[1],b=0.13*t.col[2];
  for(const L of lights){
    const ld=vsub(L.pos,pnt),dist=vlen(ld),l=vscale(ld,1/dist);
    const ro=vadd(pnt,vscale(n,0.5));
    let sh=1;
    for(let k=0;k<tris.length;k++)if(hitTri(tris[k],ro,l,0.01,dist)>0){sh=0;break;}
    if(!sh)continue;
    const nl=Math.max(0,vdot(n,l))*L.i;
    r+=t.col[0]*nl;g+=t.col[1]*nl;b+=t.col[2]*nl;
    if(t.spec>0){
      const h=vnorm(vsub(l,rd));
      const sp=Math.pow(Math.max(0,vdot(n,h)),30)*t.spec*255*L.i;
      r+=sp;g+=sp;b+=sp;
    }
  }
  if(t.refl>0&&depth<2){
    const rr=vsub(rd,vscale(n,2*vdot(rd,n)));
    const ro=vadd(pnt,vscale(n,0.5));
    let bh=-1,bd=1e30;
    for(let k=0;k<tris.length;k++){const d=hitTri(tris[k],ro,rr,0.05,bd);if(d>0){bd=d;bh=k;}}
    let rc=[10,10,30];
    if(bh>=0)rc=shade(tris,lights,bh,vadd(ro,vscale(rr,bd)),rr,depth+1);
    r=r*(1-t.refl)+rc[0]*t.refl;g=g*(1-t.refl)+rc[1]*t.refl;b=b*(1-t.refl)+rc[2]*t.refl;
  }
  return[Math.min(255,r),Math.min(255,g),Math.min(255,b)];
}
function renderTrace(W=160,H=128){
  const t0=performance.now();
  openRender(W,H,'Trace '+W+'x'+H);
  const{tris,lights,cam}=gatherTris();
  const{P,F,R,U}=camBasisOf(cam);
  const tan=0.55,asp=W/H;
  const ctx=els.rcv.getContext('2d');
  const img=ctx.createImageData(W,1);
  let y=0;
  cancelRender();
  function row(){
    if(!visible||!els.rwin.classList.contains('on'))return;
    const d=img.data;
    for(let x=0;x<W;x++){
      const sx=(x/W*2-1)*tan*asp,sy=(1-y/H*2)*tan;
      const rd=vnorm(vadd(F,vadd(vscale(R,sx),vscale(U,sy))));
      let bh=-1,bd=1e30;
      for(let k=0;k<tris.length;k++){const dd=hitTri(tris[k],P,rd,0.1,bd);if(dd>0){bd=dd;bh=k;}}
      let c;
      if(bh<0){const tt=y/H;c=[8+20*tt,10+16*tt,40+30*tt];}
      else c=shade(tris,lights,bh,vadd(P,vscale(rd,bd)),rd,0);
      const k=x*4;d[k]=c[0];d[k+1]=c[1];d[k+2]=c[2];d[k+3]=255;
    }
    ctx.putImageData(img,0,y);y++;
    els.rtitle.textContent=`IMAGINE  Trace ${W}x${H}  ${tris.length} faces  line ${y}/${H}`;
    if(y<H)renderJob=setTimeout(row,0);
    else els.rtitle.textContent=`IMAGINE  Trace ${W}x${H}  ${tris.length} faces  DONE in ${((performance.now()-t0)/1000).toFixed(2)} s`;
  }
  row();
}
function renderScan(W=320,H=256){
  const t0=performance.now();
  openRender(W,H,'Scanline '+W+'x'+H);
  const{tris,lights,cam}=gatherTris();
  const{P,F,R,U}=camBasisOf(cam);
  const ctx=els.rcv.getContext('2d');
  const img=ctx.createImageData(W,H);
  const d=img.data,zb=new Float32Array(W*H).fill(1e30);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const k=(y*W+x)*4,tt=y/H;
    d[k]=8+20*tt;d[k+1]=10+16*tt;d[k+2]=40+30*tt;d[k+3]=255;}
  const asp=W/H,cx=W/2,cy=H/2;
  const fx=(W/2)/(0.55*asp),fy=(H/2)/0.55;
  function proj(v){
    const rel=vsub(v,P),z=vdot(rel,F);
    if(z<5)return null;
    return{x:cx+vdot(rel,R)/z*fx,y:cy-vdot(rel,U)/z*fy,z};
  }
  for(const t of tris){
    const A=proj(t.a),B=proj(vadd(t.a,t.e1)),C=proj(vadd(t.a,t.e2));
    if(!A||!B||!C)continue;
    const ctr=vadd(t.a,vscale(vadd(t.e1,t.e2),1/3));
    let n=t.n;
    const vd=vnorm(vsub(ctr,P));
    if(vdot(n,vd)>0)n=vscale(n,-1);
    let r=0.15*t.col[0],g=0.15*t.col[1],b=0.15*t.col[2];
    for(const L of lights){
      const l=vnorm(vsub(L.pos,ctr));
      const nl=Math.max(0,vdot(n,l))*L.i;
      r+=t.col[0]*nl;g+=t.col[1]*nl;b+=t.col[2]*nl;
      if(t.spec>0){
        const h=vnorm(vsub(l,vd));
        const sp=Math.pow(Math.max(0,vdot(n,h)),30)*t.spec*255*L.i;
        r+=sp;g+=sp;b+=sp;}
    }
    r=Math.min(255,r);g=Math.min(255,g);b=Math.min(255,b);
    const minx=Math.max(0,Math.floor(Math.min(A.x,B.x,C.x)));
    const maxx=Math.min(W-1,Math.ceil(Math.max(A.x,B.x,C.x)));
    const miny=Math.max(0,Math.floor(Math.min(A.y,B.y,C.y)));
    const maxy=Math.min(H-1,Math.ceil(Math.max(A.y,B.y,C.y)));
    const area=(B.x-A.x)*(C.y-A.y)-(B.y-A.y)*(C.x-A.x);
    if(Math.abs(area)<1e-6)continue;
    const ia=1/area;
    for(let y=miny;y<=maxy;y++)for(let x=minx;x<=maxx;x++){
      const w0=((B.x-A.x)*(y-A.y)-(B.y-A.y)*(x-A.x))*ia;
      const w1=((C.x-B.x)*(y-B.y)-(C.y-B.y)*(x-B.x))*ia;
      const w2=1-w0-w1;
      if(w0<0||w1<0||w2<0)continue;
      const z=1/(w2/A.z+w1/B.z+w0/C.z);
      const idx=y*W+x;
      if(z<zb[idx]){zb[idx]=z;const k=idx*4;d[k]=r;d[k+1]=g;d[k+2]=b;}
    }
  }
  ctx.putImageData(img,0,0);
  els.rtitle.textContent=`IMAGINE  Scanline ${W}x${H}  ${tris.length} faces  DONE in ${((performance.now()-t0)/1000).toFixed(2)} s`;
}

function openRender(w,h,label){
  els.rcv.width=w;els.rcv.height=h;

  els.rcv.style.width=Math.round(w*sc)+'px';
  els.rcv.style.height=Math.round(h*sc)+'px';

  els.rcv.style.top=Math.round(20+(CH-h*sc)/2)+'px';

  els.rwin.classList.add('on');
}

function buildTimeline(){
  if(!els.tl)return;
  const F=scene.frames;
  let h=`<div class="tlhead"><div class="tlname">OBJECT</div><div class="tlbars">`;
  for(let f=1;f<=F;f+=5)h+=`<span style="left:${(f-1)/F*100}%">${f}</span>`;
  h+=`</div></div>`;
  scene.objs.forEach(o=>{
    h+=`<div class="tlrow" data-id="${o.id}"><div class="tlname">${o.name}</div><div class="tlbars">`;
    if(o.keys&&o.keys.length){
      const a=o.keys[0].f,b=o.keys[o.keys.length-1].f;
      h+=`<i class="tlspan" style="left:${(a-1)/F*100}%;width:${(b-a)/F*100}%"></i>`;
      o.keys.forEach(k=>h+=`<i class="tlkey" style="left:${(k.f-1)/F*100}%" data-f="${k.f}"></i>`);
    }
    h+=`</div></div>`;
  });
  h+=`<div class="tlcursor"></div>`;
  els.tl.innerHTML=h;
  markTimeline();
}
function markTimeline(){
  if(!els.tl)return;
  const c=els.tl.querySelector('.tlcursor');
  if(c)c.style.left=`calc(120px + ${(curFrame-1)/scene.frames*100}% - ${120*(curFrame-1)/scene.frames}px)`;
}

function makeCycle(){
  const o=selObjs[0];if(!o)return;
  pushUndo();
  const t=els.scr.querySelector('#imcyctype').value;
  const F=scene.frames,N=8;
  o.keys=[];
  const p0=[...o.pos],s0=[...o.scl],r0=[...o.rot];
  for(let i=0;i<=N;i++){
    const f=Math.round(1+(F-1)*i/N),t01=i/N;
    let pos=[...p0],rot=[...r0],scl=[...s0];
    if(t==='spinz')rot=[r0[0],r0[1],r0[2]+2*Math.PI*t01];
    if(t==='spinx')rot=[r0[0]+2*Math.PI*t01,r0[1],r0[2]];
    if(t==='bob')pos=[p0[0],p0[1],p0[2]+60*Math.sin(2*Math.PI*t01)];
    if(t==='orbit'){
      const R=Math.hypot(p0[0],p0[1])||150,a0=Math.atan2(p0[1],p0[0]);
      const a=a0+2*Math.PI*t01;
      pos=[R*Math.cos(a),R*Math.sin(a),p0[2]];
      rot=[r0[0],r0[1],r0[2]+2*Math.PI*t01];
    }
    if(t==='pulse'){const s=1+0.35*Math.sin(2*Math.PI*t01);scl=[s0[0]*s,s0[1]*s,s0[2]*s];}
    o.keys.push({f,pos,rot,scl});
  }
  buildTimeline();
  setEditor('action');
}
function action(a){
  if(!a)return;
  if(a.indexOf('scan:')===0){const p=a.split(':');setEditor('detail');renderScan(+p[1],+p[2]);return;}
  if(a.indexOf('trace:')===0){const p=a.split(':');setEditor('detail');renderTrace(+p[1],+p[2]);return;}
  if(a==='attr')openAttrs();
  if(a==='trans')openTransform();
  if(a==='join')joinObjs();
  if(a==='dup')dupObj();
  if(a==='del')delObj();
  if(a==='pickall'){selObjs=scene.objs.slice();syncStatus();}
  if(a==='dropall'){selObjs=[];clearSub();syncStatus();}
  if(a==='undo')undo();
  if(a==='cen'){if(selObjs.length){pushUndo();selObjs.forEach(o=>o.pos=[0,0,0]);}}
  if(a==='rst'){if(selObjs.length){pushUndo();selObjs.forEach(o=>{o.rot=[0,0,0];o.scl=[1,1,1];});}}
  if(a==='extrude')moldExtrude();
  if(a==='spin')moldSpin();
  if(a==='replicate')moldReplicate();
  if(a==='taper')moldTaper();
  if(a==='twist')moldTwist();
  if(a==='bend')moldBend();
  if(a==='sheer')moldSheer();
  if(a==='quad')singleView=singleView>=0?-1:0;
  if(a==='zin')VIEWS.forEach(v=>{if(!v.persp)v.zoom=Math.min(12,v.zoom*1.25);});
  if(a==='zout')VIEWS.forEach(v=>{if(!v.persp)v.zoom=Math.max(0.05,v.zoom/1.25);});
  if(a==='vrst'){VIEWS.forEach(v=>{v.zoom=v.persp?1:0.7;v.ox=0;v.oy=0;});
    orbit={th:-0.65,ph:0.42,dist:900,pf:520};singleView=-1;}
  if(a==='snap'){snap=!snap;syncStatus();}
  if(a==='keys')els.keys.classList.toggle('on');
  if(a==='makeform')formsMakeObject();
  if(a==='pnew'){pushUndo();scene={objs:[],seq:1,frames:60};selObjs=[];demoScene();setEditor('detail');buildTimeline();}
  if(a==='pload')els.file.click();
  if(a==='psave'){
    const link=document.createElement('a');
    link.download='imagine-project.json';
    link.href='data:application/json,'+encodeURIComponent(JSON.stringify(scene));
    link.click();}
}
function demoScene(){
  const s=addObj('Sphere');s.pos=[-80,40,60];s.color=[210,60,60];s.spec=200;s.refl=90;
  const b=addObj('Box');b.pos=[90,-30,50];b.rot=[0,0,0.5];b.color=[60,120,220];
  const t=addObj('Torus');t.pos=[10,110,30];t.rot=[0.8,0,0];t.color=[220,170,50];
  const p=addObj('Plane');p.scl=[3.2,3.2,1];p.pos=[0,0,-20];p.color=[150,150,160];p.refl=40;
  addObj('Light');
  addObj('Camera');
  selObjs=[];undoStk.length=0;syncStatus();
}
function show(){
  build();visible=true;
  els.scr.classList.add('on');
  if(!memTaken){chewMem(214800);memTaken=true;}
  startLoop();
}
function hide(){
  visible=false;cancelRender();
  if(playing){clearInterval(playing);playing=null;}
  els.scr.classList.remove('on');
}
try{const m=parseInt(localStorage.getItem('im_mode'));if(!isNaN(m)&&IMMODES[m])imMode=m;}catch(e){}
return{show,hide,makeForm:formsMakeObject};
})();
function openImagine(){IM.show();}


/* =====================================================================
   BOOT: Kickstart -> Workbench
   ===================================================================== */
const kick=document.getElementById('kick');
function boot(){
  kick.classList.add('off');
  try{
    const sm=parseInt(localStorage.getItem('wb_screenmode'));
    if(!isNaN(sm)&&SMODES[sm]&&sm!==smCur)setScreenMode(sm);
  }catch(err){}
  updMem();
  buildDesktop();
  /* apri il disco Workbench come al primo avvio */
  setTimeout(openWBDisk,450);
}
kick.addEventListener('pointerdown',boot);
setTimeout(()=>{ if(!kick.classList.contains('off')) boot(); },4000);
</script>
