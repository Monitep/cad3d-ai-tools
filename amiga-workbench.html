<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Amiga 500 Workbench 1.3</title>
<style>
:root{
  --c0:#0055AA; /* blue  */
  --c1:#FFFFFF; /* white */
  --c2:#000020; /* black */
  --c3:#FF8800; /* orange*/
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#111;touch-action:manipulation}
body{font-family:'Courier New',Courier,monospace;-webkit-font-smoothing:none;font-smooth:never}

/* ============ MONITOR / SCALING ============ */
#monitor{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:
 radial-gradient(ellipse at center,#1a1a1a 0%,#050505 100%)}
#screen{position:relative;width:640px;height:512px;background:var(--c0);overflow:hidden;
 transform-origin:center center;
 cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16'><path d='M1 0 L13 5 L8 7 L12 14 L9 15 L6 9 L2 12 Z' fill='%23DD2222' stroke='%23000020' stroke-width='1'/></svg>") 1 0, auto;
 box-shadow:0 0 60px rgba(0,60,150,.35)}
#screen::after{ /* subtle scanlines */
 content:"";position:absolute;inset:0;pointer-events:none;z-index:9000;
 background:repeating-linear-gradient(to bottom,rgba(0,0,0,.10) 0 1px,transparent 1px 2px)}

/* ============ SCREEN TITLE BAR ============ */
#sbar{position:absolute;top:0;left:0;right:0;height:20px;background:var(--c1);color:var(--c2);
 display:flex;align-items:center;z-index:5000;border-bottom:1px solid var(--c2);user-select:none}
#sbar .stitle{flex:1;font:bold 15px 'Courier New',monospace;padding-left:6px;white-space:nowrap;overflow:hidden;letter-spacing:0}
#sbar .sgad{width:24px;height:100%;border-left:2px solid var(--c2);display:flex;align-items:center;justify-content:center;cursor:pointer}
#sbar .sgad:active{background:var(--c3)}

/* ============ MENU BAR ============ */
#menubar{position:absolute;top:0;left:0;right:0;height:20px;background:var(--c1);color:var(--c2);
 display:none;z-index:6000;border-bottom:1px solid var(--c2);user-select:none;font:bold 15px 'Courier New',monospace}
#menubar.on{display:flex}
.menu{position:relative;padding:0 12px;height:100%;display:flex;align-items:center;cursor:pointer}
.menu.open,.menu:hover{background:var(--c2);color:var(--c1)}
.mdrop{position:absolute;top:20px;left:0;min-width:170px;background:var(--c1);color:var(--c2);
 border:1px solid var(--c2);display:none;z-index:6001}
.menu.open .mdrop{display:block}
.mitem{padding:2px 10px;white-space:nowrap;font:bold 15px 'Courier New',monospace}
.mitem:hover{background:var(--c2);color:var(--c1)}
.mitem.ghost{color:var(--c2);opacity:.45;background-image:repeating-linear-gradient(45deg,transparent 0 2px,rgba(255,255,255,.7) 2px 4px)}
.mitem.ghost:hover{background:var(--c1);color:var(--c2);cursor:default}

/* ============ DESKTOP + ICONS ============ */
#desktop{position:absolute;top:20px;left:0;right:0;bottom:0}
.icon{position:absolute;width:80px;text-align:center;cursor:pointer;user-select:none;z-index:10}
.icon svg{display:block;margin:0 auto;image-rendering:pixelated}
.icon .lbl{margin-top:2px;font:bold 13px 'Courier New',monospace;color:var(--c1);white-space:nowrap}
.win .icon{position:relative;display:inline-block;vertical-align:top;margin:8px 4px}
.win .icon .lbl{color:var(--c2)}
.icon.sel svg{filter:invert(1) hue-rotate(180deg)}
.icon.sel .lbl{background:var(--c2);color:var(--c3)}
.win .icon.sel .lbl{background:var(--c2);color:var(--c3)}

/* ============ WINDOWS ============ */
.win{position:absolute;background:var(--c1);border:2px solid var(--c0);z-index:100;
 display:flex;flex-direction:column;min-width:120px;min-height:80px}
.win.active{border-color:var(--c0)}
.tbar{height:20px;background:var(--c0);color:var(--c1);display:flex;align-items:stretch;
 user-select:none;cursor:move;flex:none}
.win:not(.active) .tbar{background:var(--c1);color:var(--c2);
 background-image:repeating-linear-gradient(to bottom,var(--c0) 0 1px,transparent 1px 4px)}
.win:not(.active) .tbar .ttl{background:var(--c1)}
.tgad{width:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.tgad:active{background:var(--c3)}
.tgad.cl{border-right:2px solid var(--c1)}
.tgad.dep{border-left:2px solid var(--c1)}
.win:not(.active) .tgad.cl{border-right-color:var(--c0)}
.win:not(.active) .tgad.dep{border-left-color:var(--c0)}
.ttl{flex:1;font:bold 15px 'Courier New',monospace;padding:0 6px;display:flex;align-items:center;
 white-space:nowrap;overflow:hidden}
.wbody{flex:1;overflow:auto;position:relative;background:var(--c1)}
.wbody.bluebody{background:var(--c0)}
.sizegad{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;z-index:50;
 background:var(--c0);display:flex;align-items:center;justify-content:center}

/* ============ SHELL ============ */
.shell{background:var(--c0);color:var(--c1);font:bold 14px 'Courier New',monospace;
 padding:4px 6px;height:100%;overflow-y:auto;cursor:text;line-height:16px}
.shell .cline{white-space:pre-wrap;word-break:break-all}
.shell input{background:transparent;border:0;outline:0;color:var(--c1);
 font:bold 14px 'Courier New',monospace;width:70%;caret-color:var(--c3)}
.cursorblk{display:inline-block;width:8px;height:14px;background:var(--c3);animation:blink 1s steps(1) infinite;vertical-align:text-bottom}
@keyframes blink{50%{opacity:0}}

/* ============ CALCULATOR ============ */
.calc{padding:8px;background:var(--c0);height:100%;display:flex;flex-direction:column;gap:8px}
.cdisp{background:var(--c2);color:var(--c3);font:bold 20px 'Courier New',monospace;
 text-align:right;padding:4px 8px;border:2px solid var(--c1);
 overflow:hidden;white-space:nowrap;height:34px;flex:none}
.cgrid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(5,1fr);gap:6px;min-height:0}
.cbtn{background:var(--c1);color:var(--c2);border:2px solid var(--c2);
 font:bold 16px 'Courier New',monospace;min-height:22px;cursor:pointer;user-select:none;
 box-shadow:2px 2px 0 var(--c2)}
.cbtn:active{background:var(--c3);transform:translate(1px,1px);box-shadow:1px 1px 0 var(--c2)}

/* ============ CLOCK ============ */
.clockbody{background:var(--c0);height:100%;display:flex;align-items:center;justify-content:center}
.clockbody canvas{image-rendering:auto}

/* ============ REQUESTER ============ */
.reqbody{background:var(--c0);color:var(--c1);padding:14px 12px 12px;height:100%;
 display:flex;flex-direction:column;gap:14px}
.reqtxt{font:bold 14px 'Courier New',monospace;white-space:pre-wrap;flex:1;line-height:18px}
.reqbtns{display:flex;gap:12px}
.reqbtn{border:2px solid var(--c1);color:var(--c1);background:var(--c0);padding:3px 14px;
 font:bold 14px 'Courier New',monospace;cursor:pointer}
.reqbtn:active{background:var(--c3);color:var(--c2)}

/* ============ PREFS ============ */
.prefs{background:var(--c0);height:100%;padding:10px;color:var(--c1);font:bold 13px 'Courier New',monospace}
.swrow{display:flex;gap:8px;margin-bottom:10px}
.swatch{width:44px;height:26px;border:2px solid var(--c1);cursor:pointer}
.swatch.cur{border-color:var(--c3);outline:2px solid var(--c3)}
.slrow{display:flex;align-items:center;gap:8px;margin:6px 0}
.slrow label{width:14px}
.slrow input[type=range]{flex:1;accent-color:var(--c3);height:16px}
.slrow .v{width:24px;text-align:right}
.prefbtns{display:flex;gap:10px;margin-top:12px}

/* ============ SAY ============ */
.saybody{background:var(--c0);height:100%;padding:12px;display:flex;flex-direction:column;gap:10px}
.saybody input{background:var(--c1);color:var(--c2);border:2px solid var(--c2);
 font:bold 14px 'Courier New',monospace;padding:4px 6px;width:100%}

/* ============ MORE (text viewer) ============ */
.morebody{background:var(--c1);color:var(--c2);font:bold 13px 'Courier New',monospace;
 padding:8px 10px;height:100%;overflow-y:auto;white-space:pre-wrap;line-height:17px}

/* ============ KICKSTART ============ */
#kick{position:absolute;inset:0;background:#fff;z-index:9500;display:flex;
 align-items:center;justify-content:center;cursor:pointer}
#kick.off{display:none}

/* ============ GURU ============ */
#guru{position:absolute;top:0;left:0;right:0;background:#000;color:#f00;z-index:9800;
 font:bold 15px 'Courier New',monospace;text-align:center;padding:10px 8px;display:none;cursor:pointer}
#guru.on{display:block}
#guru .box{border:4px solid #f00;padding:8px 4px;animation:gblink 1.4s steps(1) infinite}
@keyframes gblink{50%{border-color:#000}}

/* ============ DELUXE PAINT ============ */
#dpscreen{position:absolute;inset:0;z-index:8000;display:none;background:#000;overflow:hidden}
#dpscreen.on{display:block}
#dpcv{position:absolute;left:0;top:0;width:640px;height:512px;image-rendering:pixelated;
 cursor:crosshair;touch-action:none}
#dpbar{position:absolute;top:0;left:0;right:0;height:20px;background:#AAAAAA;color:#000;
 display:flex;align-items:center;user-select:none;border-bottom:2px solid #000;z-index:10}
#dpbar .t{flex:1;font:bold 14px 'Courier New',monospace;padding-left:6px;white-space:nowrap}
#dpbar .g{width:26px;height:100%;border-left:2px solid #000;display:flex;align-items:center;
 justify-content:center;cursor:pointer}
#dpbar .g:active{background:var(--c3)}
#dpmenu{position:absolute;top:0;left:0;right:0;height:20px;background:#fff;color:#000;
 display:none;z-index:40;border-bottom:2px solid #000;font:bold 14px 'Courier New',monospace}
#dpmenu.on{display:flex}
#dpmenu .menu.open,#dpmenu .menu:hover{background:#000;color:#fff}
#dpmenu .mdrop{background:#fff;color:#000;border-color:#000}
#dpmenu .mitem:hover{background:#000;color:#fff}
#dptools{position:absolute;right:0;top:20px;width:78px;background:#AAAAAA;
 border:2px solid #000;border-right:0;padding:3px 2px;z-index:20;user-select:none}
#dptools.hid{display:none}
.dpt.dpmini{font:bold 9px 'Courier New',monospace;height:18px;letter-spacing:0}
.dpbrow{display:flex;justify-content:space-between;margin-bottom:3px;background:#888;
 border:1px solid #000;padding:1px}
.dpb{width:8px;height:14px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.dpb.on{background:var(--c3)}
.dprow{display:flex;gap:2px;margin-bottom:2px}
.dpt{flex:1;height:26px;background:#AAAAAA;border:1px solid #000;display:flex;align-items:center;
 justify-content:center;cursor:pointer;position:relative}
.dpt:active{background:#888}
.dpt.on{background:var(--c3)}
.dpt svg{pointer-events:none}
.dpfgbg{height:26px;border:1px solid #000;margin:3px 0;position:relative;background:#888}
.dpfgbg .bgc{position:absolute;inset:2px}
.dpfgbg .fgc{position:absolute;left:22%;top:5px;right:22%;bottom:5px;border:1px solid #000}
.dpal{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid #000}
.dpal div{height:11px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35);cursor:pointer}
#dppanel{position:absolute;left:200px;top:150px;width:240px;background:#AAAAAA;border:2px solid #000;
 z-index:60;display:none;padding:8px;font:bold 13px 'Courier New',monospace;color:#000}
#dppanel.on{display:block}
#dppanel .slrow input[type=range]{accent-color:var(--c3)}
#dppanel .psw{width:60px;height:22px;border:2px solid #000;margin-bottom:6px}
#dppanel .reqbtn{border-color:#000;color:#000;background:#AAAAAA}
#dpabout{position:absolute;left:150px;top:170px;width:340px;background:#AAAAAA;border:2px solid #000;
 z-index:60;display:none;padding:12px;font:bold 13px 'Courier New',monospace;color:#000;
 white-space:pre-wrap;line-height:17px;cursor:pointer}
#dpabout.on{display:block}

/* ============ IMAGINE 3D ============ */
#imscreen{position:absolute;inset:0;z-index:8000;display:none;background:#000;overflow:hidden}
#imscreen.on{display:block}
#imbar{position:absolute;top:0;left:0;right:0;height:20px;background:#111;color:#FFAA33;
 display:flex;align-items:stretch;user-select:none;border-bottom:2px solid #FFAA33;z-index:30;
 font:bold 13px 'Courier New',monospace}
#imbar .imtab{padding:0 10px;display:flex;align-items:center;cursor:pointer;border-right:1px solid #553300}
#imbar .imtab.on{background:#FFAA33;color:#000}
#imbar .immenu{position:relative;padding:0 10px;display:flex;align-items:center;cursor:pointer}
#imbar .immenu.open{background:#FFAA33;color:#000}
#imbar .imdrop{position:absolute;top:20px;left:0;min-width:180px;background:#111;color:#FFAA33;
 border:1px solid #FFAA33;display:none;z-index:31}
#imbar .immenu.open .imdrop{display:block}
#imbar .imit{padding:3px 10px;white-space:nowrap;font:bold 13px 'Courier New',monospace}
#imbar .imit:hover{background:#FFAA33;color:#000}
#imbar .g{margin-left:auto;width:26px;border-left:1px solid #553300;display:flex;
 align-items:center;justify-content:center;cursor:pointer}
#imbar .g:active{background:#FFAA33}
#imcv{position:absolute;left:0;top:20px;width:640px;height:470px;touch-action:none;cursor:crosshair}
#imstatus{position:absolute;left:0;right:0;bottom:0;height:22px;background:#111;color:#FFAA33;
 border-top:2px solid #FFAA33;display:flex;align-items:center;gap:8px;padding:0 6px;
 font:bold 12px 'Courier New',monospace;user-select:none;z-index:30}
#imstatus .ax{border:1px solid #FFAA33;padding:0 5px;cursor:pointer}
#imstatus .ax.on{background:#FFAA33;color:#000}
#imstatus .sp{flex:1}
#improj{position:absolute;left:0;top:20px;right:0;bottom:22px;background:#000;color:#FFAA33;
 display:none;padding:26px;font:bold 14px 'Courier New',monospace;z-index:20}
#improj.on{display:block}
#improj h1{font:bold 22px 'Courier New',monospace;letter-spacing:2px;margin-bottom:6px}
#improj .sub{color:#996611;margin-bottom:22px}
#improj .pbtn{display:block;width:280px;background:#111;border:2px solid #FFAA33;color:#FFAA33;
 font:bold 14px 'Courier New',monospace;padding:7px 10px;margin-bottom:9px;cursor:pointer;text-align:left}
#improj .pbtn:active{background:#FFAA33;color:#000}
#impanel{position:absolute;left:170px;top:120px;width:300px;background:#111;border:2px solid #FFAA33;
 color:#FFAA33;z-index:60;display:none;padding:10px;font:bold 13px 'Courier New',monospace}
#impanel.on{display:block}
#impanel input[type=text]{background:#000;border:1px solid #FFAA33;color:#FFAA33;
 font:bold 13px 'Courier New',monospace;padding:2px 5px;width:150px}
#impanel .slrow{display:flex;align-items:center;gap:6px;margin:5px 0}
#impanel .slrow label{width:44px}
#impanel input[type=range]{flex:1;accent-color:#FFAA33}
#impanel .v{width:28px;text-align:right}
#impanel .psw{width:60px;height:18px;border:1px solid #FFAA33;display:inline-block;vertical-align:middle}
#impanel .reqbtn{border-color:#FFAA33;color:#FFAA33;background:#111;margin-top:8px}
#impanel .reqbtn:active{background:#FFAA33;color:#000}
#imrender{position:absolute;left:0;top:0;width:640px;height:512px;background:#000;z-index:70;display:none}
#imrender.on{display:block}
#imrender canvas{position:absolute;image-rendering:pixelated}
#imcv{width:auto;height:auto}
#imbar{flex-wrap:nowrap;overflow:hidden}
.smrow2{padding:3px 8px;border:1px solid #553300;margin-bottom:3px;cursor:pointer;
 font:bold 13px 'Courier New',monospace}
.smrow2.on{background:#FFAA33;color:#000}
#improj input{background:#000;border:1px solid #FFAA33;color:#FFAA33;
 font:bold 13px 'Courier New',monospace;padding:2px 4px}
#imaction,#imcycle{position:absolute;left:0;top:20px;right:0;bottom:22px;background:#000;
 color:#FFAA33;display:none;padding:10px;font:bold 13px 'Courier New',monospace;z-index:20;
 overflow:auto}
#imaction.on,#imcycle.on{display:block}
#imaction .tlbar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
#imaction .reqbtn,#imcycle .reqbtn{border-color:#FFAA33;color:#FFAA33;background:#111;
 padding:2px 10px;font:bold 12px 'Courier New',monospace;cursor:pointer}
#imaction .reqbtn:active,#imcycle .reqbtn:active{background:#FFAA33;color:#000}
#imaction input[type=range]{flex:1;min-width:140px;accent-color:#FFAA33}
#imtl{position:relative;border-top:1px solid #553300}
.tlhead,.tlrow{display:flex;align-items:center;height:20px;border-bottom:1px solid #221100}
.tlrow{cursor:pointer}
.tlrow:hover{background:#181206}
.tlname{width:120px;flex:none;font:bold 12px 'Courier New',monospace;
 white-space:nowrap;overflow:hidden;color:#FFAA33}
.tlbars{position:relative;flex:1;height:100%;border-left:1px solid #553300}
.tlhead .tlbars span{position:absolute;top:4px;font:bold 10px 'Courier New';color:#996611}
.tlspan{position:absolute;top:7px;height:6px;background:#553300;display:block}
.tlkey{position:absolute;top:4px;width:6px;height:12px;background:#FFAA33;
 display:block;margin-left:-3px}
.tlcursor{position:absolute;top:0;bottom:0;width:2px;background:#f55;pointer-events:none}
#imformsbar{position:absolute;left:0;right:0;bottom:22px;height:26px;background:#111;
 border-top:1px solid #553300;display:none;align-items:center;gap:8px;padding:0 8px;z-index:25;
 font:bold 12px 'Courier New',monospace;color:#FFAA33}
#imformsbar.on{display:flex}
#imformsbar .reqbtn{border-color:#FFAA33;color:#FFAA33;background:#111;padding:1px 8px;
 font:bold 12px 'Courier New',monospace;cursor:pointer}
#imformsbar .reqbtn:active{background:#FFAA33;color:#000}
#imtrans{position:absolute;left:150px;top:130px;background:#111;border:2px solid #FFAA33;
 color:#FFAA33;z-index:60;display:none;padding:10px;font:bold 13px 'Courier New',monospace}
#imtrans.on{display:block}
#imtrans input{background:#000;border:1px solid #FFAA33;color:#FFAA33;
 font:bold 12px 'Courier New',monospace;width:64px;padding:2px 4px}
#imtrans .reqbtn{border-color:#FFAA33;color:#FFAA33;background:#111;cursor:pointer}
#imtrans .reqbtn:active{background:#FFAA33;color:#000}
.imkeys{position:absolute;left:60px;top:60px;background:#111;border:2px solid #FFAA33;
 color:#FFAA33;z-index:65;display:none;padding:14px 18px;white-space:pre;cursor:pointer;
 font:bold 13px 'Courier New',monospace;line-height:17px}
.imkeys.on{display:block}
#imstatus{flex-wrap:wrap;height:22px;overflow:hidden}
#imrender .rbar{position:absolute;top:0;left:0;right:0;height:20px;background:#111;color:#FFAA33;
 display:flex;align-items:center;padding:0 8px;font:bold 13px 'Courier New',monospace;
 border-bottom:2px solid #FFAA33}
#imrender .rfoot{position:absolute;bottom:0;left:0;right:0;height:22px;background:#111;
 border-top:2px solid #FFAA33;display:flex;gap:10px;align-items:center;padding:0 8px}
#imrender .reqbtn{border-color:#FFAA33;color:#FFAA33;background:#111;padding:1px 10px;font-size:12px}
#imrender .reqbtn:active{background:#FFAA33;color:#000}

#dpscreen.on{inset:auto;left:50%;top:50%;transform:translate(-50%,-50%);
 width:640px;height:512px;box-shadow:0 0 0 4000px #000}
#imscreen.on{inset:auto;left:50%;top:50%;transform:translate(-50%,-50%);
 box-shadow:0 0 0 6000px #000;display:block}
.smrow{font:bold 14px 'Courier New',monospace;color:var(--c2);padding:3px 8px;cursor:pointer;user-select:none}
.smrow.on{background:var(--c0);color:var(--c1)}
.smprops{font:bold 12px 'Courier New',monospace;color:var(--c2);padding:6px 8px;border-top:2px solid var(--c0)}
#imstatus .axq{border:1px solid #FFAA33;padding:0 5px;cursor:pointer}
#imstatus .axq.on{background:#FFAA33;color:#000}
/* ============ SINPLOT ============ */
.spbody{background:var(--c1);height:100%;display:flex;flex-direction:column}
.spbody canvas{flex:1;min-height:0;width:100%;display:block}
.spctl{flex:none;display:flex;align-items:center;gap:6px;padding:4px 6px;
 border-top:2px solid var(--c0);background:var(--c1);flex-wrap:wrap}
.spbtn{border:2px solid var(--c0);color:var(--c0);background:var(--c1);
 font:bold 12px 'Courier New',monospace;padding:2px 8px;cursor:pointer;user-select:none}
.spbtn:active{background:var(--c3);color:var(--c2)}
.spbtn.on{background:var(--c0);color:var(--c1)}
.sptime{font:bold 13px 'Courier New',monospace;color:var(--c2);margin-left:auto}
.spinfo{flex:none;font:bold 11px 'Courier New',monospace;color:var(--c2);
 padding:3px 6px;border-top:1px solid var(--c0);background:var(--c1);white-space:pre}
::-webkit-scrollbar{width:14px;height:14px}
::-webkit-scrollbar-track{background:var(--c1);border-left:2px solid var(--c0)}
::-webkit-scrollbar-thumb{background:var(--c0);border:2px solid var(--c1)}
</style>
</head>
<body>
<div id="monitor">
 <div id="screen">
  <!-- Screen title bar -->
  <div id="sbar">
   <div class="stitle" id="stitle">Workbench release.  837,240 free memory</div>
   <div class="sgad" title="Screen to back">

let iconSeq=0;
function makeIcon({art,label,x,y,parent,onOpen,info}){
  const el=document.createElement('div');
  el.className='icon'; el.dataset.iid=++iconSeq;
  el.innerHTML=ART[art]+`<div class="lbl">${label}</div>`;
  if(parent===desktop){el.style.left=x+'px'; el.style.top=y+'px';}
  el._info=info||`${label}\nType: ${art==='disk'?'Disk':art==='drawer'?'Drawer':'Tool'}\nStatus: read/write`;
  el._label=label;
  let lastTap=0;
  el.addEventListener('pointerdown',e=>{
    e.stopPropagation();
    if(selectedIcon) selectedIcon.classList.remove('sel');
    selectedIcon=el; el.classList.add('sel');
    const now=Date.now();
    if(now-lastTap<380){ onOpen&&onOpen(); lastTap=0; } else lastTap=now;
  });
  el.addEventListener('dblclick',e=>{e.stopPropagation(); onOpen&&onOpen();});
  el._open=onOpen;
  parent.appendChild(el);
  return el;
}

desktop.addEventListener('pointerdown',()=>{
  if(selectedIcon){selectedIcon.classList.remove('sel'); selectedIcon=null;}
});

/* =====================================================================
   WINDOW MANAGER
   ===================================================================== */
function svgGad(kind){
  if(kind==='close') return `<svg width="14" height="12" viewBox="0 0 14 12">
   <rect x="1" y="1" width="12" height="10" fill="none" stroke="currentColor" stroke-width="2"/>
   <rect x="5" y="4" width="4" height="4" fill="currentColor"/></svg>`;
  if(kind==='back') return `<svg width="16" height="12" viewBox="0 0 16 12">
   <rect x="0" y="0" width="10" height="8" fill="currentColor"/>
   <rect x="5" y="3" width="10" height="8" fill="var(--c0)" stroke="currentColor" stroke-width="1.5"/></svg>`;
  if(kind==='front') return `<svg width="16" height="12" viewBox="0 0 16 12">
   <rect x="5" y="3" width="10" height="8" fill="var(--c0)" stroke="currentColor" stroke-width="1.5"/>
   <rect x="0" y="0" width="10" height="8" fill="currentColor"/></svg>`;
  if(kind==='size') return `<svg width="14" height="14" viewBox="0 0 14 14">
   <path d="M2 12 L12 12 L12 2 Z" fill="var(--c1)" stroke="var(--c1)"/>
   <path d="M5 12 L12 12 L12 5 Z" fill="var(--c3)"/></svg>`;
  return '';
}

function setActive(win){
  document.querySelectorAll('.win').forEach(w=>w.classList.remove('active'));
  win.classList.add('active');
  win.style.zIndex=++zTop;
}

function createWindow({key,title,x,y,w,h,resizable,memCost}){
  if(key&&openWins[key]){ setActive(openWins[key]); return null; }
  const win=document.createElement('div');
  win.className='win active';
  w=Math.min(w,SW-8);h=Math.min(h,SH-24);
  x=Math.max(0,Math.min(x,SW-w-4));
  y=Math.max(0,Math.min(y,SH-h-24));
  win.style.left=x+'px'; win.style.top=y+'px';
  win.style.width=w+'px'; win.style.height=h+'px';
  win.innerHTML=`
   <div class="tbar">
    <div class="tgad cl" title="Close">${svgGad('close')}</div>
    <div class="ttl">${title}</div>
    <div class="tgad dep" title="To back">${svgGad('back')}</div>
    <div class="tgad dep" title="To front">${svgGad('front')}</div>
   </div>
   <div class="wbody"></div>`;
  desktop.appendChild(win);
  setActive(win);
  const cost=memCost||21384; chewMem(cost);
  if(key) openWins[key]=win;
  win._onClose=null;

  /* gadgets */
  const [gClose,gBack,gFront]=win.querySelectorAll('.tgad');
  gClose.addEventListener('click',()=>closeWindow(win,key,cost));
  gBack.addEventListener('click',e=>{e.stopPropagation(); win.style.zIndex=50;});
  gFront.addEventListener('click',e=>{e.stopPropagation(); setActive(win);});
  win.addEventListener('pointerdown',()=>setActive(win));

  /* drag */
  const tbar=win.querySelector('.tbar');
  tbar.addEventListener('pointerdown',e=>{
    if(e.target.closest('.tgad'))return;
    setActive(win);
    const sx=e.clientX, sy=e.clientY;
    const scale=screenEl.getBoundingClientRect().width/SW;
    const ox=parseFloat(win.style.left), oy=parseFloat(win.style.top);
    tbar.setPointerCapture(e.pointerId);
    function mv(ev){
      let nx=ox+(ev.clientX-sx)/scale, ny=oy+(ev.clientY-sy)/scale;
      nx=Math.max(-w+60,Math.min(SW-60,nx));
      ny=Math.max(0,Math.min(SH-40,ny));
      win.style.left=nx+'px'; win.style.top=ny+'px';
    }
    function up(){tbar.removeEventListener('pointermove',mv);tbar.removeEventListener('pointerup',up);}
    tbar.addEventListener('pointermove',mv);
    tbar.addEventListener('pointerup',up);
  });

  /* resize */
  if(resizable){
    const sg=document.createElement('div');
    sg.className='sizegad'; sg.innerHTML=svgGad('size');
    win.appendChild(sg);
    sg.addEventListener('pointerdown',e=>{
      e.stopPropagation(); setActive(win);
      const sx=e.clientX, sy=e.clientY;
      const scale=screenEl.getBoundingClientRect().width/SW;
      const ow=win.offsetWidth, oh=win.offsetHeight;
      sg.setPointerCapture(e.pointerId);
      function mv(ev){
        const nw=Math.max(120,Math.min(SW,ow+(ev.clientX-sx)/scale));
        const nh=Math.max(110,Math.min(SH-20,oh+(ev.clientY-sy)/scale));
        win.style.width=nw+'px'; win.style.height=nh+'px';
        win._onResize&&win._onResize();
      }
      function up(){sg.removeEventListener('pointermove',mv);sg.removeEventListener('pointerup',up);}
      sg.addEventListener('pointermove',mv);
      sg.addEventListener('pointerup',up);
    });
  }
  return win;
}

function closeWindow(win,key,cost){
  win._onClose&&win._onClose();
  win.remove();
  if(key) delete openWins[key];
  freeMemBack(cost||21384);
}

   <div class="reqbtns"><button class="reqbtn">Continue</button></div>`;
  b.querySelector('.reqbtn').addEventListener('click',()=>closeWindow(win,null,4096));
}

/* ---------- CLOCK ---------- */
function openClock(){
  const o=casc();
  const win=createWindow({title:'Clock',x:330+o,y:60+o,w:200,h:200,resizable:true,memCost:14200});
  if(!win)return;
  const body=win.querySelector('.wbody');
  body.className='wbody clockbody';
  const cv=document.createElement('canvas');
  body.appendChild(cv);
  function draw(){
    const s=Math.min(body.clientWidth,body.clientHeight)-14;
    if(s<20)return;
    cv.width=s; cv.height=s;
    const ctx=cv.getContext('2d');
    const cs=getComputedStyle(document.documentElement);
    const C1=cs.getPropertyValue('--c1').trim(), C2=cs.getPropertyValue('--c2').trim(), C3=cs.getPropertyValue('--c3').trim();
    const r=s/2;
    ctx.clearRect(0,0,s,s);
    ctx.fillStyle=C1; ctx.beginPath(); ctx.arc(r,r,r-2,0,7); ctx.fill();
    ctx.strokeStyle=C2; ctx.lineWidth=Math.max(2,s*.015); ctx.stroke();
    /* tacche */
    for(let i=0;i<12;i++){
      const a=i*Math.PI/6;
      const l=(i%3===0)?.16:.08;
      ctx.beginPath();
      ctx.moveTo(r+Math.sin(a)*(r*.86),r-Math.cos(a)*(r*.86));
      ctx.lineTo(r+Math.sin(a)*(r*(0.86-l)),r-Math.cos(a)*(r*(0.86-l)));
      ctx.lineWidth=(i%3===0)?Math.max(2,s*.02):Math.max(1,s*.01);
      ctx.strokeStyle=C2; ctx.stroke();
    }
    const now=new Date();
    const hr=(now.getHours()%12)+now.getMinutes()/60;
    const mn=now.getMinutes()+now.getSeconds()/60;
    const sc=now.getSeconds();
    function hand(angle,len,wid,col){
      ctx.beginPath();
      ctx.moveTo(r-Math.sin(angle)*r*.12,r+Math.cos(angle)*r*.12);
      ctx.lineTo(r+Math.sin(angle)*r*len,r-Math.cos(angle)*r*len);
      ctx.lineWidth=wid; ctx.strokeStyle=col; ctx.lineCap='butt'; ctx.stroke();
    }
    hand(hr*Math.PI/6,.45,Math.max(3,s*.03),C2);
    hand(mn*Math.PI/30,.66,Math.max(2,s*.02),C2);
    hand(sc*Math.PI/30,.72,Math.max(1,s*.012),C3);
    ctx.fillStyle=C2; ctx.beginPath(); ctx.arc(r,r,Math.max(2,s*.03),0,7); ctx.fill();
  }
  draw();
  const iv=setInterval(draw,1000);
  win._onResize=draw;
  win._onClose=()=>clearInterval(iv);
}

/* ---------- CALCULATOR ---------- */
function openCalc(){
  const o=casc();
  const win=createWindow({title:'Calculator',x:120+o,y:90+o,w:196,h:236,resizable:true,memCost:9600});
  if(!win)return;
  const body=win.querySelector('.wbody');
  body.className='wbody calc';
  body.innerHTML=`<div class="cdisp">0.</div><div class="cgrid"></div>`;
  const disp=body.querySelector('.cdisp');
  const grid=body.querySelector('.cgrid');
  const keys=['CA','CE','\u00AB','\u00F7','7','8','9','\u00D7','4','5','6','-','1','2','3','+','.','0','\u00B1','='];
  let acc=null,op=null,cur='0',fresh=true;
  function show(){ disp.textContent=(cur.includes('.')?cur:cur+'.'); }
  function calc(a,b,o){
    a=parseFloat(a); b=parseFloat(b);
    let r=o==='+'?a+b:o==='-'?a-b:o==='\u00D7'?a*b:o==='\u00F7'?(b===0?NaN:a/b):b;
    if(!isFinite(r)||isNaN(r)) return 'Error';
    r=Math.round(r*1e10)/1e10;
    let s=String(r);
    if(s.replace('-','').replace('.','').length>10) s=r.toExponential(4);
    return s;
  }
  function press(k){
    if(k==='CA'){acc=null;op=null;cur='0';fresh=true;}
    else if(k==='CE'){cur='0';fresh=true;}
    else if(k==='\u00AB'){cur=cur.length>1?cur.slice(0,-1):'0';}
    else if(k==='\u00B1'){cur=cur.startsWith('-')?cur.slice(1):(cur!=='0'?'-'+cur:cur);}
    else if(k==='.'){if(fresh){cur='0.';fresh=false;}else if(!cur.includes('.'))cur+='.';}
    else if(k>='0'&&k<='9'){ if(fresh){cur=k;fresh=false;} else if(cur.replace('-','').replace('.','').length<10) cur=(cur==='0'?k:cur+k); }
    else if(k==='='){ if(op&&acc!==null){cur=calc(acc,cur,op);acc=null;op=null;fresh=true;} }
    else { /* operatore */
      if(op&&acc!==null&&!fresh){cur=calc(acc,cur,op);}
      acc=cur; op=k; fresh=true;
    }
    show();
  }
  keys.forEach(k=>{
    const b=document.createElement('button');
    b.className='cbtn'; b.textContent=k;
    b.addEventListener('click',()=>press(k));
    grid.appendChild(b);
  });
  win.addEventListener('keydown',e=>{
    const map={'*':'\u00D7','/':'\u00F7','x':'\u00D7','Enter':'=','Backspace':'\u00AB','Escape':'CA'};
    const k=map[e.key]||e.key;
    if(keys.includes(k)){press(k);e.preventDefault();}
  });
  win.tabIndex=0; win.focus();
}

/* ---------- SHELL ---------- */
function openShell(){
  const pn=++shellN, o=casc();
  const win=createWindow({title:'AmigaShell',x:60+o,y:220+o,w:440,h:210,resizable:true,memCost:32768});
  if(!win)return;
  const body=win.querySelector('.wbody');
  body.innerHTML=`<div class="shell"></div>`;
  const sh=body.querySelector('.shell');
  let hist=[],hIdx=0;
  function line(t){const d=document.createElement('div');d.className='cline';d.textContent=t;sh.insertBefore(d,prompt);sh.scrollTop=sh.scrollHeight;}
  const prompt=document.createElement('div');
  prompt.className='cline';
  prompt.innerHTML=`<span>${pn}&gt; </span><input type="text" autocomplete="off" spellcheck="false"><span class="cursorblk"></span>`;
  sh.appendChild(prompt);
  const inp=prompt.querySelector('input');
  line('New Shell process '+pn);
  sh.addEventListener('pointerup',()=>inp.focus());
  setTimeout(()=>inp.focus(),50);

  const FILES=['Utilities (dir)','System (dir)','Prefs (dir)','Trashcan (dir)','Shell','Disk.info','.info files'];
  function exec(raw){
    const cmd=raw.trim(); if(!cmd)return;
    hist.push(cmd); hIdx=hist.length;
    line(pn+'> '+cmd);
    const [c,...rest]=cmd.split(/\s+/); const arg=rest.join(' ');
    switch(c.toLowerCase()){
      case 'dir': case 'list':
        FILES.forEach(f=>line('  '+f));
        line(FILES.length+' files - 837K bytes used'); break;
      case 'avail':
        line('Type   Available    In-Use   Maximum');
        line(`chip     ${String(freeMem).padStart(7)}    ${String(524288-Math.min(freeMem,524288)).padStart(6)}    524288`);
        line('fast      524288         0    524288');
        line(`total    ${String(freeMem+524288).padStart(7)}`); break;
      case 'date': line(new Date().toString()); break;
      case 'echo': line(arg||''); break;
      case 'cls': case 'clear': sh.querySelectorAll('.cline:not(:last-child)').forEach(e=>e.remove()); break;
      case 'version': line('Kickstart version 34.5. Workbench version 34.28'); break;
      case 'say': if(arg){speak(arg);line('...');}else line('Say: no input'); break;
      case 'why': line("Last command didn't fail."); break;
      case 'guru': gogo(); break;
      case 'endcli': case 'exit': closeWindow(win,null,32768); return;
      case 'help':
        line('Commands: dir list avail date echo cls version say why guru endcli'); break;
      default: line(`${c}: Unknown command`); line("Type 'help' for a command list.");
    }
    sh.scrollTop=sh.scrollHeight;
  }
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){exec(inp.value);inp.value='';}
    else if(e.key==='ArrowUp'){if(hIdx>0){hIdx--;inp.value=hist[hIdx]||'';}e.preventDefault();}
    else if(e.key==='ArrowDown'){if(hIdx<hist.length){hIdx++;inp.value=hist[hIdx]||'';}e.preventDefault();}
  });
}

/* ---------- SINPLOT (benchmark 68030 vs 68882) ---------- */
/* Emulazione softfloat: riduzione argomento + serie di Taylor, come le
   librerie IEEE mathieeedoubbas senza coprocessore. */
function softSin(x){
  const PI2=6.283185307179586;
  x=x%PI2; if(x>Math.PI)x-=PI2; if(x<-Math.PI)x+=PI2;
  let t=x,r=x;
  for(let n=1;n<=9;n++){
    t*=-x*x/((2*n)*(2*n+1));
    r+=t;
  }
  return r;
}
function openSinplot(){
  const o=casc();
  const win=createWindow({title:'SinPlot 1.2',x:90+o,y:60+o,w:470,h:320,resizable:true,memCost:11800});
  if(!win)return;
  const b=win.querySelector('.wbody');
  b.className='wbody spbody';
  b.innerHTML=`<canvas></canvas>
   <div class="spctl">
    <span style="font:bold 11px 'Courier New';color:var(--c2)">CPU:</span>
    <span class="spbtn on" data-c="030">68030</span>
    <span class="spbtn" data-c="882">68030+68882</span>
    <span class="spbtn" data-a="plot">Plot</span>
    <span class="spbtn" data-a="stop">Stop</span>
    <span class="sptime">Time: 0.00 s</span>
   </div>
   <div class="spinfo">f(x)=sin(x)  x:[-2pi,+2pi]  68030 softfloat: --.-- s   68882 FPU: --.-- s</div>`;
  const cv=b.querySelector('canvas');
  const timeEl=b.querySelector('.sptime');
  const infoEl=b.querySelector('.spinfo');
  const btn030=b.querySelector('[data-c="030"]');
  const btn882=b.querySelector('[data-c="882"]');
  let fpu=false,job=null,timerJob=null;
  let last={o:null,f:null};

  function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
  function axes(){
    const w=cv.width=cv.clientWidth,h=cv.height=cv.clientHeight;
    const ctx=cv.getContext('2d');
    const C0=cssv('--c0'),C1=cssv('--c1'),C2=cssv('--c2');
    ctx.fillStyle=C1;ctx.fillRect(0,0,w,h);
    const cx=w/2,cy=h/2,px=w/(4*Math.PI); /* pixel per unita' x */
    const py=(h/2-14);                    /* pixel per unita' y */
    ctx.strokeStyle=C0;ctx.lineWidth=1;
    /* griglia pi/2 */
    for(let k=-4;k<=4;k++){
      const x=cx+k*Math.PI/2*px;
      ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.globalAlpha=k%2?0.25:0.5;ctx.stroke();
      ctx.globalAlpha=1;
    }
    [-1,-0.5,0.5,1].forEach(v=>{
      ctx.globalAlpha=0.3;
      ctx.beginPath();ctx.moveTo(0,cy-v*py);ctx.lineTo(w,cy-v*py);ctx.stroke();
      ctx.globalAlpha=1;
    });
    /* assi */
    ctx.strokeStyle=C2;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,cy);ctx.lineTo(w,cy);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx,0);ctx.lineTo(cx,h);ctx.stroke();
    /* etichette */
    ctx.fillStyle=C2;ctx.font="bold 10px 'Courier New'";
    const labs=[['-2pi',-2*Math.PI],['-pi',-Math.PI],['pi',Math.PI],['2pi',2*Math.PI]];
    labs.forEach(l=>ctx.fillText(l[0],cx+l[1]*px-10,cy+12));
    ctx.fillText('+1',cx+4,cy-py+4);ctx.fillText('-1',cx+4,cy+py+4);
    return{w,h,cx,cy,px,py,ctx};
  }
  let G=null;
  function reset(){G=axes();}
  win._onResize=()=>{stop();reset();};
  function stop(){
    if(job){clearInterval(job);cancelAnimationFrame(job);job=null;}
    if(timerJob){clearInterval(timerJob);timerJob=null;}
  }
  function updInfo(){
    infoEl.textContent=
     `f(x)=sin(x)  x:[-2pi,+2pi]  68030 softfloat: ${last.o?last.o.toFixed(2):'--.--'} s   68882 FPU: ${last.f?last.f.toFixed(2):'--.--'} s`;
  }
  function plot(){
    stop();reset();
    const{w,cx,cy,px,py,ctx}=G;
    const C3=cssv('--c3');
    ctx.strokeStyle=C3;ctx.lineWidth=2;ctx.lineJoin='round';
    const N=Math.max(80,w);
    const t0=performance.now();
    let i=0,prev=null;
    timerJob=setInterval(()=>{
      timeEl.textContent='Time: '+((performance.now()-t0)/1000).toFixed(2)+' s';
    },50);
    function point(){
      const x=-2*Math.PI+4*Math.PI*i/(N-1);
      const y=fpu?Math.sin(x):softSin(x);
      const sx=cx+x*px,sy=cy-y*py;
      if(prev){ctx.beginPath();ctx.moveTo(prev[0],prev[1]);ctx.lineTo(sx,sy);ctx.stroke();}
      ctx.fillStyle=C3;ctx.fillRect(sx-1,sy-1,2,2);
      prev=[sx,sy];
      i++;
    }
    function done(){
      stop();
      const el=(performance.now()-t0)/1000;
      timeEl.textContent='Time: '+el.toFixed(2)+' s';
      if(fpu)last.f=el;else last.o=el;
      updInfo();
    }
    if(fpu){
      /* 68882: pochi frame e via */
      job=setInterval(()=>{
        for(let k=0;k<Math.ceil(N/16)&&i<N;k++)point();
        if(i>=N)done();
      },16);
    }else{
      /* 68030: emulazione IEEE, un punto alla volta */
      const iv=Math.max(18,Math.round(10500/N));
      job=setInterval(()=>{
        point();
        if(i>=N)done();
      },iv);
    }
  }
  b.querySelector('.spctl').addEventListener('click',e=>{
    const t=e.target;
    if(t.dataset.c){
      fpu=(t.dataset.c==='882');
      btn030.classList.toggle('on',!fpu);
      btn882.classList.toggle('on',fpu);
      return;
    }
    if(t.dataset.a==='plot')plot();
    if(t.dataset.a==='stop'){stop();timeEl.textContent=timeEl.textContent+' (stopped)';}
  });
  win._onClose=stop;
  setTimeout(reset,30);
  updInfo();
}

    w.style.left=Math.max(0,Math.min(SW-120,parseFloat(w.style.left)))+'px';
    w.style.top=Math.max(0,Math.min(SH-80,parseFloat(w.style.top)))+'px';
  });
  try{localStorage.setItem('wb_screenmode',i);}catch(err){}
}

/* =====================================================================
   DELUXE PAINT III  -  motore a colori indicizzati 320x256 / 32 colori
   ===================================================================== */
const DP=(()=>{
const PW=320,PH=256,NC=32;
let built=false,visible=false,memTaken=false;
let buf=new Uint8Array(PW*PH);
let pal=[];             /* [r,g,b] 0-255, passi a 4 bit */
let fg=1,bg=0,tool='free',fillMode=false;
let view={z:1,ox:0,oy:0};
let undoStk=[],redoStk=[];
let sym=false,grid=false,gridN=8;
let cycling=false,cycT=null;
let brush={kind:'round',r:0,data:null,w:0,h:0,tc:0};  /* custom: data indices */
let textAct=false,tx=0,ty=0,tx0=0;
let op=null;            /* operazione in corso */
let els={};

const DEFPALD=[
 '000','FFF','CCC','999','666','333','840','B62','D94','FC8',
 'F00','C00','800','F80','FB0','FF0','8F0','0C0','080','040',
 '0FC','0CF','08F','04F','00C','008','80F','C0F','F0C','F08',
 '420','FDC'];
function resetPal(){
  pal=DEFPALD.map(h=>[parseInt(h[0],16)*17,parseInt(h[1],16)*17,parseInt(h[2],16)*17]);
}
function css(i){const c=pal[i];return `rgb(${c[0]},${c[1]},${c[2]})`;}

/* ---------- low level ---------- */
function setPix(x,y,c){
  if(x>=0&&x<PW&&y>=0&&y<PH) buf[y*PW+x]=c;
  if(sym){const mx=PW-1-x; if(mx>=0&&mx<PW&&y>=0&&y<PH) buf[y*PW+mx]=c;}
}
function stamp(x,y,c){
  if(brush.kind==='custom'&&brush.data){
    const ox=x-(brush.w>>1),oy=y-(brush.h>>1);
    for(let j=0;j<brush.h;j++)for(let i=0;i<brush.w;i++){
      const v=brush.data[j*brush.w+i];
      if(v!==brush.tc) setPix(ox+i,oy+j,v);
    }
    return;
  }
  const r=brush.r;
  if(brush.kind==='square'){
    for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++)setPix(x+i,y+j,c);
  }else{
    if(r===0){setPix(x,y,c);return;}
    for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++)
      if(i*i+j*j<=r*r+r*0.6)setPix(x+i,y+j,c);
  }
}
function lineB(x0,y0,x1,y1,c,st){
  x0|=0;y0|=0;x1|=0;y1|=0;
  const dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;
  let err=dx-dy;
  for(;;){
    st?stamp(x0,y0,c):setPix(x0,y0,c);
    if(x0===x1&&y0===y1)break;
    const e2=2*err;
    if(e2>-dy){err-=dy;x0+=sx;}
    if(e2<dx){err+=dx;y0+=sy;}
  }
}
function rectB(x0,y0,x1,y1,c,fill){
  const ax=Math.min(x0,x1),bx=Math.max(x0,x1),ay=Math.min(y0,y1),by=Math.max(y0,y1);
  if(fill){for(let y=ay;y<=by;y++)for(let x=ax;x<=bx;x++)setPix(x,y,c);}
  else{lineB(ax,ay,bx,ay,c,1);lineB(bx,ay,bx,by,c,1);lineB(bx,by,ax,by,c,1);lineB(ax,by,ax,ay,c,1);}
}
function ellipseB(cx,cy,rx,ry,c,fill){
  rx=Math.max(0,rx|0);ry=Math.max(0,ry|0);
  if(fill){
    for(let y=-ry;y<=ry;y++){
      const w=rx*Math.sqrt(Math.max(0,1-(y*y)/(ry*ry||1)));
      for(let x=Math.round(-w);x<=Math.round(w);x++)setPix(cx+x,cy+y,c);
    }
  }else{
    const n=Math.max(24,(rx+ry)*3);
    let px=null,py=null;
    for(let i=0;i<=n;i++){
      const a=i/n*Math.PI*2;
      const x=Math.round(cx+Math.cos(a)*rx),y=Math.round(cy+Math.sin(a)*ry);
      if(px!==null)lineB(px,py,x,y,c,1); px=x;py=y;
    }
  }
}
function curveB(a,b,ctl,c){
  const n=64;let px=a.x,py=a.y;
  for(let i=1;i<=n;i++){
    const t=i/n,u=1-t;
    const x=Math.round(u*u*a.x+2*u*t*ctl.x+t*t*b.x);
    const y=Math.round(u*u*a.y+2*u*t*ctl.y+t*t*b.y);
    lineB(px,py,x,y,c,1);px=x;py=y;
  }
}
function flood(x,y,c){
  x|=0;y|=0;
  if(x<0||x>=PW||y<0||y>=PH)return;
  const tgt=buf[y*PW+x];
  if(tgt===c)return;
  const stk=[[x,y]];
  while(stk.length){
    let [sx,sy]=stk.pop();
    let x0=sx; while(x0>0&&buf[sy*PW+x0-1]===tgt)x0--;
    let x1=sx; while(x1<PW-1&&buf[sy*PW+x1+1]===tgt)x1++;
    for(let i=x0;i<=x1;i++)buf[sy*PW+i]=c;
    for(const ny of [sy-1,sy+1]){
      if(ny<0||ny>=PH)continue;
      let inside=false;
      for(let i=x0;i<=x1;i++){
        if(buf[ny*PW+i]===tgt){ if(!inside){stk.push([i,ny]);inside=true;} }
        else inside=false;
      }
    }
  }
  if(sym){ /* replica specchiata */
    const mx=PW-1-x;
    if(buf[y*PW+mx]===tgt){const s=sym;sym=false;flood2(mx,y,c,tgt);sym=s;}
  }
}
function flood2(x,y,c,tgt){
  const stk=[[x,y]];
  while(stk.length){
    let [sx,sy]=stk.pop();
    let x0=sx; while(x0>0&&buf[sy*PW+x0-1]===tgt)x0--;
    let x1=sx; while(x1<PW-1&&buf[sy*PW+x1+1]===tgt)x1++;
    for(let i=x0;i<=x1;i++)buf[sy*PW+i]=c;
    for(const ny of [sy-1,sy+1]){
      if(ny<0||ny>=PH)continue;
      let inside=false;
      for(let i=x0;i<=x1;i++){
        if(buf[ny*PW+i]===tgt){ if(!inside){stk.push([i,ny]);inside=true;} }
        else inside=false;
      }
    }
  }
}
function polyFill(pts,c){
  const mc=els.mask.getContext('2d');
  mc.clearRect(0,0,PW,PH);
  mc.fillStyle='#fff';
  mc.beginPath();mc.moveTo(pts[0].x+.5,pts[0].y+.5);
  for(let i=1;i<pts.length;i++)mc.lineTo(pts[i].x+.5,pts[i].y+.5);
  mc.closePath();mc.fill();
  const d=mc.getImageData(0,0,PW,PH).data;
  for(let y=0;y<PH;y++)for(let x=0;x<PW;x++)
    if(d[(y*PW+x)*4+3]>127)setPix(x,y,c);
  for(let i=0;i<pts.length;i++){
    const a=pts[i],b=pts[(i+1)%pts.length];
    lineB(a.x,a.y,b.x,b.y,c,0);
  }
}
function drawChar(ch,x,y,c){
  const mc=els.mask.getContext('2d');
  mc.clearRect(0,0,PW,PH);
  mc.fillStyle='#fff';
  mc.font='bold 10px "Courier New",monospace';
  mc.textBaseline='top';
  mc.fillText(ch,x,y);
  const d=mc.getImageData(0,0,PW,PH).data;
  for(let yy=Math.max(0,y-2);yy<Math.min(PH,y+14);yy++)
    for(let xx=Math.max(0,x-2);xx<Math.min(PW,x+12);xx++)
      if(d[(yy*PW+xx)*4+3]>100)setPix(xx,yy,c);
}

/* ---------- undo ---------- */
function pushUndo(){
  undoStk.push(buf.slice());
  if(undoStk.length>40)undoStk.shift();
  redoStk.length=0;
}
function undo(){
  if(!undoStk.length)return;
  redoStk.push(buf.slice());
  buf=undoStk.pop();
}
function redo(){
  if(!redoStk.length)return;
  undoStk.push(buf.slice());
  buf=redoStk.pop();
}

/* ---------- render ---------- */
let imgd=null;
function render(){
  const octx=els.off.getContext('2d');
  if(!imgd)imgd=octx.createImageData(PW,PH);
  const d=imgd.data;
  for(let i=0;i<buf.length;i++){
    const c=pal[buf[i]],k=i*4;
    d[k]=c[0];d[k+1]=c[1];d[k+2]=c[2];d[k+3]=255;
  }
  octx.putImageData(imgd,0,0);
  const ctx=els.cv.getContext('2d');
  ctx.imageSmoothingEnabled=false;
  ctx.clearRect(0,0,640,512);
  ctx.drawImage(els.off,view.ox,view.oy,PW/view.z,PH/view.z,0,0,640,512);
  drawOverlay(ctx);
}
function p2dX(x){return (x-view.ox)*2*view.z;}
function p2dY(y){return (y-view.oy)*2*view.z;}
function drawOverlay(ctx){
  ctx.save();
  ctx.imageSmoothingEnabled=false;
  const lw=Math.max(2,2*view.z);
  if(op&&op.preview)op.preview(ctx,lw);
  if(textAct){
    ctx.fillStyle=css(fg);
    if(Math.floor(Date.now()/400)%2===0)
      ctx.fillRect(p2dX(tx),p2dY(ty),2*view.z,10*2*view.z);
  }
  ctx.restore();
}
let rafOn=false;
function loop(){ if(!visible){rafOn=false;return;} render(); requestAnimationFrame(loop); }
function startLoop(){ if(!rafOn){rafOn=true;requestAnimationFrame(loop);} }

/* ---------- color cycling ---------- */
function setCycle(v){
  cycling=v;

  if(v)cycT=setInterval(()=>{ const last=pal[31]; for(let i=31;i>16;i--)pal[i]=pal[i-1]; pal[16]=last; },110);
  const cb=els.tools&&els.tools.querySelector('[data-t="mcyc"]');

}

/* ---------- pointer mapping ---------- */
function evPage(e){
  const r=els.cv.getBoundingClientRect();
  let dx=(e.clientX-r.left)/r.width*640;
  let dy=(e.clientY-r.top)/r.height*512;
  let x=Math.floor(view.ox+dx/(2*view.z));
  let y=Math.floor(view.oy+dy/(2*view.z));
  if(grid){x=Math.round(x/gridN)*gridN;y=Math.round(y/gridN)*gridN;}
  return{x:Math.max(0,Math.min(PW-1,x)),y:Math.max(0,Math.min(PH-1,y))};
}

/* ---------- tool ops ---------- */
function setTool(t,fill){
  if(tool==='text'&&t!=='text')textAct=false;
  tool=t; if(fill!==undefined)fillMode=fill;
  els.tools.querySelectorAll('.dpt').forEach(b=>b.classList.toggle('on',
    b.dataset.t===t||(b.dataset.t==='gridt'&&grid)||(b.dataset.t==='symt'&&sym)||(b.dataset.t==='mcyc'&&cycling)));
}

            ctx.lineTo(p2dX(op.cur.x),p2dY(op.cur.y));

          }};

        const s=op.pts[0];

        if(close){

          else{for(let i=0;i<op.pts.length;i++){const a=op.pts[i],b=op.pts[(i+1)%op.pts.length];lineB(a.x,a.y,b.x,b.y,op.col,0);}}
          op=null;

    }

        preview:(ctx,lw)=>{
          ctx.strokeStyle='#fff';ctx.setLineDash([6,4]);ctx.lineWidth=2;
          ctx.strokeRect(p2dX(Math.min(op.a.x,op.b.x)),p2dY(Math.min(op.a.y,op.b.y)),

      op=null;return;
    }
    pushUndo();
    if(op.t==='line')lineB(op.a.x,op.a.y,p.x,p.y,op.col,1);
    if(op.t==='rect')rectB(op.a.x,op.a.y,p.x,p.y,op.col,fillMode);
    if(op.t==='circ'){const r=Math.round(Math.hypot(p.x-op.a.x,p.y-op.a.y));ellipseB(op.a.x,op.a.y,r,r,op.col,fillMode);}
    if(op.t==='ell')ellipseB(op.a.x,op.a.y,Math.abs(p.x-op.a.x),Math.abs(p.y-op.a.y),op.col,fillMode);

  });

function rotM(rx,ry,rz){

         -sy,  cy*sx,         cy*cx];
}

function meshEdges(faces){
  const set=new Set(),ed=[];
  for(const f of faces)for(let i=0;i<f.length;i++){
    const a=f[i],b=f[(i+1)%f.length],k=a<b?a+'_'+b:b+'_'+a;
    if(!set.has(k)){set.add(k);ed.push([a,b]);}
  }

}
function primSphere(r=60,lon=14,lat=8){
  const v=[[0,0,r]],f=[];
  for(let j=1;j<lat;j++){const ph=Math.PI*j/lat;
    for(let i=0;i<lon;i++){const th=2*Math.PI*i/lon;
      v.push([r*Math.sin(ph)*Math.cos(th),r*Math.sin(ph)*Math.sin(th),r*Math.cos(ph)]);}}
  v.push([0,0,-r]);
  for(let i=0;i<lon;i++)f.push([0,1+i,1+(i+1)%lon]);
  for(let j=0;j<lat-2;j++)for(let i=0;i<lon;i++){
    const a=1+j*lon+i,b=1+j*lon+(i+1)%lon,c=a+lon,d=b+lon;
    f.push([a,c,d]);f.push([a,d,b]);}
  const bot=v.length-1,base=1+(lat-2)*lon;
  for(let i=0;i<lon;i++)f.push([bot,base+(i+1)%lon,base+i]);
  return{verts:v,faces:f};
}
function primBox(s=100){const h=s/2;
  const v=[[-h,-h,-h],[h,-h,-h],[h,h,-h],[-h,h,-h],[-h,-h,h],[h,-h,h],[h,h,h],[-h,h,h]];
  const q=[[0,1,2,3],[7,6,5,4],[0,4,5,1],[1,5,6,2],[2,6,7,3],[3,7,4,0]];
  const f=[];q.forEach(x=>{f.push([x[0],x[1],x[2]]);f.push([x[0],x[2],x[3]]);});
  return{verts:v,faces:f};
}
function primCyl(r=50,h=120,n=14,cone=false,open=false){
  const v=[],f=[],hh=h/2;
  for(let i=0;i<n;i++){const a=2*Math.PI*i/n;v.push([r*Math.cos(a),r*Math.sin(a),-hh]);}
  if(cone)v.push([0,0,hh]);
  else for(let i=0;i<n;i++){const a=2*Math.PI*i/n;v.push([r*Math.cos(a),r*Math.sin(a),hh]);}
  if(cone){const top=n;for(let i=0;i<n;i++)f.push([i,(i+1)%n,top]);}
  else for(let i=0;i<n;i++){const j=(i+1)%n;f.push([i,j,n+j]);f.push([i,n+j,n+i]);}
  if(!open){
    v.push([0,0,-hh]);const cb=v.length-1;
    for(let i=0;i<n;i++)f.push([cb,(i+1)%n,i]);
    if(!cone){v.push([0,0,hh]);const ct=v.length-1;
      for(let i=0;i<n;i++)f.push([ct,n+i,n+(i+1)%n]);}

function primTorus(R=70,r=25,n=14,m=9){

  for(let i=0;i<n;i++)for(let j=0;j<m;j++){
    const a=i*m+j,b=i*m+(j+1)%m,c=((i+1)%n)*m+j,d=((i+1)%n)*m+(j+1)%m;
    f.push([a,c,d]);f.push([a,d,b]);}

}

  const v=[],f=[],st=s/n,h=s/2;
  for(let j=0;j<=n;j++)for(let i=0;i<=n;i++)v.push([-h+i*st,-h+j*st,0]);
  for(let j=0;j<n;j++)for(let i=0;i<n;i++){
    const a=j*(n+1)+i,b=a+1,c=a+n+1,d=c+1;
    f.push([a,b,d]);f.push([a,d,c]);}
  return{verts:v,faces:f};
}
const PALDEF=[[200,60,60],[60,120,220],[80,190,80],[220,170,50],[180,80,200],[80,200,200]];
let colSeq=0;

function newObj(type,g,kind){
  const col=PALDEF[(colSeq++)%PALDEF.length];
  const o={id:scene.seq,name:type+'.'+scene.seq,type,kind:kind||'mesh',
    verts:g.verts,faces:g.faces,edges:meshEdges(g.faces),
    pos:kind==='light'?[250,-180,320]:kind==='camera'?[300,-460,260]:[0,0,0],
    rot:[0,0,0],scl:[1,1,1],
    color:[...col],spec:120,refl:0,intensity:255,
    keys:[]};
  scene.seq++;scene.objs.push(o);
  selObjs=[o];clearSub();
  syncStatus();
  return o;
}
function addObj(type){
  pushUndo();
  if(type==='Sphere')return newObj(type,primSphere());
  if(type==='Box')return newObj(type,primBox());
  if(type==='Cylinder')return newObj(type,primCyl());
  if(type==='Cone')return newObj(type,primCyl(55,130,14,true));
  if(type==='Tube')return newObj(type,primCyl(50,120,14,false,true));
  if(type==='Torus')return newObj(type,primTorus());
  if(type==='Disk')return newObj(type,primDisk());
  if(type==='Plane')return newObj(type,primPlane());
  if(type==='Axis')return newObj(type,{verts:[],faces:[]},'axis');
  if(type==='Light')return newObj(type,{verts:[],faces:[]},'light');
  if(type==='Camera')return newObj(type,{verts:[],faces:[]},'camera');
}
function clearSub(){selPts.clear();selEdges.clear();selFaces.clear();}

/* ==================== animazione a keyframe ================== */
function xf(o,f){
  if(!o.keys||o.keys.length===0)return{pos:o.pos,rot:o.rot,scl:o.scl};
  const ks=o.keys.slice().sort((a,b)=>a.f-b.f);
  if(f<=ks[0].f)return ks[0];
  if(f>=ks[ks.length-1].f)return ks[ks.length-1];
  for(let i=0;i<ks.length-1;i++){
    if(f>=ks[i].f&&f<=ks[i+1].f){
      const t=(f-ks[i].f)/((ks[i+1].f-ks[i].f)||1);
      const L=(a,b)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
      return{pos:L(ks[i].pos,ks[i+1].pos),rot:L(ks[i].rot,ks[i+1].rot),scl:L(ks[i].scl,ks[i+1].scl)};
    }
  }
  return{pos:o.pos,rot:o.rot,scl:o.scl};
}
function makeKey(){
  if(!selObjs.length)return;
  pushUndo();
  for(const o of selObjs){
    o.keys=o.keys.filter(k=>k.f!==curFrame);
    o.keys.push({f:curFrame,pos:[...o.pos],rot:[...o.rot],scl:[...o.scl]});
    o.keys.sort((a,b)=>a.f-b.f);
  }
  buildTimeline();
}
function delKey(){
  if(!selObjs.length)return;
  pushUndo();
  for(const o of selObjs)o.keys=o.keys.filter(k=>k.f!==curFrame);
  buildTimeline();
}
function gotoFrame(f){
  curFrame=Math.max(1,Math.min(scene.frames,f));
  for(const o of scene.objs){
    if(o.keys&&o.keys.length){
      const t=xf(o,curFrame);
      o.pos=[...t.pos];o.rot=[...t.rot];o.scl=[...t.scl];
    }
  }
  if(els.frameLbl)els.frameLbl.textContent='Frame '+curFrame+'/'+scene.frames;
  if(els.fslider)els.fslider.value=curFrame;
  markTimeline();
}
function playAnim(){
  if(playing){clearInterval(playing);playing=null;return;}
  playing=setInterval(()=>{
    gotoFrame(curFrame>=scene.frames?1:curFrame+1);
  },80);
}

function worldVerts(o){
  const m=rotM(o.rot[0],o.rot[1],o.rot[2]);
  return o.verts.map(v=>vadd(mApply(m,[v[0]*o.scl[0],v[1]*o.scl[1],v[2]*o.scl[2]]),o.pos));
}

/* =========================== undo ============================ */
function pushUndo(){
  undoStk.push(JSON.stringify({s:scene,f:curFrame}));
  if(undoStk.length>25)undoStk.shift();
}
function undo(){
  if(!undoStk.length)return;
  const d=JSON.parse(undoStk.pop());
  scene=d.s;curFrame=d.f;
  selObjs=[];clearSub();syncStatus();buildTimeline();
}

/* ========================= viewports ========================= */
const VIEWS=[
 {n:'TOP',  px:0,py:0,toU:w=>w[0],toV:w=>-w[1],axU:'X',axV:'Y',
  drag:(dx,dy)=>[dx,-dy,0],rotAx:2,zoom:0.7,ox:0,oy:0},
 {n:'FRONT',px:1,py:0,toU:w=>w[0],toV:w=>-w[2],axU:'X',axV:'Z',
  drag:(dx,dy)=>[dx,0,-dy],rotAx:1,zoom:0.7,ox:0,oy:0},
 {n:'RIGHT',px:0,py:1,toU:w=>w[1],toV:w=>-w[2],axU:'Y',axV:'Z',
  drag:(dx,dy)=>[0,dx,-dy],rotAx:0,zoom:0.7,ox:0,oy:0},
 {n:'PERSP',px:1,py:1,persp:true,zoom:1,ox:0,oy:0}
];
function viewRect(i){
  if(editor==='stage')return{x:0,y:0,w:CW,h:CH};
  if(singleView>=0)return{x:0,y:0,w:CW,h:CH};
  const v=VIEWS[i],hw=Math.floor(CW/2),hh=Math.floor(CH/2);
  return{x:v.px*hw,y:v.py*hh,w:hw,h:hh};
}
function camObj(){return scene.objs.find(o=>o.kind==='camera');}
function camBasisOf(cam){
  const P=cam?cam.pos:[300,-460,260];
  const F=vnorm(vsub([0,0,0],P));
  let R=vcross(F,[0,0,1]);
  if(vlen(R)<1e-4)R=[1,0,0];
  R=vnorm(R);
  const U=vcross(R,F);
  return{P,F,R,U};
}
function projPersp(w){
  const{th,ph,dist,pf}=orbit;
  const x1=w[0]*Math.cos(th)-w[1]*Math.sin(th);
  const y1=w[0]*Math.sin(th)+w[1]*Math.cos(th);
  const d=y1*Math.cos(ph)+w[2]*Math.sin(ph)+dist;
  const zv=-y1*Math.sin(ph)+w[2]*Math.cos(ph);
  if(d<10)return null;
  const s=pf/d;
  return{u:x1*s,v:-zv*s};
}
function projStage(w){
  const{P,F,R,U}=camBasisOf(camObj());
  const rel=vsub(w,P),z=vdot(rel,F);
  if(z<5)return null;
  const fx=(CW/2)/(0.55*(CW/CH)),fy=(CH/2)/0.55;
  return{x:CW/2+vdot(rel,R)/z*fx,y:CH/2-vdot(rel,U)/z*fy};
}
function projView(i,w){
  if(editor==='stage')return projStage(w);
  const v=VIEWS[i],r=viewRect(i);
  if(v.persp){
    const p=projPersp(w);
    if(!p)return null;
    return{x:r.x+r.w/2+(p.u+v.ox)*v.zoom,y:r.y+r.h/2+(p.v+v.oy)*v.zoom};
  }
  return{x:r.x+r.w/2+(v.toU(w)+v.ox)*v.zoom,y:r.y+r.h/2+(v.toV(w)+v.oy)*v.zoom};
}
function viewAt(mx,my){
  if(editor==='stage')return 0;
  if(singleView>=0)return singleView;
  for(let i=0;i<4;i++){const r=viewRect(i);
    if(mx>=r.x&&mx<r.x+r.w&&my>=r.y&&my<r.y+r.h)return i;}
  return -1;
}

/* =========================== draw ============================ */
let band=null;
function draw(){
  const ctx=els.cv.getContext('2d');
  ctx.fillStyle='#000';ctx.fillRect(0,0,CW,CH);
  if(editor==='forms'){drawForms(ctx);return;}
  const vis=(editor==='stage')?[0]:(singleView>=0?[singleView]:[0,1,2,3]);
  for(const i of vis){
    const r=viewRect(i),v=VIEWS[i];
    ctx.save();
    ctx.beginPath();ctx.rect(r.x,r.y,r.w,r.h);ctx.clip();
    if(editor==='stage'){
      const g=ctx.createLinearGradient(0,0,0,r.h);
      g.addColorStop(0,'#06080f');g.addColorStop(1,'#1a1408');
      ctx.fillStyle=g;ctx.fillRect(r.x,r.y,r.w,r.h);
    }else if(!v.persp){
      const step=(snap?snapN:50)*v.zoom;
      const cx=r.x+r.w/2+v.ox*v.zoom,cy=r.y+r.h/2+v.oy*v.zoom;
      if(step>4){
        ctx.strokeStyle='#12253d';ctx.lineWidth=1;
        for(let x=cx%step;x<r.x+r.w;x+=step){ctx.beginPath();ctx.moveTo(x,r.y);ctx.lineTo(x,r.y+r.h);ctx.stroke();}
        for(let y=cy%step;y<r.y+r.h;y+=step){ctx.beginPath();ctx.moveTo(r.x,y);ctx.lineTo(r.x+r.w,y);ctx.stroke();}
      }
      ctx.strokeStyle='#28527a';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(cx,r.y);ctx.lineTo(cx,r.y+r.h);ctx.stroke();
      ctx.beginPath();ctx.moveTo(r.x,cy);ctx.lineTo(r.x+r.w,cy);ctx.stroke();
    }else{
      const O=projView(i,[0,0,0]);
      [[120,0,0,'#a33'],[0,120,0,'#3a3'],[0,0,120,'#36c']].forEach(a=>{
        const P=projView(i,[a[0],a[1],a[2]]);
        if(O&&P){ctx.strokeStyle=a[3];ctx.lineWidth=1;
          ctx.beginPath();ctx.moveTo(O.x,O.y);ctx.lineTo(P.x,P.y);ctx.stroke();}});
    }
    for(const o of scene.objs){
      const on=selObjs.includes(o);
      if(o.kind==='mesh'){
        const wv=worldVerts(o);
        /* facce selezionate evidenziate */
        if(on&&pickMode==='face'&&selFaces.size){
          ctx.fillStyle='rgba(255,170,51,0.35)';
          selFaces.forEach(fi=>{
            const f=o.faces[fi];if(!f)return;
            const p=f.map(k=>projView(i,wv[k]));
            if(p.some(q=>!q))return;
            ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);
            for(let k=1;k<p.length;k++)ctx.lineTo(p[k].x,p[k].y);
            ctx.closePath();ctx.fill();
          });
        }
        ctx.strokeStyle=on?'#FFAA33':'#e8e8e8';ctx.lineWidth=1;
        ctx.beginPath();
        o.edges.forEach(([a,b])=>{
          const pa=projView(i,wv[a]),pb=projView(i,wv[b]);
          if(pa&&pb){ctx.moveTo(pa.x,pa.y);ctx.lineTo(pb.x,pb.y);}});
        ctx.stroke();
        if(on&&pickMode==='edge'&&selEdges.size){
          ctx.strokeStyle='#FFAA33';ctx.lineWidth=3;ctx.beginPath();
          selEdges.forEach(ei=>{
            const e=o.edges[ei];if(!e)return;
            const pa=projView(i,wv[e[0]]),pb=projView(i,wv[e[1]]);
            if(pa&&pb){ctx.moveTo(pa.x,pa.y);ctx.lineTo(pb.x,pb.y);}});
          ctx.stroke();
        }
        if(on&&pickMode==='pnt'){
          wv.forEach((w,k)=>{
            const p=projView(i,w);if(!p)return;
            if(selPts.has(k)){ctx.fillStyle='#FFAA33';ctx.fillRect(p.x-2.5,p.y-2.5,5,5);}
            else{ctx.fillStyle='#88ccff';ctx.fillRect(p.x-1.5,p.y-1.5,3,3);}
          });
        }
        /* asse oggetto */
        if(on){
          const p=projView(i,o.pos);
          if(p){ctx.strokeStyle='#FFAA33';ctx.lineWidth=1;
            ctx.beginPath();ctx.moveTo(p.x-7,p.y);ctx.lineTo(p.x+7,p.y);
            ctx.moveTo(p.x,p.y-7);ctx.lineTo(p.x,p.y+7);ctx.stroke();}
        }
      }else if(o.kind==='light'){
        const p=projView(i,o.pos);
        if(p){ctx.strokeStyle=on?'#FFAA33':'#ff6';ctx.lineWidth=1.5;
          for(let a=0;a<8;a++){const an=a*Math.PI/4;
            ctx.beginPath();ctx.moveTo(p.x+Math.cos(an)*3,p.y+Math.sin(an)*3);
            ctx.lineTo(p.x+Math.cos(an)*9,p.y+Math.sin(an)*9);ctx.stroke();}}
      }else if(o.kind==='camera'){
        if(editor==='stage')continue;
        const p=projView(i,o.pos);
        const q=projView(i,vadd(o.pos,vscale(vnorm(vsub([0,0,0],o.pos)),70)));
        if(p){ctx.strokeStyle=on?'#FFAA33':'#5f5';ctx.lineWidth=1.5;
          ctx.strokeRect(p.x-6,p.y-5,12,10);
          if(q){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();}}
      }else if(o.kind==='axis'){
        const p=projView(i,o.pos);
        if(p){ctx.strokeStyle=on?'#FFAA33':'#aaa';ctx.lineWidth=1;
          ctx.beginPath();ctx.moveTo(p.x-9,p.y);ctx.lineTo(p.x+9,p.y);
          ctx.moveTo(p.x,p.y-9);ctx.lineTo(p.x,p.y+9);ctx.stroke();}
      }
      /* traiettoria keyframe */
      if(o.keys&&o.keys.length>1){
        ctx.strokeStyle='#4a7';ctx.lineWidth=1;ctx.setLineDash([3,3]);
        ctx.beginPath();let first=true;
        o.keys.forEach(k=>{const p=projView(i,k.pos);
          if(p){first?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);first=false;}});
        ctx.stroke();ctx.setLineDash([]);
      }
    }
    if(band&&band.vi===i){
      ctx.strokeStyle='#FFAA33';ctx.setLineDash([4,3]);ctx.lineWidth=1;
      ctx.strokeRect(Math.min(band.x0,band.x1),Math.min(band.y0,band.y1),
        Math.abs(band.x1-band.x0),Math.abs(band.y1-band.y0));
      ctx.setLineDash([]);
    }
    ctx.fillStyle='#FFAA33';ctx.font="bold 11px 'Courier New'";
    ctx.fillText(editor==='stage'?'STAGE - CAMERA VIEW':v.n,r.x+5,r.y+13);
    ctx.strokeStyle='#553300';ctx.lineWidth=1;
    ctx.strokeRect(r.x+.5,r.y+.5,r.w-1,r.h-1);
    ctx.restore();
  }
}
function loop(){
  if(!visible){raf=false;return;}
  draw();
  if(els.quadb)els.quadb.classList.toggle('on',singleView<0);
  requestAnimationFrame(loop);
}
function startLoop(){if(!raf){raf=true;requestAnimationFrame(loop);}}

/* ========================= FORMS editor ====================== */
let form={pts:[[20,-80],[60,-40],[70,0],[55,45],[25,80]],sides:16,sel:-1};
function drawForms(ctx){
  const cx=CW/2,cy=CH/2,S=1.3;
  ctx.fillStyle='#000';ctx.fillRect(0,0,CW,CH);
  ctx.strokeStyle='#12253d';
  for(let x=cx%40;x<CW;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,CH);ctx.stroke();}
  for(let y=cy%40;y<CH;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(CW,y);ctx.stroke();}
  ctx.strokeStyle='#28527a';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(cx,0);ctx.lineTo(cx,CH);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,cy);ctx.lineTo(CW,cy);ctx.stroke();
  /* profilo e specchio */
  ctx.strokeStyle='#FFAA33';ctx.lineWidth=2;ctx.beginPath();
  form.pts.forEach((p,i)=>{const x=cx+p[0]*S,y=cy-p[1]*S;i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
  ctx.stroke();
  ctx.strokeStyle='#7a5520';ctx.lineWidth=1;ctx.beginPath();
  form.pts.forEach((p,i)=>{const x=cx-p[0]*S,y=cy-p[1]*S;i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
  ctx.stroke();
  form.pts.forEach((p,i)=>{
    const x=cx+p[0]*S,y=cy-p[1]*S;
    ctx.fillStyle=i===form.sel?'#fff':'#FFAA33';
    ctx.fillRect(x-3,y-3,6,6);
  });
  ctx.fillStyle='#FFAA33';ctx.font="bold 11px 'Courier New'";
  ctx.fillText('FORMS EDITOR - profilo di rivoluzione, '+form.sides+' lati',8,16);
  ctx.fillStyle='#996611';
  ctx.fillText('trascina i punti  |  click sul vuoto = aggiungi  |  MAKE OBJECT crea la mesh',8,CH-10);
}
function formsPick(mx,my){
  const cx=CW/2,cy=CH/2,S=1.3;
  for(let i=0;i<form.pts.length;i++){
    const x=cx+form.pts[i][0]*S,y=cy-form.pts[i][1]*S;
    if(Math.hypot(x-mx,y-my)<8)return i;
  }
  return-1;
}
function formsMakeObject(){
  const n=form.sides,pts=form.pts;
  const v=[],f=[];
  for(let i=0;i<n;i++){
    const a=2*Math.PI*i/n;
    pts.forEach(p=>v.push([Math.max(0.01,p[0])*Math.cos(a),Math.max(0.01,p[0])*Math.sin(a),p[1]]));
  }
  const m=pts.length;
  for(let i=0;i<n;i++){
    const j=(i+1)%n;
    for(let k=0;k<m-1;k++){
      const a=i*m+k,b=i*m+k+1,c=j*m+k,d=j*m+k+1;
      f.push([a,c,d]);f.push([a,d,b]);
    }
  }
  pushUndo();
  const o=newObj('Form',{verts:v,faces:f});
  o.color=[190,140,90];
  setEditor('detail');
}

/* ======================= Mold / funzioni ===================== */
function bboxLocal(o){
  let mn=[1e9,1e9,1e9],mx=[-1e9,-1e9,-1e9];
  o.verts.forEach(v=>{for(let i=0;i<3;i++){mn[i]=Math.min(mn[i],v[i]);mx[i]=Math.max(mx[i],v[i]);}});
  return{mn,mx};
}
function moldExtrude(){
  const o=selObjs[0];if(!o||o.kind!=='mesh')return;
  pushUndo();
  const amt=prompt('Extrude: lunghezza lungo Z',80);
  const d=parseFloat(amt);if(isNaN(d))return;
  const n=o.verts.length;
  const top=o.verts.map(v=>[v[0],v[1],v[2]+d]);
  const bord=o.edges.slice();
  o.verts=o.verts.concat(top);
  const nf=o.faces.map(f=>f.map(i=>i+n));
  bord.forEach(([a,b])=>{o.faces.push([a,b,b+n]);o.faces.push([a,b+n,a+n]);});
  o.faces=o.faces.concat(nf);
  o.edges=meshEdges(o.faces);
}
function moldReplicate(){
  const o=selObjs[0];if(!o)return;
  const cnt=parseInt(prompt('Replicate: numero di copie',5));
  if(isNaN(cnt)||cnt<1)return;
  const dx=parseFloat(prompt('Offset X per copia',60))||0;
  const rz=(parseFloat(prompt('Rotazione Z per copia (gradi)',0))||0)*Math.PI/180;
  pushUndo();
  for(let i=1;i<=cnt;i++){
    const c=JSON.parse(JSON.stringify(o));
    c.id=scene.seq++;c.name=o.type+'.'+c.id;c.keys=[];
    c.pos=[o.pos[0]+dx*i,o.pos[1],o.pos[2]];
    c.rot=[o.rot[0],o.rot[1],o.rot[2]+rz*i];
    scene.objs.push(c);
  }
  syncStatus();
}
function deform(fn){
  const o=selObjs[0];if(!o||o.kind!=='mesh')return;
  pushUndo();
  const{mn,mx}=bboxLocal(o);
  const h=(mx[2]-mn[2])||1;
  o.verts=o.verts.map(v=>{
    const t=(v[2]-mn[2])/h;
    return fn(v,t,h);
  });
}
function moldTaper(){
  const a=parseFloat(prompt('Taper: fattore in cima (1 = nessuno)',0.3));
  if(isNaN(a))return;
  deform((v,t)=>{const s=1+(a-1)*t;return[v[0]*s,v[1]*s,v[2]];});
}
function moldTwist(){
  const g=parseFloat(prompt('Twist: gradi totali',180));
  if(isNaN(g))return;
  const r=g*Math.PI/180;
  deform((v,t)=>{const a=r*t,c=Math.cos(a),s=Math.sin(a);
    return[v[0]*c-v[1]*s,v[0]*s+v[1]*c,v[2]];});
}
function moldBend(){
  const g=parseFloat(prompt('Bend: gradi totali attorno a X',90));
  if(isNaN(g)||g===0)return;
  const r=g*Math.PI/180;
  deform((v,t,h)=>{
    const R=h/r;
    const a=r*t;
    const d=R-v[1];
    return[v[0],R-d*Math.cos(a),d*Math.sin(a)];
  });
}
function moldSheer(){
  const a=parseFloat(prompt('Sheer: spostamento X in cima',60));
  if(isNaN(a))return;
  deform((v,t)=>[v[0]+a*t,v[1],v[2]]);
}
function moldSpin(){
  const o=selObjs[0];if(!o||o.kind!=='mesh')return;
  const n=parseInt(prompt('Spin: numero di sezioni',12));
  if(isNaN(n)||n<3)return;
  pushUndo();
  const src=o.verts.slice();
  const v=[],f=[];
  for(let i=0;i<n;i++){
    const a=2*Math.PI*i/n,c=Math.cos(a),s=Math.sin(a);
    src.forEach(p=>v.push([p[0]*c-p[1]*s,p[0]*s+p[1]*c,p[2]]));
  }
  const m=src.length;
  for(let i=0;i<n;i++){
    const j=(i+1)%n;
    for(let k=0;k<m-1;k++){
      const a=i*m+k,b=i*m+k+1,c=j*m+k,d=j*m+k+1;
      f.push([a,c,d]);f.push([a,d,b]);
    }
  }
  o.verts=v;o.faces=f;o.edges=meshEdges(f);
}
function joinObjs(){
  if(selObjs.length<2)return;
  pushUndo();
  const base=selObjs[0];
  const bm=rotM(base.rot[0],base.rot[1],base.rot[2]);
  for(let i=1;i<selObjs.length;i++){
    const o=selObjs[i];
    if(o.kind!=='mesh')continue;
    const off=base.verts.length;
    const wv=worldVerts(o);
    wv.forEach(w=>{
      const l=mApplyT(bm,vsub(w,base.pos));
      base.verts.push([l[0]/base.scl[0],l[1]/base.scl[1],l[2]/base.scl[2]]);
    });
    o.faces.forEach(f=>base.faces.push(f.map(k=>k+off)));
    scene.objs=scene.objs.filter(x=>x!==o);
  }
  base.edges=meshEdges(base.faces);
  selObjs=[base];clearSub();syncStatus();
}
function delSelFaces(){
  const o=selObjs[0];if(!o||!selFaces.size)return;
  pushUndo();
  o.faces=o.faces.filter((f,i)=>!selFaces.has(i));
  o.edges=meshEdges(o.faces);
  selFaces.clear();
}

/* ======================= interazione ========================= */
let dragOp=null;
function evXY(e){
  const r=els.cv.getBoundingClientRect();
  return{mx:(e.clientX-r.left)/r.width*CW,my:(e.clientY-r.top)/r.height*CH};
}
function pickObject(vi,mx,my){
  let best=null,bd=26;
  for(const o of scene.objs){
    if(editor==='stage'&&o.kind==='camera')continue;
    const p=projView(vi,o.pos);
    if(p){const d=Math.hypot(p.x-mx,p.y-my);if(d<bd){bd=d;best=o;}}
    if(o.kind==='mesh'){
      const wv=worldVerts(o);
      for(const w of wv){const p2=projView(vi,w);
        if(p2){const d=Math.hypot(p2.x-mx,p2.y-my);if(d<bd){bd=d;best=o;}}}
    }
  }
  return best;
}
function applyAxisLock(d){return[axl.x?d[0]:0,axl.y?d[1]:0,axl.z?d[2]:0];}
function selCenter(){
  if(!selObjs.length)return[0,0,0];
  let c=[0,0,0];
  selObjs.forEach(o=>c=vadd(c,o.pos));
  return vscale(c,1/selObjs.length);
}
function wireEvents(){
  const cv=els.cv;
  els.scr.addEventListener('contextmenu',e=>e.preventDefault());
  cv.addEventListener('pointerdown',e=>{
    closeMenus();e.preventDefault();
    const{mx,my}=evXY(e);
    cv.setPointerCapture(e.pointerId);
    if(editor==='forms'){
      const i=formsPick(mx,my);
      if(i>=0){form.sel=i;dragOp={t:'formpt'};}
      else{
        const cx=CW/2,cy=CH/2,S=1.3;
        form.pts.push([Math.abs((mx-cx)/S),(cy-my)/S]);
        form.pts.sort((a,b)=>a[1]-b[1]);
        form.sel=-1;
      }
      return;
    }
    const vi=viewAt(mx,my);
    if(vi<0)return;
    const v=VIEWS[vi];
    if(editor!=='stage'&&v.persp&&!e.shiftKey){
      dragOp={t:'orbit',mx,my,th:orbit.th,ph:orbit.ph};return;
    }
    /* sub-object picking */
    const o=selObjs[0];
    if(o&&o.kind==='mesh'&&pickMode!=='obj'){
      const wv=worldVerts(o);
      if(pickMode==='pnt'){
        let bi=-1,bd=9;
        wv.forEach((w,k)=>{const p=projView(vi,w);
          if(p){const d=Math.hypot(p.x-mx,p.y-my);if(d<bd){bd=d;bi=k;}}});
        if(bi>=0){
          pushUndo();
          if(!e.shiftKey&&!selPts.has(bi))selPts.clear();
          selPts.add(bi);
          dragOp={t:'pnts',vi,mx,my,base:new Map([...selPts].map(k=>[k,[...o.verts[k]]]))};
          return;
        }
      }
      if(pickMode==='edge'){
        let bi=-1,bd=8;
        o.edges.forEach((ed,k)=>{
          const pa=projView(vi,wv[ed[0]]),pb=projView(vi,wv[ed[1]]);
          if(!pa||!pb)return;
          const d=distSeg(mx,my,pa,pb);
          if(d<bd){bd=d;bi=k;}});
        if(bi>=0){
          if(!e.shiftKey)selEdges.clear();
          selEdges.add(bi);return;
        }
      }
      if(pickMode==='face'){
        let bi=-1;
        for(let k=0;k<o.faces.length;k++){
          const p=o.faces[k].map(i2=>projView(vi,wv[i2]));
          if(p.some(q=>!q))continue;
          if(ptInPoly(mx,my,p)){bi=k;break;}
        }
        if(bi>=0){
          if(!e.shiftKey)selFaces.clear();
          selFaces.add(bi);return;
        }
      }
      band={vi,x0:mx,y0:my,x1:mx,y1:my};
      dragOp={t:'band',vi,shift:e.shiftKey};
      return;
    }
    const hit=pickObject(vi,mx,my);
    if(hit){
      if(e.shiftKey){
        if(selObjs.includes(hit))selObjs=selObjs.filter(x=>x!==hit);
        else selObjs.push(hit);
      }else if(!selObjs.includes(hit)){selObjs=[hit];clearSub();}
      syncStatus();
      pushUndo();
      dragOp={t:mode,vi,mx,my,
        snap:selObjs.map(o2=>({o:o2,pos:[...o2.pos],rot:[...o2.rot],scl:[...o2.scl]})),
        ctr:selCenter()};
    }else if(e.button===2||e.altKey){
      dragOp={t:'pan',vi,mx,my,ox:v.ox,oy:v.oy};
    }else{
      band={vi,x0:mx,y0:my,x1:mx,y1:my};
      dragOp={t:'band',vi,shift:e.shiftKey,objs:true};
    }
  });
  cv.addEventListener('pointermove',e=>{
    const{mx,my}=evXY(e);
    if(editor!=='forms'&&editor!=='stage'){
      const vi=viewAt(mx,my);
      if(vi>=0&&!VIEWS[vi].persp){
        const v=VIEWS[vi],r=viewRect(vi);
        const u=(mx-r.x-r.w/2)/v.zoom-v.ox,w=(my-r.y-r.h/2)/v.zoom-v.oy;
        els.coord.textContent=`${v.axU}:${Math.round(u)} ${v.axV}:${Math.round(-w)}`;
      }
    }
    if(!dragOp)return;
    if(dragOp.t==='formpt'&&form.sel>=0){
      const cx=CW/2,cy=CH/2,S=1.3;
      form.pts[form.sel]=[Math.max(0,(mx-cx)/S),(cy-my)/S];
      return;
    }
    const dx=mx-dragOp.mx,dy=my-dragOp.my;
    if(dragOp.t==='orbit'){
      orbit.th=dragOp.th+dx*0.008;
      orbit.ph=Math.max(-1.4,Math.min(1.4,dragOp.ph+dy*0.008));return;
    }
    if(dragOp.t==='pan'){
      const v=VIEWS[dragOp.vi];
      v.ox=dragOp.ox+dx/v.zoom;v.oy=dragOp.oy+dy/v.zoom;return;
    }
    if(dragOp.t==='band'){band.x1=mx;band.y1=my;return;}
    const v=VIEWS[dragOp.vi];
    if(dragOp.t==='pnts'){
      const o=selObjs[0];if(!o)return;
      const wd=applyAxisLock(v.drag(dx/v.zoom,dy/v.zoom));
      const m=rotM(o.rot[0],o.rot[1],o.rot[2]);
      const ld=mApplyT(m,wd);
      dragOp.base.forEach((b,k)=>{
        o.verts[k]=[snapv(b[0]+ld[0]/o.scl[0]),snapv(b[1]+ld[1]/o.scl[1]),snapv(b[2]+ld[2]/o.scl[2])];
      });
      return;
    }
    if(!dragOp.snap)return;
    if(dragOp.t==='move'){
      const wd=applyAxisLock(v.persp?[dx/v.zoom,0,-dy/v.zoom]:v.drag(dx/v.zoom,dy/v.zoom));
      dragOp.snap.forEach(s=>{
        s.o.pos=[snapv(s.pos[0]+wd[0]),snapv(s.pos[1]+wd[1]),snapv(s.pos[2]+wd[2])];});
      syncStatus();
    }
    if(dragOp.t==='rotate'){
      const ax=v.persp?2:v.rotAx;
      dragOp.snap.forEach(s=>{
        const r=[...s.rot];r[ax]+=dx*0.01;s.o.rot=r;
        if(dragOp.snap.length>1){
          const rel=vsub(s.pos,dragOp.ctr);
          const c=Math.cos(dx*0.01),si=Math.sin(dx*0.01);
          let nr=[...rel];
          if(ax===2)nr=[rel[0]*c-rel[1]*si,rel[0]*si+rel[1]*c,rel[2]];
          if(ax===1)nr=[rel[0]*c+rel[2]*si,rel[1],-rel[0]*si+rel[2]*c];
          if(ax===0)nr=[rel[0],rel[1]*c-rel[2]*si,rel[1]*si+rel[2]*c];
          s.o.pos=vadd(dragOp.ctr,nr);
        }
      });
    }
    if(dragOp.t==='scale'){
      const f=Math.max(0.05,1+(dx-dy)*0.005);
      dragOp.snap.forEach(s=>{
        s.o.scl=[axl.x?s.scl[0]*f:s.scl[0],axl.y?s.scl[1]*f:s.scl[1],axl.z?s.scl[2]*f:s.scl[2]];
        if(dragOp.snap.length>1)s.o.pos=vadd(dragOp.ctr,vscale(vsub(s.pos,dragOp.ctr),f));
      });
    }
  });
  cv.addEventListener('pointerup',e=>{
    if(dragOp&&dragOp.t==='band'&&band){
      const x0=Math.min(band.x0,band.x1),x1=Math.max(band.x0,band.x1);
      const y0=Math.min(band.y0,band.y1),y1=Math.max(band.y0,band.y1);
      const vi=band.vi;
      if(Math.abs(x1-x0)>3||Math.abs(y1-y0)>3){
        if(dragOp.objs){
          if(!dragOp.shift)selObjs=[];
          scene.objs.forEach(o=>{
            const p=projView(vi,o.pos);
            if(p&&p.x>=x0&&p.x<=x1&&p.y>=y0&&p.y<=y1&&!selObjs.includes(o))selObjs.push(o);});
          syncStatus();
        }else{
          const o=selObjs[0];
          if(o){
            const wv=worldVerts(o);
            if(!dragOp.shift)selPts.clear();
            wv.forEach((w,k)=>{const p=projView(vi,w);
              if(p&&p.x>=x0&&p.x<=x1&&p.y>=y0&&p.y<=y1)selPts.add(k);});
          }
        }
      }else if(dragOp.objs&&!dragOp.shift){selObjs=[];clearSub();syncStatus();}
    }
    band=null;dragOp=null;
  });
  cv.addEventListener('dblclick',()=>{
    if(editor!=='detail')return;
    const r=els.cv.getBoundingClientRect();
    singleView=(singleView>=0)?-1:0;
  });
  cv.addEventListener('wheel',e=>{
    e.preventDefault();
    const{mx,my}=evXY(e);
    const vi=viewAt(mx,my);
    if(vi<0)return;
    const f=e.deltaY<0?1.15:1/1.15;
    if(editor==='stage'){const c=camObj();if(c)c.pos=vscale(c.pos,1/f);return;}
    if(VIEWS[vi].persp)orbit.dist=Math.max(150,Math.min(4000,orbit.dist/f));
    else VIEWS[vi].zoom=Math.max(0.05,Math.min(12,VIEWS[vi].zoom*f));
  },{passive:false});

  document.addEventListener('keydown',e=>{
    if(!visible)return;
    if(e.target.tagName==='INPUT')return;
    const k=e.key;
    if(k==='F1'){e.preventDefault();setPick('pnt');}
    if(k==='F2'){e.preventDefault();setPick('edge');}
    if(k==='F3'){e.preventDefault();setPick('face');}
    if(k==='F4'){e.preventDefault();setPick('obj');}
    if(k==='F5'){e.preventDefault();setEditor('detail');}
    if(k==='F6'){e.preventDefault();setEditor('forms');}
    if(k==='F7'){e.preventDefault();setEditor('stage');}
    if(k==='F8'){e.preventDefault();setEditor('action');}
    if(k==='F9'){e.preventDefault();renderScan(320,256);}
    if(k==='F10'){e.preventDefault();els.keys.classList.toggle('on');}
    if(k==='m')setMode('move');
    if(k==='r')setMode('rotate');
    if(k==='h')setMode('scale');
    if(k==='t')openTransform();
    if(k==='a'&&!e.ctrlKey){selObjs=scene.objs.slice();syncStatus();}
    if(k==='d'&&!e.ctrlKey){selObjs=[];clearSub();syncStatus();}
    if(k==='g')snap=!snap,syncStatus();
    if(k==='l')localAxis=!localAxis,syncStatus();
    if(k==='u')undo();
    if(k==='c')dupObj();
    if(k==='j')joinObjs();
    if(k==='k')makeKey();
    if(k==='Delete'||k==='Backspace'){
      if(pickMode==='face'&&selFaces.size)delSelFaces();else delObj();
    }
    if(k==='ArrowRight'){gotoFrame(curFrame+1);}
    if(k==='ArrowLeft'){gotoFrame(curFrame-1);}
  });
}
function distSeg(px,py,a,b){
  const vx=b.x-a.x,vy=b.y-a.y;
  const l=vx*vx+vy*vy;
  let t=l?((px-a.x)*vx+(py-a.y)*vy)/l:0;
  t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(a.x+vx*t),py-(a.y+vy*t));
}
function ptInPoly(x,y,p){
  let c=false;
  for(let i=0,j=p.length-1;i<p.length;j=i++){
    if(((p[i].y>y)!==(p[j].y>y))&&
       (x<(p[j].x-p[i].x)*(y-p[i].y)/(p[j].y-p[i].y)+p[i].x))c=!c;
  }
  return c;
}
function setMode(m){mode=m;syncStatus();}
function setPick(p){pickMode=p;if(p==='obj')clearSub();syncStatus();}
function delObj(){
  if(!selObjs.length)return;
  pushUndo();
  scene.objs=scene.objs.filter(o=>!selObjs.includes(o));
  selObjs=[];clearSub();syncStatus();buildTimeline();
}
function dupObj(){
  if(!selObjs.length)return;
  pushUndo();
  const cop=selObjs.map(o=>{
    const c=JSON.parse(JSON.stringify(o));
    c.id=scene.seq++;c.name=o.type+'.'+c.id;
    c.pos=vadd(c.pos,[40,0,0]);
    scene.objs.push(c);return c;});
  selObjs=cop;syncStatus();buildTimeline();
}
function syncStatus(){
  if(!els.status)return;
  const pm={obj:'OBJECTS',pnt:'POINTS',edge:'EDGES',face:'FACES'}[pickMode];
  els.mode.textContent=`PICK ${pm} | ${mode.toUpperCase()}${snap?' | SNAP':''}${localAxis?' | LOCAL':''}`;
  els.selName.textContent=selObjs.length?(selObjs.length>1?selObjs.length+' objects':selObjs[0].name):'--';
  ['x','y','z'].forEach(a=>els['ax'+a].classList.toggle('on',axl[a]));
  els.scr.querySelectorAll('[data-pk]').forEach(b=>b.classList.toggle('on',b.dataset.pk===pickMode));
  els.scr.querySelectorAll('[data-md]').forEach(b=>b.classList.toggle('on',b.dataset.md===mode));
}
