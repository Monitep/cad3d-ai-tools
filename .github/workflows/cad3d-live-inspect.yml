name: CAD3D - lettura sorgenti pubblicati

on:
  push:
    branches: [main]
    paths: [.github/cad3d-live/inspect.json]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
      - name: Validate public file paths
        run: python3 .github/tools/capture-cad3d-live.py --validate
      - name: Read current files without changing the server
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 .github/tools/capture-cad3d-live.py --out "$RUNNER_TEMP/cad3d-source"
      - name: Preserve current public source bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cad3d-public-source-${{ github.run_id }}
          path: ${{ runner.temp }}/cad3d-source/
          retention-days: 30
          if-no-files-found: error
