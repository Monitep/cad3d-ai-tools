name: Deploy FTP su Aruba

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Verify CAD3D source and generated pages
        run: |
          python3 .github/tools/build-cad3d-preview.py --check
          python3 .github/tools/check-cad3d-preview.py
          node --check cad3d-preview/assets/navigation.js
          node --check cad3d-preview/assets/site.js
      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /www.cad3d.expert/ai/
          exclude: |
            **/.git*
            **/.git*/**
            README.md
            AGENTS.md
            CLAUDE.md
            .openai/**
            .github/**
