name: CAD3D - aggiornamento sito pubblico

on:
  pull_request:
    paths:
      - .github/cad3d-live/**
      - .github/tools/cad3d-live.py
      - .github/tools/test-cad3d-live.py
      - .github/tools/build-cad3d-home-performance.py
      - .github/tools/test-cad3d-home-performance.mjs
      - .github/workflows/cad3d-live.yml
      - cad3d-preview/assets/villa-ai-v4.webp
      - cad3d-preview/assets/villa-mobile-ai-v4.webp
  push:
    branches: [main]
    paths:
      # A source-only change does not deploy the public site. Review its release too.
      - .github/cad3d-live/release.json
  workflow_dispatch:
    inputs:
      operation:
        description: 'plan verifica senza modifiche; deploy pubblica il rilascio di main'
        type: choice
        options: [plan, deploy]
        default: plan
        required: true

permissions:
  contents: read

concurrency:
  group: cad3d-public-site
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate reviewed files and deployment behavior
        run: |
          python3 .github/tools/cad3d-live.py validate
          python3 .github/tools/test-cad3d-live.py
          python3 .github/tools/build-cad3d-home-performance.py --check
          node .github/tools/test-cad3d-home-performance.mjs
          node --check .github/cad3d-live/payload/assets/site-performance-v1.js
          node --check .github/cad3d-live/payload/assets/media-performance-v1.js
          git diff --check

  publish:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check current server bytes and prepare backup
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 .github/tools/cad3d-live.py plan --out "$RUNNER_TEMP/cad3d-live"
      - name: Preserve backup before the first server write
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cad3d-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cad3d-live/
          retention-days: 30
          if-no-files-found: error
      - name: Publish only the listed CAD3D files and verify their bytes
        if: github.event_name == 'push' || inputs.operation == 'deploy'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 .github/tools/cad3d-live.py apply --out "$RUNNER_TEMP/cad3d-live"
      - name: Verify public HTTPS delivery and home
        if: github.event_name == 'push' || inputs.operation == 'deploy'
        run: python3 .github/tools/cad3d-live.py http
      - name: Release summary
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          OPERATION: ${{ inputs.operation }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          plan = Path(os.environ['RUNNER_TEMP']) / 'cad3d-live/plan.json'
          if plan.exists():
              data = json.loads(plan.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write('## CAD3D.Expert\n\nRilascio: `' + data['release_id'] + '`\n\n')
                  f.write('Operazione richiesta: ' + ('deploy' if os.environ['EVENT_NAME'] == 'push' else os.environ['OPERATION']) + '\n\n')
                  f.write('Il risultato effettivo è nello stato dei passaggi del workflow.\n\n')
                  f.write('| File | Piano | Byte prima | Byte dopo |\n|---|---|---:|---:|\n')
                  for e in data['files']:
                      f.write(f"| {e['target']} | {e['status']} | {e['before_bytes']} | {e['after_bytes']} |\n")
                  f.write('\nDestinazione unica: `_cad3d-site/`. Backup negli artifact della run.\n')
          PY
