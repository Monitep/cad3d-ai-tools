<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Aetherion — L'Ultima Profezia</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#c9a84c;--gl:#e8cc7a;--gd:#8a6820;--blood:#8b1a1a;--night:#05050f;--pt:#f4e8c1;--txt:#2a1f0e;--cc:#c0392b;--mc:#8e44ad;--hc:#27ae60}
html,body{width:100%;height:100%;overflow:hidden;background:var(--night);font-family:'EB Garamond',Georgia,serif}
#bgc{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;width:100%;height:100vh;display:flex;align-items:center;justify-content:center;padding:12px;overflow-y:auto}

/* TITLE */
#ts{text-align:center;color:var(--gold);max-width:700px;width:100%}
#ts h1{font-family:'Cinzel Decorative',serif;font-size:clamp(1.9rem,7vw,4.2rem);color:var(--gl);text-shadow:0 0 40px rgba(201,168,76,.6),0 0 80px rgba(201,168,76,.2);letter-spacing:.08em;margin-bottom:.3em;animation:glow 3s ease-in-out infinite alternate}
#ts .sub{font-family:'Cinzel',serif;font-size:clamp(.75rem,2vw,1rem);color:var(--gd);letter-spacing:.35em;text-transform:uppercase;margin-bottom:2rem}
#ts .tag{font-style:italic;color:rgba(201,168,76,.5);font-size:clamp(.88rem,2vw,1.02rem);margin-bottom:2rem}
#startb{font-family:'Cinzel',serif;font-size:.95rem;letter-spacing:.2em;color:var(--night);background:linear-gradient(135deg,var(--gl),var(--gold),var(--gd));border:none;cursor:pointer;padding:.85rem 2.5rem;clip-path:polygon(12px 0%,calc(100% - 12px) 0%,100% 50%,calc(100% - 12px) 100%,12px 100%,0% 50%);transition:all .3s;text-transform:uppercase}
#startb:hover{transform:scale(1.06);box-shadow:0 0 35px rgba(201,168,76,.5)}
.meta{margin-top:1.4rem;font-family:'Cinzel',serif;font-size:.68rem;color:var(--gd);letter-spacing:.2em;opacity:.5}
@keyframes glow{from{text-shadow:0 0 20px rgba(201,168,76,.4)}to{text-shadow:0 0 55px rgba(201,168,76,.9),0 0 100px rgba(201,168,76,.3)}}

/* CARD */
#gc{display:none;max-width:820px;width:100%;background:linear-gradient(165deg,#f6ead5 0%,#e8d4a0 45%,#d4bf78 100%);border-radius:3px;position:relative;
  box-shadow:0 0 0 1px var(--gd),0 0 0 3px #2a1f0e,0 0 0 5px var(--gd),0 6px 70px rgba(0,0,0,.85);
  overflow:hidden;max-height:96vh;overflow-y:auto}
#gc::-webkit-scrollbar{width:5px}#gc::-webkit-scrollbar-thumb{background:var(--gd);border-radius:3px}
.crn{position:absolute;width:55px;height:55px;z-index:5;pointer-events:none}
.c1{top:0;left:0}.c2{top:0;right:0;transform:scaleX(-1)}.c3{bottom:0;left:0;transform:scaleY(-1)}.c4{bottom:0;right:0;transform:scale(-1)}
#art{width:100%;height:185px;overflow:hidden;border-bottom:2px solid var(--gd);flex-shrink:0}
#art svg{width:100%;height:100%}
#chap{font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.45em;text-transform:uppercase;color:var(--gd);text-align:center;padding:.7rem 2rem 0;opacity:.6}
#stitle{font-family:'Cinzel Decorative',serif;font-size:clamp(.95rem,3vw,1.45rem);color:var(--blood);text-align:center;padding:.35rem 1.8rem .7rem;line-height:1.3}
.dv{width:73%;margin:0 auto .85rem;height:1px;background:linear-gradient(90deg,transparent,var(--gd),transparent);position:relative}
.dv::before{content:'❧';position:absolute;top:-.6em;left:50%;transform:translateX(-50%);color:var(--gd);font-size:.9rem}
#stxt{font-size:clamp(.9rem,2vw,1.06rem);line-height:1.85;color:var(--txt);padding:0 1.7rem 1rem;text-align:justify;hyphens:auto}
#stxt em{font-style:italic;color:#5a3a10}#stxt strong{font-weight:600;color:var(--blood)}#stxt p{margin-bottom:.55em}
#stats{display:flex;gap:.7rem;justify-content:center;padding:.45rem 1.5rem .7rem;border-top:1px solid rgba(139,96,32,.22);flex-wrap:wrap}
.si{display:flex;align-items:center;gap:.4rem;font-family:'Cinzel',serif;font-size:.67rem;letter-spacing:.1em}
.sl{color:var(--gd);text-transform:uppercase}
.sp{display:flex;gap:3px}
.pp{width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor;transition:background .3s,transform .2s}
.pp.on{background:currentColor;transform:scale(1.1)}
.sc{color:var(--cc)}.sm{color:var(--mc)}.sh{color:var(--hc)}
#ebadge{text-align:center;padding:.7rem 2rem 0;display:none}
#ebadge .bt{font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gd);border:1px solid var(--gd);padding:.3em 1em;display:inline-block}
#chs{padding:.25rem 1.3rem 1.3rem;display:flex;flex-direction:column;gap:.52rem}
.cb{font-family:'EB Garamond',Georgia,serif;font-size:clamp(.86rem,2vw,.96rem);color:var(--txt);background:linear-gradient(135deg,rgba(255,255,255,.36),rgba(220,200,140,.32));border:1px solid var(--gd);border-radius:2px;padding:.7rem 1rem;text-align:left;cursor:pointer;transition:all .22s;line-height:1.42}
.cb::before{content:'◆';margin-right:.55em;color:var(--gd);font-size:.62em;transition:color .2s}
.cb:hover{background:linear-gradient(135deg,rgba(201,168,76,.22),rgba(201,168,76,.07));border-color:var(--gold);transform:translateX(5px);box-shadow:-4px 0 0 var(--gold)}
.cb:hover::before{color:var(--gold)}
.cb:active{transform:translateX(7px)}
#restb{font-family:'Cinzel',serif;font-size:.82rem;letter-spacing:.2em;color:var(--pt);background:linear-gradient(135deg,var(--blood),#5a0f0f);border:none;cursor:pointer;padding:.7rem 1.8rem;margin:.2rem auto 1.3rem;display:none;width:fit-content;transition:all .3s;text-transform:uppercase}
#restb:hover{transform:scale(1.05);box-shadow:0 0 25px rgba(139,26,26,.4)}
#ov{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at center,#150520 0%,#000 100%);pointer-events:none;opacity:0;transition:opacity .45s}
#ov.on{opacity:1;pointer-events:all}
@media(max-width:600px){#art{height:135px}#stxt{padding:0 .9rem .9rem}#chs{padding:.2rem .8rem 1.1rem}.cb{padding:.62rem .85rem}#ts h1{font-size:clamp(1.6rem,10vw,2.8rem)}}

/* ── SETTINGS ── */
:root{--fs:1rem}
#stxt{font-size:var(--fs)!important;line-height:1.85}
.cb{font-size:calc(var(--fs) * .9)!important}

#settb{position:fixed;bottom:18px;right:18px;z-index:300;width:42px;height:42px;border-radius:50%;background:rgba(10,10,20,.7);border:1px solid rgba(255,255,255,.18);color:#bbb;font-size:1.15rem;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px);transition:all .2s;touch-action:manipulation}
#settb:hover{background:rgba(20,20,35,.9);color:#fff;transform:scale(1.08)}
#settp{position:fixed;bottom:68px;right:18px;z-index:300;background:#141420;border:1px solid #2a2a3a;border-radius:14px;padding:18px 16px;width:210px;display:none;box-shadow:0 8px 32px rgba(0,0,0,.6)}
#settp.open{display:block}
#settp h3{font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.25em;text-transform:uppercase;color:#666;margin-bottom:14px}
.srow{margin-bottom:14px}
.srow:last-child{margin-bottom:0}
.slbl{font-size:.68rem;color:#888;margin-bottom:7px;font-family:'Cinzel',serif;letter-spacing:.12em;text-transform:uppercase}
.szbx,.thbx{display:flex;gap:5px}
.szb,.thb{padding:5px 0;border-radius:7px;border:1px solid #2a2a3a;background:#1a1a28;color:#888;font-size:.75rem;cursor:pointer;transition:all .15s;font-family:'Cinzel',serif;flex:1;text-align:center;touch-action:manipulation}
.thb{font-size:1rem;padding:4px 0}
.szb.on,.thb.on{border-color:#c9a84c;color:#c9a84c;background:rgba(201,168,76,.12)}
.szb:hover:not(.on),.thb:hover:not(.on){border-color:#444;color:#ccc}

/* LIGHT theme */
body.t-light{background:#ddd8c8}
body.t-light #bgc{opacity:.08}
body.t-light #gc{background:linear-gradient(165deg,#fff 0%,#f8f3e8 45%,#ede5cc 100%)}
body.t-light #ts h1{color:#2a1f0e;text-shadow:none;animation:none}
body.t-light #ts .sub,body.t-light #ts .tag{color:#8a6820}
body.t-light #settp{background:#f5f0e8;border-color:#d0c8b0}
body.t-light .szb,body.t-light .thb{background:#e8e0d0;border-color:#c8c0a8;color:#666}
body.t-light .szb.on,body.t-light .thb.on{border-color:#8a6820;color:#8a6820;background:rgba(138,104,32,.1)}
body.t-light #settp h3{color:#aaa}
body.t-light .slbl{color:#aaa}
body.t-light #settb{background:rgba(255,255,255,.75);border-color:rgba(0,0,0,.2);color:#555}

/* SEPIA theme */
body.t-sepia{background:#0d0905}
body.t-sepia #gc{background:linear-gradient(165deg,#fef4d8 0%,#f5dc98 45%,#e8c058 100%)}

/* BLUE theme */
body.t-blue{background:#040810}
body.t-blue #gc{background:linear-gradient(165deg,#e2ecf8 0%,#cddaee 45%,#b8cae0 100%)}
body.t-blue #stxt{color:#1a2030}
body.t-blue #stxt em{color:#2a4060}
body.t-blue #stitle{color:#1a3560}
body.t-blue #chap{color:#4a6a90}
</style>
</head>
<body>
<canvas id="bgc"></canvas>
<div id="ov"></div>

<button id="settb" title="Impostazioni">⚙</button>
<div id="settp">
  <h3>⚙ Impostazioni</h3>
  <div class="srow">
    <div class="slbl">Dimensione testo</div>
    <div class="szbx" id="szbx"></div>
  </div>
  <div class="srow">
    <div class="slbl">Tema</div>
    <div class="thbx" id="thbx"></div>
  </div>
</div>
<div id="app">

<div id="ts">
  <svg viewBox="0 0 400 160" style="width:min(360px,88%);margin:0 auto 1.3rem;display:block" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="tsk" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#050520"/><stop offset="100%" stop-color="#0a1520"/></linearGradient><radialGradient id="tg" cx="50%" cy="65%" r="55%"><stop offset="0%" stop-color="#c9a84c" stop-opacity=".32"/><stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/></radialGradient></defs>
    <rect width="400" height="160" fill="url(#tsk)" rx="2"/>
    <circle cx="330" cy="32" r="20" fill="#c9b870" opacity=".82"/><circle cx="323" cy="28" r="17" fill="#101830" opacity=".65"/>
    <circle cx="30" cy="18" r="1.1" fill="white" opacity=".7"/><circle cx="75" cy="8" r=".8" fill="white" opacity=".6"/><circle cx="130" cy="22" r="1" fill="white" opacity=".8"/><circle cx="190" cy="6" r=".8" fill="white" opacity=".5"/><circle cx="250" cy="16" r="1.1" fill="white" opacity=".7"/><circle cx="370" cy="12" r=".9" fill="white" opacity=".6"/><circle cx="55" cy="45" r=".7" fill="white" opacity=".4"/><circle cx="170" cy="50" r=".8" fill="white" opacity=".5"/>
    <circle cx="200" cy="160" r="90" fill="url(#tg)"/>
    <rect x="140" y="60" width="120" height="100" fill="#0d0d1c"/><rect x="130" y="42" width="36" height="90" fill="#0c0c1a"/><rect x="234" y="42" width="36" height="90" fill="#0c0c1a"/>
    <rect x="130" y="37" width="8" height="11" fill="#0c0c1a"/><rect x="143" y="37" width="8" height="11" fill="#0c0c1a"/><rect x="156" y="37" width="8" height="11" fill="#0c0c1a"/>
    <rect x="234" y="37" width="8" height="11" fill="#0c0c1a"/><rect x="247" y="37" width="8" height="11" fill="#0c0c1a"/><rect x="260" y="37" width="8" height="11" fill="#0c0c1a"/>
    <path d="M178,160 L178,118 Q200,100 222,118 L222,160" fill="#06060f"/>
    <rect x="190" y="28" width="3" height="40" fill="#c9a84c"/><polygon points="193,28 208,38 193,48" fill="#c9a84c"/>
    <rect x="143" y="70" width="10" height="14" fill="#8b1a1a" opacity=".8"><animate attributeName="opacity" values=".4;.95;.4" dur="2.2s" repeatCount="indefinite"/></rect>
    <rect x="247" y="70" width="10" height="14" fill="#8b1a1a" opacity=".8"><animate attributeName="opacity" values=".5;1;.5" dur="1.8s" repeatCount="indefinite"/></rect>
    <polygon points="50,160 35,110 65,110" fill="#091509" opacity=".9"/><polygon points="70,160 58,122 82,122" fill="#0e200e" opacity=".8"/>
    <polygon points="360,160 345,108 375,108" fill="#091509" opacity=".9"/><polygon points="380,160 368,120 392,120" fill="#0e200e" opacity=".8"/>
    <text x="200" y="154" text-anchor="middle" font-size="9" fill="#c9a84c" opacity=".3" font-family="serif">ᚠ ᚢ ᚦ ᚨ ᚱ ᚲ ᚷ ᚹ ᚺ ᚾ ᛁ ᛃ ᛇ ᛈ</text>
  </svg>
  <h1>Aetherion</h1>
  <div class="sub">L'Ultima Profezia</div>
  <div class="tag">Un regno sull'orlo dell'abisso. Sei la sua speranza... o il suo ultimo errore.</div>
  <button id="startb" onclick="startGame()">&#9658; Inizia l'Avventura</button>
  <div class="meta">7 finali &nbsp;·&nbsp; 30+ scene &nbsp;·&nbsp; strade infinite</div>
</div>

<div id="gc">
  <svg class="crn c1" viewBox="0 0 55 55" fill="none"><path d="M0 55L0 0L55 0" stroke="#8a6820" stroke-width="1.5"/><path d="M5 55L5 5L55 5" stroke="#c9a84c" stroke-width=".5"/><circle cx="5" cy="5" r="2.8" fill="#c9a84c"/><path d="M5 22L22 5" stroke="#c9a84c" stroke-width=".5"/><circle cx="5" cy="22" r="1.3" fill="#8a6820" opacity=".5"/></svg>
  <svg class="crn c2" viewBox="0 0 55 55" fill="none"><path d="M0 55L0 0L55 0" stroke="#8a6820" stroke-width="1.5"/><path d="M5 55L5 5L55 5" stroke="#c9a84c" stroke-width=".5"/><circle cx="5" cy="5" r="2.8" fill="#c9a84c"/><path d="M5 22L22 5" stroke="#c9a84c" stroke-width=".5"/></svg>
  <svg class="crn c3" viewBox="0 0 55 55" fill="none"><path d="M0 55L0 0L55 0" stroke="#8a6820" stroke-width="1.5"/><path d="M5 55L5 5L55 5" stroke="#c9a84c" stroke-width=".5"/><circle cx="5" cy="5" r="2.8" fill="#c9a84c"/><path d="M5 22L22 5" stroke="#c9a84c" stroke-width=".5"/></svg>
  <svg class="crn c4" viewBox="0 0 55 55" fill="none"><path d="M0 55L0 0L55 0" stroke="#8a6820" stroke-width="1.5"/><path d="M5 55L5 5L55 5" stroke="#c9a84c" stroke-width=".5"/><circle cx="5" cy="5" r="2.8" fill="#c9a84c"/><path d="M5 22L22 5" stroke="#c9a84c" stroke-width=".5"/></svg>
  <div id="art"></div>
  <div id="chap"></div>
  <h2 id="stitle"></h2>
  <div class="dv"></div>
  <div id="stxt"></div>
  <div id="stats">
    <div class="si sc"><span class="sl">Coraggio</span><div class="sp" id="pc"></div></div>
    <div class="si sm"><span class="sl">Magia</span><div class="sp" id="pm"></div></div>
    <div class="si sh"><span class="sl">Onore</span><div class="sp" id="po"></div></div>
  </div>
  <div id="ebadge"><div class="bt"></div></div>
  <div id="chs"></div>
  <button id="restb" onclick="restartGame()">&#8635; Ricomincia da Capo</button>
</div>

</div>
<script>
// ── ENGINE ──────────────────────────────────────────────────
const S={c:0,m:0,o:0};
const F={};
function ae(e){if(!e)return;for(const[k,v]of Object.entries(e)){if(k in S)S[k]=Math.max(0,Math.min(6,S[k]+v));else F[k]=true}}
function pips(id,val,col){const el=document.getElementById(id);if(!el)return;el.innerHTML='';for(let i=0;i<6;i++){const d=document.createElement('div');d.className='pp'+(i<val?' on':'');d.style.color=col;el.appendChild(d)}}
function upStats(){pips('pc',S.c,'var(--cc)');pips('pm',S.m,'var(--mc)');pips('po',S.o,'var(--hc)')}

// ── SVG SCENES ───────────────────────────────────────────────
const ARTS={
forest:`<svg viewBox="0 0 820 185" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#050d20"/><stop offset="55%" stop-color="#0d1e30"/><stop offset="100%" stop-color="#0a180a"/></linearGradient></defs><rect width="820" height="185" fill="url(#a)"/><circle cx="640" cy="40" r="25" fill="#c9b870" opacity=".85"/><circle cx="632" cy="35" r="21" fill="#0d1e30" opacity=".6"/><circle cx="50" cy="16" r="1.2" fill="white" opacity=".7"/><circle cx="120" cy="7" r=".9" fill="white" opacity=".6"/><circle cx="200" cy="20" r="1" fill="white" opacity=".8"/><circle cx="300" cy="9" r=".8" fill="white" opacity=".5"/><circle cx="410" cy="14" r="1.1" fill="white" opacity=".7"/><circle cx="500" cy="5" r=".9" fill="white" opacity=".6"/><circle cx="720" cy="17" r="1" fill="white" opacity=".8"/><circle cx="160" cy="38" r=".7" fill="white" opacity=".4"/><circle cx="350" cy="30" r=".8" fill="white" opacity=".5"/><circle cx="580" cy="26" r=".7" fill="white" opacity=".4"/><polygon points="50,185 28,98 72,98" fill="#071207" opacity=".95"/><polygon points="50,162 33,112 67,112" fill="#0d200d" opacity=".8"/><polygon points="130,185 108,86 152,86" fill="#071207" opacity=".95"/><polygon points="130,160 115,103 145,103" fill="#0d200d" opacity=".8"/><polygon points="210,185 192,93 228,93" fill="#071207"/><polygon points="290,185 265,80 315,80" fill="#061006"/><polygon points="290,158 272,98 308,98" fill="#0d200d" opacity=".8"/><polygon points="480,185 460,88 500,88" fill="#071207"/><polygon points="560,185 540,96 580,96" fill="#0a1a0a"/><polygon points="640,185 615,83 665,83" fill="#071207"/><polygon points="720,185 700,90 740,90" fill="#0a1a0a"/><polygon points="790,185 772,98 808,98" fill="#071207"/><ellipse cx="410" cy="185" rx="420" ry="52" fill="#081508" opacity=".55"/><circle cx="160" cy="167" r="2" fill="#a8ff70" opacity=".7"><animate attributeName="opacity" values=".3;.9;.3" dur="1.5s" repeatCount="indefinite"/></circle><c const STORY={
start:{chapter:"Prologo",title:"Il Cercatore Senza Nome",bg:"forest",text:`<p>Il bosco di Aetherion tace. Anche gli uccelli notturni sembrano trattenere il respiro.</p><p>Sei <em>il Cercatore</em> — un viaggiatore senza passato conosciuto, svegliato da uno strano sogno: una voce antica che ripeteva il tuo nome. Un nome che non ricordi di avere mai sentito.</p><p>Un corvo nero si posa davanti a te. Al collo porta un messaggio sigillato con cera rossa. Lo apri. Tre sole parole: <strong>"I Sigilli Sono Rotti."</strong></p><p>Il Re Oscuro <strong>Malachar</strong> ha spezzato i Sigilli Antichi che separavano il mondo dei vivi dall'oscurità eterna. L'alba di sangue colorerà il cielo entro poche ore. Tre sentieri si aprono davanti a te nel bosco.</p>`,choices:[{text:"Seguire la luce viola che promana dalla Torre di Vetro Nero a nord",next:"tower_approach",effect:{m:1}},{text:"Unirsi alla pattuglia di elfi che passa silenziosa tra gli alberi",next:"elf_patrol",effect:{o:1}},{text:"Avanzare verso il bagliore rossastro delle rovine del Castello Cadente",next:"castle_ruins",effect:{c:1}}]},

tower_approach:{chapter:"Capitolo I",title:"La Torre di Vetro Nero",bg:"tower",text:`<p>La torre si erge contro il cielo tempestoso come un dito oscuro che punta verso le stelle. Il Mago <strong>Vethoran</strong> ti apre la porta prima ancora che tu bussi. È vecchissimo, con occhi color ambra che hanno visto troppo.</p><p><em>"Ti aspettavo,"</em> dice. Senza aspettare risposta, ti conduce al piano superiore dove un libro rilegato in pelle nera pulsa su un leggio di ferro.</p><p><em>"Il <strong>Grimorio di Nyx</strong>. Scritto col sangue degli antichi Portatori. Promette il potere di spezzare Malachar... ma nessuno ha mai chiuso questo libro una volta aperto."</em></p>`,choices:[{text:"Prendere il Grimorio di Nyx — qualunque prezzo valga la pena",next:"grimoire_accept",effect:{m:2}},{text:"Rifiutare il grimorio e chiedere un'altra via",next:"tower_refuse",effect:{o:1}},{text:"Chiedere a Vethoran di insegnarti la magia bianca della torre",next:"tower_white",effect:{m:1,o:1}}]},

grimoire_accept:{chapter:"Capitolo I",title:"Il Patto con la Pagina",bg:"ritual",text:`<p>Il momento in cui le tue dita toccano la copertina, una corrente fredda risale il braccio. Le parole del grimorio si spostano come creature vive. Poi ti guardano. Ti leggono.</p><p>Vethoran si fa indietro, il viso pallido. <em>"Raramente vedo qualcuno che il libro sceglie volontariamente."</em></p><p>Capisci il potere dentro quelle pagine. Sortilegi capaci di fermare un esercito. Ma c'è una nota a margine scritta con inchiostro rosso scuro: <strong>"Chi usa queste parole diventa le parole."</strong></p>`,choices:[{text:"Usare subito la magia oscura per spazzare via le avanguardie di Malachar",next:"grimoire_dark",effect:{m:1}},{text:"Studiare solo i sortilegi difensivi, evitare quelli corruttivi",next:"grimoire_study",effect:{o:1}},{text:"Cercare nel grimorio un modo per distruggere Malachar senza l'oscurità",next:"grimoire_research",effect:{m:1,o:1}}]},

grimoire_dark:{chapter:"Capitolo II",title:"Il Sapore del Potere",bg:"battle",text:`<p>Le parole del grimorio escono dalla tua bocca in una lingua che non hai mai imparato. Le guardie di Malachar vengono sollevate dalla tempesta di magia e sbattute contro le rocce. È stato facile. Troppo facile.</p><p>Guardi le tue mani. Ci sono filamenti scuri sotto la pelle. Spariscono in pochi secondi. Ma erano là.</p><p><em>"Continua così e diventerai ciò che vuoi distruggere,"</em> ti dice una voce. Non sai se è la tua o del grimorio.</p>`,choices:[{text:"Ignorare l'avvertimento — il fine giustifica i mezzi",next:"ending_dark_king",effect:{m:2,o:-3}},{text:"Fermarti e cercare il Rituale Antico che può purificarti",next:"ancient_ritual",effect:{o:1}},{text:"Continuare verso Malachar ma con disciplina e controllo",next:"dark_king_battle",effect:{c:1,m:1}}]},

grimoire_study:{chapter:"Capitolo II",title:"La Profezia Nascosta",bg:"tower",text:`<p>Settimane di studio nella torre. Notti senza sonno. Poi, al centro del grimorio, trovi una pagina che non avevi visto prima: <strong>La Profezia del Due.</strong></p><p><em>"Solo chi porta entrambe le nature — luce e oscurità — può porre fine a Malachar. Non spezzandolo. Comprendendolo."</em></p><p>Vethoran legge sopra la tua spalla. <em>"Malachar non era sempre Re Oscuro. Qualcuno lo ha trasformato. Qualcuno che è ancora tra noi."</em></p>`,choices:[{text:"Andare dagli elfi per capire chi ha trasformato Malachar",next:"elf_convergence",effect:{o:1}},{text:"Procedere direttamente al castello armato di questa conoscenza",next:"dark_king_truth",effect:{c:1,m:1}}]},

grimoire_research:{chapter:"Capitolo II",title:"Le Catene di Vetro",bg:"ritual",text:`<p>Trovi ciò che cercavi: il sortilegio <strong>Vinculum Vitreus</strong> — le Catene di Vetro. Non distrugge. Imprigiona. Spezza il potere di Malachar senza toccare la sua anima.</p><p>Ma richiede tre fonti di magia pura: <em>un elfo che non abbia mai mentito, un guerriero che non abbia mai fuggito, e un mago che abbia rinunciato al potere.</em></p><p>Vethoran sorride tristemente. <em>"Io sono il terzo. Ho rinunciato al potere trent'anni fa. Tu devi trovare gli altri due."</em></p>`,choices:[{text:"Cercare l'elfo nella foresta di Aetherion",next:"elf_patrol",effect:{o:1}},{text:"Cercare il guerriero nelle rovine del castello",next:"castle_ruins",effect:{c:1}}]},

tower_refuse:{chapter:"Capitolo I",title:"La Mappa delle Rovine",bg:"tower",text:`<p><em>"Saggio,"</em> dice Vethoran, e sembra quasi sollevato. Ti porge una mappa su carta antichissima. Mostra le rovine di una città elfica sepolta — <strong>Liraneth</strong> — a tre leghe a est.</p><p><em>"Gli elfi di Liraneth custodirono la prima chiave dei Sigilli. Se qualcosa sopravvive là sotto, potrebbe servire."</em></p><p>Ti porge anche un piccolo specchio d'argento. <em>"Se ti trovi davanti a Malachar, mostragli questo prima di combattere. Non ti dico perché. Fidati."</em></p>`,choices:[{text:"Seguire la mappa verso le rovine elfiche di Liraneth",next:"elf_ruins",effect:{o:1}},{text:"Prendere lo specchio e andare direttamente al castello",next:"castle_ruins",effect:{c:2}}]},

tower_white:{chapter:"Capitolo I",title:"L'Arte della Luce Silenziosa",bg:"tower",text:`<p>Vethoran ti insegna per tre giorni. Non le magie spettacolari del grimorio, ma cose sottili: leggere la paura negli occhi di un nemico, sentire dove scorre la corrente magica nel terreno, calmare una mente agitata con una sola parola.</p><p>Il terzo giorno ti dice: <em>"Ora hai gli strumenti per non dover mai uccidere ciò che non capisci."</em></p><p>Ti dà anche una lettera sigillata. <em>"Consegnala ad Aerindel degli Elfi Stellari. Sa già chi sei, anche se tu non lo sai ancora."</em></p>`,choices:[{text:"Andare dagli Elfi Stellari con la lettera di Vethoran",next:"elf_patrol",effect:{m:1,o:2}},{text:"Andare prima al castello per valutare le forze di Malachar",next:"castle_ruins",effect:{c:1,m:1}}]},

elf_patrol:{chapter:"Capitolo I",title:"Gli Elfi delle Stelle",bg:"elf_city",text:`<p>La pattuglia si muove come vento tra gli alberi. Cinque elfi in armature di corteccia d'argento, con archi lunghi quanto i loro corpi.</p><p>La loro guida è <strong>Aerindel</strong>: capelli color notte, occhi color ametista, un'espressione che ha visto tramontare troppi soli.</p><p>Si ferma davanti a te. Ti scruta. <em>"Stai cercando qualcosa che non sai di cercare,"</em> dice. Un elfo giovane tende l'arco. Aerindel lo ferma con un gesto. <em>"Abbassa. Il Cercatore era atteso."</em></p><p>Come sa chi sei?</p>`,choices:[{text:"Presentarti con piena onestà — anche dei tuoi dubbi e della tua ignoranza",next:"elf_trust",effect:{o:1}},{text:"Chiedere subito e direttamente dove si trova Malachar",next:"elf_malachar",effect:{c:1}},{text:"Mostrare la lettera di Vethoran",next:"elf_trust",effect:{m:1,o:1},requires:"has_letter"}]},

elf_trust:{chapter:"Capitolo II",title:"L'Albero che Parla",bg:"elf_city",text:`<p>Aerindel ti conduce dove un albero antico quanto il mondo — <strong>Yldrathar, l'Albero Parlante</strong> — si erge così alto che la cima si perde tra le stelle.</p><p>La corteccia pulsa di luce verde. Avvicini la mano. L'albero parla nella tua mente con immagini: vedi Malachar com'era una volta, un re giusto. Poi vedi il momento in cui tutto cambia: un membro del <strong>Consiglio degli Anziani Elfici</strong> che versa qualcosa nell'acqua del re. Un veleno non per il corpo. Per l'anima.</p><p>Aerindel ha gli occhi lucidi. <em>"Lo sapevo da vent'anni. Non ho mai avuto prove. Ora ce le hai tu."</em></p>`,choices:[{text:"Rivelare questa verità davanti all'intero Consiglio degli Anziani",next:"elf_reveal",effect:{o:1,c:1}},{text:"Agire da solo — il Consiglio potrebbe essere corrotto",next:"solo_mission",effect:{c:2}},{text:"Chiedere ad Aerindel chi sia il traditore nel Consiglio",next:"elf_secret",effect:{o:1,m:1}}]},

elf_secret:{chapter:"Capitolo II",title:"Il Tradimento Antico",bg:"elf_city",text:`<p>Aerindel abbassa la voce fino a un sussurro quasi indistinguibile dal fruscio delle foglie.</p><p><em>"Il suo nome è <strong>Caelindor</strong>. Il più grande degli anziani. Il miglior amico di Malachar prima che diventasse re. Quando capì che non sarebbe mai stato uguale a lui... scelse l'odio."</em></p><p>Ti mostra un sigillo inciso nel palmo — una runa bruciata nella carne viva. <em>"Questo è il marchio con cui Caelindor controlla le sue vittime. Malachar ce l'ha sull'anima."</em></p><p>Sopra di voi, un'aquila nera — l'uccello spia di Caelindor — vi osserva prima di volare via verso nord. Siete stati scoperti.</p>`,choices:[{text:"Correre al Consiglio prima che Caelindor cancelli le prove",next:"elf_reveal",effect:{c:2}},{text:"Andare direttamente da Caelindor con questa conoscenza",next:"caelindor_confront",effect:{c:2,o:1}},{text:"Nascondersi e raccogliere prove concrete di notte",next:"elf_night",effect:{m:1,o:1}}]},

elf_reveal:{chapter:"Capitolo III",title:"La Voce nel Consiglio",bg:"elf_city",text:`<p>La sala del Consiglio degli Anziani Elfici è silenziosa come una tomba. Dodici elfi dai capelli bianchi ti osservano con occhi che hanno visto passare i secoli.</p><p>Parli. Racconti tutto. La metà del Consiglio si alza dalla tua parte. L'altra metà indica Aerindel con un dito accusatore.</p><p>Caelindor — un elfo con occhi grigi come lame — si alza lentamente. <em>"Interessante storia. Troppo interessante per essere vera."</em> Sorride. <em>"Arrestateli entrambi."</em></p><p>Le guardie si muovono. Hai un secondo.</p>`,choices:[{text:"Sfidare Caelindor a un duello — chi mente non ha il coraggio di combattere",next:"caelindor_duel",effect:{c:2,o:1}},{text:"Fuggire con Aerindel e trovare prove concrete",next:"elf_escape",effect:{m:1}},{text:"Cedere all'arresto — dentro il carcere elfico trovi alleati inaspettati",next:"elf_prison",effect:{o:1}}]},

elf_malachar:{chapter:"Capitolo I",title:"I Segreti del Re Oscuro",bg:"elf_city",text:`<p>Aerindel si siede su una radice e ti guarda. <em>"Malachar vive nell'antica torre di Valdrak, a nord. Ma non puoi sconfiggerlo con le armi né con la magia — il suo corpo è diventato pietra dall'interno."</em></p><p><em>"C'è solo una cosa che lo può fermare: il <strong>Frammento del Primo Sigillo</strong>, nascosto nelle catacombe sotto il Castello Cadente. Usalo all'alba."</em></p><p>Si ferma. <em>"Ma il castello è sorvegliato dal Generale Khal."</em></p>`,choices:[{text:"Andare subito al castello per trovare il Frammento",next:"castle_ruins",effect:{c:1}},{text:"Chiedere agli elfi di unirsi a te nell'impresa",next:"elf_convergence",effect:{o:1}}]},

elf_ruins:{chapter:"Capitolo I",title:"Liraneth Sepolta",bg:"dungeon",text:`<p>Le rovine di Liraneth emergono dalla terra come ossa di un gigante antico. Al centro, un portale di pietra bianca con un guardiano: una <strong>Sentinella di Alabastro</strong>, un golem elfico alto tre metri, gli occhi incastonati di smeraldo.</p><p>La Sentinella parla in elfico antico. Le parole si traducono nella tua mente: <em>"Chi bussa alla porta dei morti deve rispondere a tre verità. Una su se stesso, una sul mondo, una sul nemico che porta in cuore."</em></p>`,choices:[{text:"Rispondere con piena onestà alle tre domande della Sentinella",next:"elf_portal",effect:{o:2}},{text:"Attaccare la Sentinella — non hai tempo per enigmi",next:"ruins_fight",effect:{c:1}}]},

elf_portal:{chapter:"Capitolo II",title:"La Cripta dei Primi Elfi",bg:"dungeon",text:`<p>Le tue verità risuonano nella pietra. La Sentinella si fa da parte. Il portale si apre su una scala che scende nelle viscere della terra.</p><p>Là sotto, al centro di una stanza circolare su un altare di ossidiana: il <strong>Frammento del Primo Sigillo</strong>. Un cristallo che contiene dentro di sé un'alba intera.</p><p>Sulle pareti, migliaia di simboli: il <strong>Rituale di Chiusura Completa</strong>. Il prezzo è scritto chiaro: <em>chi chiude il Sigillo rimane nell'oscurità eterna a tenerlo chiuso. Per sempre.</em></p>`,choices:[{text:"Prendere il Frammento e andare al castello",next:"castle_ruins",effect:{c:1}},{text:"Copiare il Rituale — potrebbe servirci quella scelta",next:"ancient_ritual",effect:{m:1,o:1}}]},

ruins_fight:{chapter:"Capitolo I",title:"Pietra e Sangue",bg:"battle",text:`<p>La Sentinella non attacca. Alza semplicemente un braccio e ti scaglia contro il muro con la forza di una valanga. Ti rialzi sanguinante, con tre costole probabilmente fratturate.</p><p><em>"La forza non è chiave,"</em> dice la Sentinella. E torna immobile.</p><p>Hai perso tempo e stai perdendo sangue. Devi andare avanti lo stesso.</p>`,choices:[{text:"Andare alle rovine del castello, ferito ma determinato",next:"castle_ruins",effect:{c:1}},{text:"Tornare da Vethoran per farti curare",next:"tower_approach",effect:{}}]},

elf_convergence:{chapter:"Capitolo III",title:"L'Alleanza Impossibile",bg:"elf_city",text:`<p>Uomini ed elfi si trovano per la prima volta in cent'anni. I sopravvissuti del castello si mescolano con i guerrieri di Aerindel. Nessuno si fida completamente dell'altro. Ma sanno che separati non sopravviveranno.</p><p>Aerindel parla. Poi Sir Edran, il vecchio cavaliere. Poi una giovane donna che dice di aver visto Malachar da vicino: <em>"Non combatte come un mostro. Combatte come qualcuno che soffre."</em></p><p>Il silenzio che segue è diverso da prima. È un silenzio che pensa.</p>`,choices:[{text:"Guidare l'alleanza verso il castello con un assalto coordinato",next:"dark_king_battle",effect:{c:1,o:1}},{text:"Proporre di cercare prima di combattere — capire chi è davvero Malachar",next:"dark_king_truth",effect:{o:2,m:1}}]},

caelindor_confront:{chapter:"Capitolo III",title:"Il Vecchio Veleno",bg:"elf_city",text:`<p>Caelindor è nel suo studio, circondato di mappe e rune. Sembra sapere che saresti arrivato.</p><p><em>"Hai scoperto la verità,"</em> dice senza alzare gli occhi. <em>"Bravo. Peccato che la verità da sola non salvi nessuno."</em></p><p>Si gira. I suoi occhi grigi hanno qualcosa che quasi riconosci come dolore. <em>"Malachar era mio fratello di sangue giurato. Mi abbandonò per diventare re. Settanta elfi morirono che avrebbero potuto essere salvati."</em></p><p>Alza la mano. Un sortilegio comincia a formarsi.</p>`,choices:[{text:"Attaccare prima che il sortilegio sia completo",next:"caelindor_duel",effect:{c:2}},{text:"Fermare il sortilegio con le parole — capire il suo dolore",next:"caelindor_redeem",effect:{o:3}}]},

caelindor_duel:{chapter:"Capitolo III",title:"Il Duello degli Opposti",bg:"battle",text:`<p>Il duello dura mezz'ora. Caelindor è preciso come un bisturi, carico di cinquant'anni di odio affilato. Ma tu combatti per qualcosa che speri ancora di salvare.</p><p>Alla fine lo disarmi. È in ginocchio, esausto, il viso solcato da lacrime che forse piange per la prima volta da decenni.</p><p><em>"Perché non mi uccidi?"</em> chiede.</p>`,choices:[{text:"Dirgli che solo lui può spezzare l'incantesimo su Malachar — questa è la sua redenzione",next:"caelindor_redeemed",effect:{o:2}},{text:"Lasciarlo e andare da Malachar — non hai tempo per redenzioni",next:"dark_king_truth",effect:{c:1}}]},

caelindor_redeem:{chapter:"Capitolo III",title:"La Cicatrice del Tradimento",bg:"elf_city",text:`<p>Le tue parole lo colpiscono più di qualsiasi magia. Gli parli di Malachar prima della corruzione — un re che amava il suo popolo. Il sortilegio di Caelindor si spegne come una candela.</p><p><em>"Credevo di odiarlo,"</em> dice piano. <em>"Ma l'ho continuato a guardare dall'alto per cinquant'anni. Non si guarda così qualcuno che si odia davvero."</em></p><p>Dopo un lungo silenzio: <em>"Posso spezzare l'incantesimo. Ma devo essere presente quando affronti Malachar."</em></p>`,choices:[{text:"Accettare l'aiuto di Caelindor — è il suo crimine, è sua la redenzione",next:"caelindor_redeemed",effect:{o:1,m:1}}]},

caelindor_redeemed:{chapter:"Capitolo III",title:"L'Alleato Insperato",bg:"elf_city",text:`<p>Caelindor si alza. Più vecchio di qualche secondo fa, ma più leggero di qualche decennio.</p><p><em>"Quando vedrai Malachar, dimmi solo una parola: 'ricorda'. Il resto lo faccio io."</em></p><p>Aerindel entra nella stanza. Guarda Caelindor con occhi che devono decidere se perdonare è possibile. Poi gli mette una mano sulla spalla.</p><p><em>"Vieni. C'è ancora un re da salvare."</em></p>`,choices:[{text:"Procedere tutti insieme verso la torre di Malachar",next:"dark_king_truth",effect:{o:1,m:1}}]},

elf_escape:{chapter:"Capitolo III",title:"La Prova Nascosta",bg:"dungeon",text:`<p>Fuggite dal Consiglio nel cuore della notte. Aerindel ti porta in un nascondiglio sotto le radici dell'Albero Parlante. Lì, in una scatola di legno scuro, c'è il dossier che Aerindel ha raccolto in vent'anni: testimonianze, frammenti di rune, il resoconto di tre elfi presenti la notte dell'avvelenamento.</p><p>All'alba, torni al Consiglio. Non come accusato — come testimone. Questa volta, anche gli scettici non possono più ignorare la verità.</p>`,choices:[{text:"Liberare Caelindor affinché si redima da solo",next:"caelindor_redeem",effect:{o:2}},{text:"Procedere direttamente verso Malachar con le prove",next:"dark_king_truth",effect:{c:1,o:1}}]},

elf_prison:{chapter:"Capitolo II",title:"Voci tra le Sbarre",bg:"dungeon",text:`<p>Il carcere elfico profuma di muschio. In una cella adiacente trovi un prigioniero inaspettato: <strong>Sir Edran</strong>, il vecchio cavaliere del Castello Cadente. Catturato da Caelindor due giorni fa mentre portava un messaggio.</p><p>In tre ore di conversazione impari tutto: la posizione di Malachar, le sue debolezze, la mappa delle segrete sotto il castello. E soprattutto: <em>"Il Frammento del Primo Sigillo è nelle catacombe. Ma serve un elfo puro per attivarlo."</em></p><p>Aerindel, nella cella accanto, ha sentito tutto. <em>"Sono io il tuo elfo puro."</em> La guardia più giovane — quella con ancora i dubbi in faccia — vi lascia passare in silenzio.</p>`,choices:[{text:"Correre al castello con Edran e Aerindel",next:"elf_convergence",effect:{o:1,c:1}}]},

elf_night:{chapter:"Capitolo III",title:"Il Piano delle Ombre",bg:"elf_city",text:`<p>Aspettate la luna alta. Aerindel ti porta attraverso passaggi segreti nel tronco dell'Albero Parlante. Di notte, lo studio di Caelindor è vuoto. Ma le prove ci sono — scritte con la sua stessa mano in un diario che ha l'arroganza di chi non crede di essere mai trovato.</p><p>Aerindel legge ad alta voce le ultime pagine. La sua voce non trema. Le sue mani sì. All'alba, avete tutto. E la scelta su come usarlo.</p>`,choices:[{text:"Portare le prove al Consiglio, smascherare Caelindor pubblicamente",next:"elf_reveal",effect:{o:2}},{text:"Andare direttamente da Caelindor con il suo diario in mano",next:"caelindor_confront",effect:{c:1}}]},

solo_mission:{chapter:"Capitolo III",title:"La Strada Solitaria",bg:"forest",text:`<p>Vai da solo. La notte è buona copertura e la solitudine è una forma di chiarezza.</p><p>Conoscendo la verità su Malachar — che è una vittima tanto quanto un tiranno — ti muovi verso il castello con qualcosa di diverso dalla semplice determinazione.</p><p>Il castello di Valdrak si staglia all'orizzonte. Non un esercito. Non alleati. Solo la consapevolezza che a volte le guerre più importanti si combattono in due.</p>`,choices:[{text:"Affrontare Malachar sapendo la verità sul suo passato",next:"dark_king_truth",effect:{o:1,c:1}}]},

castle_ruins:{chapter:"Capitolo I",title:"Le Rovine di Lyrandel",bg:"castle",text:`<p>Il Castello di Lyrandel era, un secolo fa, "un gioiello di pietra bianca che sfidava il cielo". Ciò che rimane: un fossato prosciugato, mura sventrate, una torre ancora in piedi per una ragione che sfida la logica architettonica.</p><p>Circa quaranta sopravvissuti hanno trasformato le rovine in accampamento. Al centro del fuoco, un uomo anziano con armatura arrugginita che valeva una fortuna vent'anni fa.</p><p><em>"Mi chiamo <strong>Sir Edran</strong>,"</em> dice. <em>"Ex primo cavaliere di Malachar, prima che Malachar diventasse quello che è diventato. E tu sei il Cercatore di cui parlava la profezia."</em></p><p>Di nuovo. La profezia. Come la sanno tutti tranne te?</p>`,choices:[{text:"Ascoltare tutto quello che Edran sa su Malachar e sul castello",next:"castle_survivors",effect:{o:1}},{text:"Chiedere di entrare nelle segrete per trovare il Frammento del Primo Sigillo",next:"castle_dungeons",effect:{c:1,m:1}},{text:"Proporre di organizzare una resistenza armata prima di qualsiasi altra mossa",next:"castle_resistance",effect:{c:1,o:1}}]},

castle_survivors:{chapter:"Capitolo II",title:"Il Consiglio dei Sopravvissuti",bg:"castle",text:`<p>Edran parla per due ore davanti al fuoco. <em>"Malachar aveva una debolezza: la pietà. Era il suo lato migliore, non un difetto. Ma qualcuno gliela tolse. Lo vidi cambiare nel giro di una notte."</em></p><p>Ti mostra una mappa del castello di Valdrak. <em>"Il Generale Khal sorveglia l'unico accesso. Era il miglior uomo che conoscessi. Ora è qualcos'altro."</em></p><p>Una giovane donna si avvicina. <em>"Ero la cuoca di Khal. Mi lascia ancora portare il pane ai prigionieri. Potrei farti entrare."</em></p>`,choices:[{text:"Usare la strada della cuoca per infiltrarsi nel castello",next:"castle_infiltrate",effect:{m:1,o:1}},{text:"Sfidare il Generale Khal in combattimento aperto",next:"castle_general",effect:{c:2}}]},

castle_dungeons:{chapter:"Capitolo II",title:"Le Segrete Dimenticate",bg:"dungeon",text:`<p>Le segrete sono buie e umide. Torce tremolanti. Poi senti una voce bassa che canta in elfico antico — una melodia triste e determinata insieme.</p><p>Apri lo spioncino di una cella. <strong>Aerindel</strong>. L'elfa dagli occhi ametista, prigioniera da tre giorni.</p><p>Ti guarda senza sorpresa. <em>"Il Cercatore è puntuale. C'è un Frammento del Primo Sigillo nell'ultima cella a sinistra. Ma hai bisogno di me per attivarlo — solo un elfo può parlare la lingua che capisce."</em></p>`,choices:[{text:"Liberare Aerindel e andare insieme al Frammento",next:"elf_alliance",effect:{o:2}},{text:"Prendere il Frammento da solo e trovare poi il modo",next:"fragment_solo",effect:{c:1}}]},

castle_resistance:{chapter:"Capitolo II",title:"La Fortezza dei Dimenticati",bg:"castle",text:`<p>Ci vogliono sette giorni. Sette giorni di lavoro febbrile: rinforzare i muri, trasformare sopravvissuti in guerrieri. Alla fine, le rovine di Lyrandel sono diventate qualcosa di diverso: non più macerie, ma un baluardo. Quaranta persone che hanno scelto di rimanere quando potevano scappare.</p><p>L'ottavo giorno, arrivano gli elfi di Aerindel dall'est. Evidentemente aspettavano un segno.</p>`,choices:[{text:"Unire le forze con gli elfi e marciare come alleanza",next:"elf_convergence",effect:{o:1,c:1}}]},

castle_infiltrate:{chapter:"Capitolo III",title:"Il Pane e la Spada",bg:"castle",text:`<p>La cuoca — si chiama Mira — ti nasconde in un grande cesto di pane. Non è dignitoso. Ma funziona.</p><p>Dal cesto senti voci, odori, il passo pesante di guardie. Poi il cesto si apre: sei nel magazzino. Mira ti dà in trenta secondi tutto: dove dorme Khal, dove sono i prigionieri, dove il Frammento.</p>`,choices:[{text:"Liberare prima Aerindel — hai bisogno di lei per il Frammento",next:"elf_alliance",effect:{o:1}},{text:"Trovare prima il Frammento poi liberare Aerindel",next:"fragment_solo",effect:{c:1,m:1}},{text:"Affrontare Khal mentre cena — momento di vulnerabilità",next:"castle_general",effect:{c:2}}]},

castle_general:{chapter:"Capitolo III",title:"Il Generale Khal",bg:"battle",text:`<p>Il Generale Khal è esattamente come te lo avevano descritto: immenso, armatura nera non pulita da mesi, occhi che guardano tutto con la stanchezza di chi fa cose orribili da così tanto tempo da aver smesso di trovarle tali.</p><p>Blocca il corridoio con il solo peso della sua presenza.</p><p><em>"Cercatore,"</em> dice con voce grave. <em>"Ho sentito il tuo nome tre volte oggi. I corvi di Malachar. La profezia. E un vecchio cavaliere che ancora prega per me ogni mattina."</em></p><p>Una piccola pausa. <em>"Edran."</em> Non dice altro.</p>`,choices:[{text:"Combattere Khal con tutto quello che hai",next:"castle_fight",effect:{c:2}},{text:"Parlargli di Edran — ricordargli chi era prima di tutto questo",next:"khal_redeem",effect:{o:2}},{text:"Dirgli la verità su Malachar — che è una vittima, non un tiranno",next:"khal_truth",effect:{m:1,o:2}}]},

castle_fight:{chapter:"Capitolo III",title:"Ferro contro Ferro",bg:"battle",text:`<p>Il combattimento è il più duro della tua vita. Khal non combatte con odio — combatte con la determinazione di chi ha smesso di distinguere tra sopravvivere e morire. Dura venti minuti che sembrano venti anni.</p><p>Alla fine, Khal è a terra, disarmato. Potresti finirlo. Non lo fai. Lui apre gli occhi. Qualcosa nel suo sguardo è cambiato.</p><p><em>"Vai,"</em> dice. <em>"E se riesci a salvarlo davvero... digli che mi dispiace."</em></p>`,choices:[{text:"Procedere verso Malachar",next:"castle_victory",effect:{c:1,o:1}}]},

khal_redeem:{chapter:"Capitolo III",title:"L'Uomo Dentro l'Armatura",bg:"castle",text:`<p>Parli di Edran. Di come prega ancora per Khal ogni mattina. Di come non ha mai smesso di chiamarlo "il mio generale".</p><p>Khal non dice nulla per molto tempo. Le spalle si contraggono — sta lottando contro qualcosa di più grande di te. <em>"Sono dieci anni che non sento il suo nome,"</em> dice alla fine.</p><p>Si gira. Ha tolto i guanti. Le sue mani sono quelle di un uomo che una volta costruiva cose. <em>"Cosa mi chiedi di fare?"</em></p>`,choices:[{text:"Chiedergli solo di stare fermo e lasciarti passare",next:"castle_victory",effect:{o:1}},{text:"Chiedergli di combattere al tuo fianco contro Malachar",next:"khal_joins",effect:{o:2,c:1}}]},

khal_truth:{chapter:"Capitolo III",title:"Il Peso della Verità",bg:"castle",text:`<p>Gli racconti tutto. Caelindor. Il veleno nell'anima. Malachar come vittima e non solo tiranno.</p><p>Khal ascolta immobile come una montagna. Poi: <em>"Lo sapevo. Gli occhi di chi sceglie il male sono diversi dagli occhi di chi è costretto al male."</em></p><p>Si sposta di lato. <em>"Vai. Se riesci a salvarlo, torna a dirmi una parola. Qualsiasi parola."</em></p>`,choices:[{text:"Passare oltre e correre verso Malachar",next:"dark_king_truth",effect:{m:1,o:1}}]},

khal_joins:{chapter:"Capitolo III",title:"Il Generale Ritrovato",bg:"castle",text:`<p>Per la prima volta in dieci anni, Khal toglie l'armatura nera. Sotto c'è quella d'argento — quella che indossava prima, quella che non ha mai arrugginito perché non l'ha mai dimenticata.</p><p>Edran, nascosto dalla porta, entra nella stanza. Non dice nulla. Si limita a posare una mano sulla spalla dell'amico.</p><p>Tre persone camminano verso Malachar: il Cercatore, l'ex generale, il vecchio cavaliere. Forse è questo che la profezia intendeva.</p>`,choices:[{text:"Marciare insieme verso la torre di Malachar",next:"dark_king_truth",effect:{o:2,c:1}}]},

castle_victory:{chapter:"Capitolo III",title:"La Strada Aperta",bg:"castle",text:`<p>Il corridoio si apre davanti a te. Le guardie si sono dissolte. Sali la scala a spirale della torre di Valdrak — ogni gradino risuona come un tamburo. La luce in cima è rossa come sangue antico.</p><p>Prima di entrare nella stanza finale, ti fermi. Respiri. Pensi a tutti coloro che ti hanno portato fino qui. Poi apri la porta.</p>`,choices:[{text:"Entrare nella stanza di Malachar",next:"dark_king_battle",effect:{c:1}}]},

elf_alliance:{chapter:"Capitolo III",title:"L'Elfa Liberata",bg:"dungeon",text:`<p>La serratura cede. Aerindel esce senza fretta — la dignità di chi non corre mai. Ti porta all'ultima cella. Al centro, su un piedistallo di pietra nera, il <strong>Frammento del Primo Sigillo</strong> pulsa di luce bianca. Aerindel alza le mani, parla in elfico antico, e il Frammento si posa sul tuo palmo come una piuma.</p><p>È caldo. Non come il fuoco — come la mano di qualcuno che ti vuole bene.</p><p><em>"Solo chi porta entrambe le nature può usarlo senza morire,"</em> dice Aerindel. Non finisce la frase. Non deve.</p>`,choices:[{text:"Procedere verso Malachar con il Frammento e Aerindel al tuo fianco",next:"dark_king_truth",effect:{m:1,o:1}},{text:"Affrontare prima Khal con Aerindel come alleata",next:"castle_general",effect:{c:1,o:1}}]},

fragment_solo:{chapter:"Capitolo III",title:"Il Peso del Frammento",bg:"dungeon",text:`<p>Trovi il Frammento. È dietro una porta sigillata che si apre — forse perché non ti teme. Lo tieni in mano. È freddo. Non risponde come Aerindel aveva descritto — non si solleva, rimane inerte come una pietra. Hai bisogno di lei. Ma quando torni alla sua cella, è vuota.</p>`,choices:[{text:"Andare da Malachar con il Frammento inerte — troverai un modo",next:"dark_king_battle",effect:{c:2}},{text:"Cercare Aerindel nel castello prima di procedere",next:"castle_general",effect:{o:1}}]},

ancient_ritual:{chapter:"Capitolo III",title:"Il Rituale degli Antichi",bg:"ritual",text:`<p>Il cerchio di pietre è antico quanto il regno. Le rune scolpite sui massi pulsano al ritmo del tuo respiro come se ti aspettassero da prima che nascessi.</p><p>Mentre reciti le prime sillabe, capisci: il Rituale non distrugge Malachar. Lo <em>ricorda a se stesso.</em> Spezza l'incantesimo dall'interno. Ma richiede che chi lo esegue abbia entrambe le nature in equilibrio — luce e oscurità che non si combattono.</p><p>Senti entrambe le nature dentro di te. Per la prima volta, non sono in guerra.</p>`,choices:[{text:"Procedere verso Malachar con la forza del Rituale",next:"dark_king_truth",effect:{m:2,o:1},condition:()=>S.m<4},{text:"Lasciarti andare completamente alla corrente — il confine tra te e la magia svanisce",next:"ending_ascended",effect:{m:2},condition:()=>S.m>=4}]},

dark_king_battle:{chapter:"Capitolo Finale",title:"La Torre di Valdrak",bg:"castle",text:`<p>Malachar ti aspetta in cima alla torre. Non è seduto su un trono — è in piedi davanti alla finestra, guardando il regno che ha distrutto.</p><p>È più piccolo di come te lo immaginavi. Non più grande della vita — più piccolo. Come qualcuno che si è consumato dall'interno.</p><p>Si gira. I suoi occhi sono vuoti come specchi rotti. Ma per un istante, dentro quella vacuità, scorgi qualcosa che assomiglia a sollievo.</p><p><em>"Sei arrivato. Speravo che qualcuno arrivasse. Ma non so se è per essere salvato o per finire."</em></p>`,choices:[{text:"Combattere Malachar con tutte le forze — il regno prima di tutto",next:"battle_ending",effect:{c:1}},{text:"Abbassare l'arma e parlargli — questa non è una normale battaglia",next:"dark_king_truth",effect:{o:1,m:1}}]},

battle_ending:{chapter:"Capitolo Finale",title:"Il Prezzo della Vittoria",bg:"battle",text:`<p>Il combattimento è devastante. Malachar non combatte con odio — combatte con la determinazione di chi vuole finirla in un modo o nell'altro. Alla fine, è a terra. Il castello trema. I Sigilli Rotti pulsano sopra come ferite aperte nel cielo.</p><p>Hai un solo momento per scegliere cosa fare di questa vittoria.</p>`,choices:[{text:"Usare il Frammento per richiudere i Sigilli — anche a costo della tua vita",next:"ending_martyr",effect:{o:2,c:1}},{text:"Fuggire con la vittoria — i Sigilli forse si richiuderanno da soli",next:"ending_fugitive",effect:{c:1}}]},

dark_king_truth:{chapter:"Capitolo Finale",title:"Il Re che Era",bg:"castle",text:`<p>Parli. Non di battaglie. Di Edran che prega ogni mattina. Di Aerindel che cantava in una cella buia. Di Caelindor che ha trasformato l'amore fraterno in veleno.</p><p>Malachar non si muove mentre parli. Poi porta una mano alla fronte — e senti quello che sta sentendo: qualcosa si scioglie dentro di lui, come ghiaccio sotto il sole. Le rune nere sulla sua pelle cominciano a svanire.</p><p><em>"Non ricordavo il mio nome,"</em> dice alla fine, con una voce che non ha più quel timbro vuoto. <em>"Il mio nome vero. Malachar era il nome del sortilegio."</em></p><p>Si mette le mani sulle ginocchia, esausto. <em>"Come finisce questa storia?"</em></p>`,choices:[{text:"Con lui che aiuta a richiudere i Sigilli — ha ancora il potere di farlo",next:"ending_hero",effect:{o:2}},{text:"Con la tua vita come prezzo per chiudere i Sigilli per sempre",next:"ending_martyr",effect:{o:2,c:2}},{text:"Non lo sai — ma per la prima volta non hai paura di scoprirlo",next:"ending_hero_alt",effect:{o:1,c:1}}]},

dark_king_negotiate:{chapter:"Capitolo Finale",title:"La Trattativa Impossibile",bg:"castle",text:`<p>Proponi un accordo. Malachar ti ascolta. Dipende da chi sei diventato lungo il cammino.</p>`,choices:[{text:"Offrirti come nuovo servitore in cambio della vita degli innocenti",next:"ending_betrayer",effect:{o:-3}},{text:"Offrirti come testimone della sua vera storia — la verità in cambio della pace",next:"dark_king_truth",effect:{o:1}}]},

// ── ENDINGS ─────────────────────────────────────────────
ending_hero:{chapter:"Fine",title:"L'Alba del Nuovo Regno",bg:"ending_hero",isEnding:true,type:"Eroe della Luce",text:`<p>I Sigilli si richiudono con un suono che assomiglia alla prima nota di una canzone dimenticata.</p><p>Il re — non più Malachar, ora solo un uomo che fatica ancora a pronunciare il proprio nome — guarda le proprie mani con l'espressione di qualcuno che scopre di avere ancora un corpo.</p><p>Fuori dalla torre, l'alba di sangue si trasforma in alba vera. Il cielo diventa oro.</p><p>Aerindel trova Edran. Khal trova Aerindel. Il vecchio cavaliere e il generale fanno la stessa cosa: ridono, poi piangono, poi tornano a ridere perché non ricordano più quale sia la differenza.</p><p>E tu? Sei ancora il Cercatore. Ma ora sai cosa stavi cercando. <em>Non una vittoria. Una possibilità.</em></p><p style="text-align:center;margin-top:1.5rem;font-family:'Cinzel',serif;font-size:.8rem;letter-spacing:.35em;color:#8a6820">✦ FINE VERA ✦</p>`,choices:[]},

ending_hero_alt:{chapter:"Fine",title:"Il Viaggio Continua",bg:"ending_hero",isEnding:true,type:"Il Cercatore Trovato",text:`<p>Non esiste una formula magica. Non esiste un finale perfetto.</p><p>Ma i Sigilli si richiudono lo stesso, perché quella frase — <em>"non so, ma non ho paura"</em> — era la risposta giusta all'enigma del guardiano di pietra, all'Albero Parlante, al grimorio, a tutto.</p><p>Il re si addormenta nella torre e quando si sveglia non è più re. È solo un uomo con un passato difficile e un futuro aperto come un campo dopo la pioggia.</p><p>Qualcuno dovrà ricostruire Aetherion. Sarà lento, imperfetto, meraviglioso. Tu sei già sulla prossima strada.</p><p style="text-align:center;margin-top:1.5rem;font-family:'Cinzel',serif;font-size:.8rem;letter-spacing:.35em;color:#8a6820">✦ FINE DEL VIAGGIO ✦</p>`,choices:[]},

ending_dark_king:{chapter:"Fine",title:"Il Trono che Divora",bg:"ending_dark",isEnding:true,type:"Il Nuovo Re Oscuro",text:`<p>Il grimorio ha finito di leggere te. Ora sei tu.</p><p>Malachar cade non per la tua spada ma per il peso di ciò che sei diventato — qualcosa di più vecchio e più freddo di lui. Ti guarda dall'alto del pavimento e nella sua ultima espressione c'è qualcosa che non ti aspettavi: <em>sollievo.</em></p><p>Il trono è tuo. I Sigilli rimangono aperti. L'oscurità che scorre attraverso di te è troppo simile all'aria per rinunciarci.</p><p>Fuori, la gente sussurra un nuovo nome nelle strade buie. Non è il tuo nome. Non lo è mai stato. Ma ora è l'unico che ricordi.</p><p style="text-align:center;margin-top:1.5rem;font-family:'Cinzel',serif;font-size:.8rem;letter-spacing:.35em;color:#8b1a1a">✦ FINE OSCURA ✦</p>`,choices:[]},

ending_martyr:{chapter:"Fine",title:"Il Prezzo del Sigillo",bg:"ending_martyr",isEnding:true,type:"Il Martire Eterno",text:`<p>Il Frammento si scalda nel tuo palmo. Sai cosa ti chiede. L'hai sempre saputo.</p><p>Chi chiude il Sigillo non può attraversarlo mai più. Rimarrà nell'oscurità eterna a tenere chiusa la porta.</p><p>Lo fai lo stesso.</p><p>L'ultimo suono che senti dal mondo è la risata di Aerindel — una risata di sollievo, di pianto, di gratitudine impossibile da contenere. E la voce di Edran che dice un nome. Il tuo nome. Quello che hai cercato per tutta la storia.</p><p>Dall'altra parte non c'è oscurità. C'è silenzio. Un silenzio che ti conosce.</p><p style="text-align:center;margin-top:1.5rem;font-family:'Cinzel',serif;font-size:.8rem;letter-spacing:.35em;color:#c9a84c">✦ FINE DEL SACRIFICIO ✦</p>`,choices:[]},

ending_fugitive:{chapter:"Fine",title:"L'Uomo che Se ne Andò",bg:"ending_fugitive",isEnding:true,type:"Il Fuggitivo Solitario",text:`<p>Esci dal castello nella notte. Non corri — cammini. Come qualcuno che ha imparato che correre non aiuta.</p><p>Dietro di te, il cielo rimane rosso. I Sigilli rimangono aperti. Il mondo continuerà a sanguinare piano piano come una ferita non curata.</p><p>Ma tu sei vivo. Ed è possibile che essere vivi sia già qualcosa, in certi giorni.</p><p>La stella del mattino si accende all'orizzonte. La guardi. Non sai se è un segno o solo una stella. Decidi che non importa. Ti metti in cammino.</p><p style="text-align:center;margin-top:1.5rem;font-family:'Cinzel',serif;font-size:.8rem;letter-spacing:.35em;color:#888">✦ FINE DELL'ASSENZA ✦</p>`,choices:[]},

ending_betrayer:{chapter:"Fine",title:"La Corona Macchiata",bg:"ending_betrayer",isEnding:true,type:"Il Grande Traditore",text:`<p>Malachar accetta il tuo patto con una lentezza che senti come insulto. Come se avesse sempre saputo che saresti arrivato a offrire questo.</p><p>Lo fai. Con parole eleganti, con buone ragioni. Guadagni la vita di un piccolo gruppo di persone. È un bene reale — che tuttavia ha la forma del compromesso che ti sei raccontato di non fare mai.</p><p>Aerindel, mentre viene condotta via, non dice nulla. Ti guarda solo. E in quegli occhi ametista vedi qualcosa di peggio dell'odio: la comprensione.</p><p>Capisce perché lo hai fatto. Non ti perdona. Ma capisce.</p><p style="text-align:center;margin-top:1.5rem;font-family:'Cinzel',serif;font-size:.8rem;letter-spacing:.35em;color:#8b1a1a">✦ FINE DEL COMPROMESSO ✦</p>`,choices:[]},

ending_ascended:{chapter:"Fine",title:"Oltre i Nomi",bg:"ending_ascended",isEnding:true,type:"L'Asceso",text:`<p>Il Rituale degli Antichi non ti trasforma. Ti <em>rivela.</em></p><p>Ciò che eri — il Cercatore, il viaggiatore senza nome — si espande. Come qualcuno che torna a casa e scopre che la casa era sempre là, solo non la vedeva attraverso le finestre giuste.</p><p>I Sigilli si richiudono non per un'azione consapevole ma perché la tua presenza li chiude, come la presenza di qualcuno calmo calma una stanza.</p><p>Malachar ti guarda dall'altra parte della torre e capisce immediatamente. Si inginocchia — non per ossequio, ma per rispetto che va oltre le gerarchie.</p><p>Aerindel si siede sotto l'Albero Parlante e racconta la tua storia. Ogni versione è vera. Ogni versione è anche un'altra storia.</p><p style="text-align:center;margin-top:1.5rem;font-family:'Cinzel',serif;font-size:.8rem;letter-spacing:.35em;color:#7af5c4">✦ FINE DELL'INIZIO ✦</p>`,choices:[]}
};

// ── RENDER ───────────────────────────────────────────────────
let busy=false;
function render(id){
  const sc=STORY[id];
  if(!sc)return;
  document.getElementById('art').innerHTML=ARTS[sc.bg]||ARTS.forest;
  document.getElementById('chap').textContent=sc.chapter||'';
  document.getElementById('stitle').textContent=sc.title||'';
  document.getElementById('stxt').innerHTML=sc.text||'';
  upStats();
  const badge=document.getElementById('ebadge');
  const restb=document.getElementById('restb');
  if(sc.isEnding){badge.style.display='block';badge.querySelector('.bt').textContent='~ '+sc.type+' ~';restb.style.display='block'}
  else{badge.style.display='none';restb.style.display='none'}
  const chs=document.getElementById('chs');
  chs.innerHTML='';
  (sc.choices||[]).forEach(ch=>{
    if(ch.requires&&!F[ch.requires])return;
    if(ch.condition&&!ch.condition())return;
    const b=document.createElement('button');
    b.className='cb';b.textContent=ch.text;
    b.addEventListener('click',()=>goTo(ch.next,ch.effect));
    chs.appendChild(b);
  });
  document.getElementById('gc').scrollTop=0;
}

function goTo(id,eff){
  if(busy)return;busy=true;
  ae(eff);
  const ov=document.getElementById('ov');
  ov.classList.add('on');
  setTimeout(()=>{render(id);ov.classList.remove('on');busy=false},480);
}

function startGame(){
  S.c=0;S.m=0;S.o=0;Object.keys(F).forEach(k=>delete F[k]);
  const ov=document.getElementById('ov');ov.classList.add('on');
  setTimeout(()=>{
    document.getElementById('ts').style.display='none';
    document.getElementById('gc').style.display='block';
    render('start');ov.classList.remove('on');
  },550);
}

function restartGame(){
  S.c=0;S.m=0;S.o=0;Object.keys(F).forEach(k=>delete F[k]);
  const ov=document.getElementById('ov');ov.classList.add('on');
  setTimeout(()=>{
    document.getElementById('gc').style.display='none';
    document.getElementById('ts').style.display='block';
    ov.classList.remove('on');
  },480);
}

// ── BACKGROUND CANVAS ────────────────────────────────────────
const cnv=document.getElementById('bgc'),ctx=cnv.getContext('2d');
let stars=[],neb=[],af=0;
function resize(){cnv.width=innerWidth;cnv.height=innerHeight;initBg()}
function initBg(){
  stars=Array.from({length:180},()=>({x:Math.random()*cnv.width,y:Math.random()*cnv.height,r:Math.random()*1.4+.3,a:Math.random()*.7+.2,sp:Math.random()*.025+.005,ph:Math.random()*Math.PI*2}));
  neb=Array.from({length:5},()=>({x:Math.random()*cnv.width,y:Math.random()*cnv.height,r:Math.random()*180+80,col:['#1a0a2e','#0a1a2e','#0a2a1a','#1a0a0a','#0a0a2a'][Math.floor(Math.random()*5)]}));
}
function drawBg(){
  af++;ctx.fillStyle='#05050f';ctx.fillRect(0,0,cnv.width,cnv.height);
  neb.forEach(n=>{const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r);g.addColorStop(0,n.col+'42');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);ctx.fill()});
  stars.forEach(s=>{const a=s.a*(.7+.3*Math.sin(af*s.sp+s.ph));ctx.fillStyle=`rgba(255,255,240,${a})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()});
  requestAnimationFrame(drawBg);
}
window.addEventListener('resize',resize);
resize();drawBg();

// ── SETTINGS ────────────────────────────────────────────────
const PR=JSON.parse(localStorage.getItem('aeth_prefs')||'{}');
const SZS=['S','M','L','XL'];
const SZV={S:'.82rem',M:'.96rem',L:'1.1rem',XL:'1.26rem'};
const THS=[{k:'dark',i:'🌑',l:'Notte'},{k:'light',i:'☀️',l:'Luce'},{k:'sepia',i:'📜',l:'Seppia'},{k:'blue',i:'🌊',l:'Blu'}];

function applyPrefs(){
  document.documentElement.style.setProperty('--fs',SZV[PR.size||'M']);
  document.body.className=PR.theme&&PR.theme!=='dark'?'t-'+PR.theme:'';
}
function savePrefs(){localStorage.setItem('aeth_prefs',JSON.stringify(PR))}

(function buildSettings(){
  const szbx=document.getElementById('szbx');
  SZS.forEach(s=>{
    const b=document.createElement('button');
    b.className='szb'+((PR.size||'M')===s?' on':'');
    b.textContent=s;
    b.onclick=()=>{PR.size=s;document.documentElement.style.setProperty('--fs',SZV[s]);savePrefs();szbx.querySelectorAll('.szb').forEach(x=>x.classList.remove('on'));b.classList.add('on')};
    szbx.appendChild(b);
  });
  const thbx=document.getElementById('thbx');
  THS.forEach(t=>{
    const b=document.createElement('button');
    b.className='thb'+((PR.theme||'dark')===t.k?' on':'');
    b.textContent=t.i;b.title=t.l;
    b.onclick=()=>{PR.theme=t.k;document.body.className=t.k!=='dark'?'t-'+t.k:'';savePrefs();thbx.querySelectorAll('.thb').forEach(x=>x.classList.remove('on'));b.classList.add('on')};
    thbx.appendChild(b);
  });
})();

document.getElementById('settb').addEventListener('click',e=>{
  e.stopPropagation();
  document.getElementById('settp').classList.toggle('open');
});
document.addEventListener('click',e=>{
  if(!e.target.closest('#settb')&&!e.target.closest('#settp'))
    document.getElementById('settp').classList.remove('open');
});
applyPrefs();
</script>
